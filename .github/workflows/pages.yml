name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/improvisation-practice-game-voon91]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # build and deploy are separate jobs, as in GitHub's own Pages workflow: deploy-pages
  # looked the artifact up in the same second it was uploaded and twice found none
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js src icons brand fonts LICENSES.md _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
