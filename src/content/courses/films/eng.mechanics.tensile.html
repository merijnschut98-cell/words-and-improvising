</main><script type="application/json" id="film-data">{"id":"eng.mechanics.tensile","title":{"nl":"De trekproef","en":"The tensile test"},"lessons":["eng.mechanics.strength"],"scenes":[{"id":"s1","n":1,"level":1,"dur":32,"still":0.9,"title":{"nl":"Trekken tot hij breekt","en":"Pulling until it breaks"},"beats":[{"seg":{"nl":["Een trekbank: onderin een vaste klem, bovenin een dwarsbalk die omhoog loopt."],"en":["A testing machine: a fixed grip at the bottom, a crosshead at the top that moves up."]},"text":{"nl":"Een trekbank: onderin een vaste klem, bovenin een dwarsbalk die omhoog loopt.","en":"A testing machine: a fixed grip at the bottom, a crosshead at the top that moves up."},"speak":{"nl":"Een trekbank: onderin een vaste klem, bovenin een dwarsbalk die omhoog loopt.","en":"A testing machine: a fixed grip at the bottom, a crosshead at the top that moves up."},"cues":["grip","xh"],"still":0.188,"say":{"nl":["Dit is een trekbank. Onderin zit een vaste klem, bovenin een dwarsbalk die langzaam omhoog loopt. Daartussen klemmen we een ronde staaf van staal."],"en":["This is a tensile testing machine. At the bottom is a fixed grip, at the top a crosshead that slowly moves up. Between them we clamp a round steel test bar."]},"voice":{"nl":"Dit is een trekbank. Onderin zit een vaste klem, bovenin een dwarsbalk die langzaam omhoog loopt. Daartussen klemmen we een ronde staaf van staal.","en":"This is a tensile testing machine. At the bottom is a fixed grip, at the top a crosshead that slowly moves up. Between them we clamp a round steel test bar."}},{"seg":{"nl":["De ",{"t":"trekproef","c":"spec","k":"eng.mechanics.strength#0","en":"tensile test"},": een staaf uittrekken tot hij breekt, en spanning tegen rek uitzetten."],"en":["The ",{"t":"tensile test","c":"spec","k":"eng.mechanics.strength#0"},": pull a bar until it breaks, and plot stress against strain."]},"text":{"nl":"De trekproef (tensile test): een staaf uittrekken tot hij breekt, en spanning tegen rek uitzetten.","en":"The tensile test: pull a bar until it breaks, and plot stress against strain."},"speak":{"nl":"De trek-proef: een staaf uittrekken tot hij breekt, en spanning tegen rek uitzetten.","en":"The tensile test: pull a bar until it breaks, and plot stress against strain."},"cues":["cell","ext","spec"],"still":0.453,"say":{"nl":["Bij een ",{"t":"trekproef","k":"eng.mechanics.strength#0","en":"tensile test"}," trek je de staaf uit tot hij breekt. Een krachtopnemer meet de kracht, een rekopnemer op de staaf meet hoeveel langer hij wordt. De computer tekent daaruit de lijn van spanning tegen rek."],"en":["In a ",{"t":"tensile test","k":"eng.mechanics.strength#0"}," you pull the bar until it breaks. A load cell measures the force, and an extensometer on the bar measures how much longer it gets. From that the computer draws the line of stress against strain."]},"voice":{"nl":"Bij een trek-proef trek je de staaf uit tot hij breekt. Een krachtopnemer meet de kracht, een rekopnemer op de staaf meet hoeveel langer hij wordt. De computer tekent daaruit de lijn van spanning tegen rek.","en":"In a tensile test you pull the bar until it breaks. A load cell measures the force, and an extensometer on the bar measures how much longer it gets. From that the computer draws the line of stress against strain."}},{"seg":{"nl":["Spanning is kracht gedeeld door doorsnede, in MPa. Rek is verlenging gedeeld door lengte."],"en":["Stress is force divided by cross-section, in MPa. Strain is extension divided by length."]},"text":{"nl":"Spanning is kracht gedeeld door doorsnede, in MPa. Rek is verlenging gedeeld door lengte.","en":"Stress is force divided by cross-section, in MPa. Strain is extension divided by length."},"speak":{"nl":"Spanning is kracht gedeeld door doorsnede, in MPa. Rek is verlenging gedeeld door lengte.","en":"Stress is force divided by cross-section, in MPa. Strain is extension divided by length."},"cues":["spec","cell","ext"],"still":0.71,"say":{"nl":["Spanning is de kracht gedeeld door de doorsnede van de staaf, in megapascal. Rek is hoeveel de staaf langer wordt, gedeeld door zijn oorspronkelijke lengte. Zo vergelijk je dikke en dunne staven eerlijk."],"en":["Stress is the force divided by the bar's cross-section, in megapascals. Strain is how much longer the bar gets, divided by its original length. That way thick and thin bars compare fairly."]},"voice":{"nl":"Spanning is de kracht gedeeld door de doorsnede van de staaf, in megapascal. Rek is hoeveel de staaf langer wordt, gedeeld door zijn oorspronkelijke lengte. Zo vergelijk je dikke en dunne staven eerlijk.","en":"Stress is the force divided by the bar's cross-section, in megapascals. Strain is how much longer the bar gets, divided by its original length. That way thick and thin bars compare fairly."}},{"seg":{"nl":["Eerst loopt de lijn recht: elastisch. Laat je los, dan veert de staaf terug."],"en":["At first the line is straight: elastic. Let go and the bar springs back."]},"text":{"nl":"Eerst loopt de lijn recht: elastisch. Laat je los, dan veert de staaf terug.","en":"At first the line is straight: elastic. Let go and the bar springs back."},"speak":{"nl":"Eerst loopt de lijn recht: elastisch. Laat je los, dan veert de staaf terug.","en":"At first the line is straight: elastic. Let go and the bar springs back."},"cues":["spec"],"still":0.964,"say":{"nl":["In het begin loopt de lijn recht omhoog: het elastische gebied. De staaf gedraagt zich als een veer. Haal je de kracht weg, dan veert hij terug naar zijn oude lengte. Hoe steil die lijn loopt, is de elasticiteitsmodulus. Op de kaart is dit stuk uitgerekt: echt staal rekt hier maar één à twee tiende procent."],"en":["At first the line runs straight up: the elastic range. The bar behaves like a spring. Take the force away and it springs back to its old length. How steep that line runs is the modulus of elasticity. The card stretches this part: real steel strains only one or two tenths of a percent here."]},"voice":{"nl":"In het begin loopt de lijn recht omhoog: het elastische gebied. De staaf gedraagt zich als een veer. Haal je de kracht weg, dan veert hij terug naar zijn oude lengte. Hoe steil die lijn loopt, is de elasticiteits-modulus. Op de kaart is dit stuk uitgerekt: echt staal rekt hier maar één à twee tiende procent.","en":"At first the line runs straight up: the elastic range. The bar behaves like a spring. Take the force away and it springs back to its old length. How steep that line runs is the modulus of elasticity. The card stretches this part: real steel strains only one or two tenths of a percent here."}}],"terms":[{"lesson":"eng.mechanics.strength","index":0,"nl":"Trekproef","en":"Tensile test","cue":"spec"}]},{"id":"s2","n":2,"level":1,"dur":30,"still":0.9,"title":{"nl":"De vloeigrens","en":"The yield strength"},"beats":[{"seg":{"nl":["Bij de ",{"t":"vloeigrens","c":"yieldPt","k":"eng.mechanics.strength#1","en":"yield strength"}," buigt de lijn af: de staaf vervormt blijvend."],"en":["At the ",{"t":"yield strength","c":"yieldPt","k":"eng.mechanics.strength#1"}," the line bends over: the bar deforms permanently."]},"text":{"nl":"Bij de vloeigrens (yield strength) buigt de lijn af: de staaf vervormt blijvend.","en":"At the yield strength the line bends over: the bar deforms permanently."},"speak":{"nl":"Bij de vloeigrens buigt de lijn af: de staaf vervormt blijvend.","en":"At the yield strength the line bends over: the bar deforms permanently."},"cues":["spec","yieldPt"],"still":0.196,"say":{"nl":["Dan buigt de lijn af. Dat punt is de ",{"t":"vloeigrens","k":"eng.mechanics.strength#1","en":"yield strength"},": daar begint het staal blijvend te vervormen. Het metaal gaat als het ware vloeien."],"en":["Then the line bends over. That point is the ",{"t":"yield strength","k":"eng.mechanics.strength#1"},": there the steel starts to deform permanently. The metal starts to flow, as it were."]},"voice":{"nl":"Dan buigt de lijn af. Dat punt is de vloeigrens: daar begint het staal blijvend te vervormen. Het metaal gaat als het ware vloeien.","en":"Then the line bends over. That point is the yield strength: there the steel starts to deform permanently. The metal starts to flow, as it were."}},{"seg":{"nl":["Ontlast je nu, dan zakt de lijn evenwijdig terug en blijft de staaf langer."],"en":["Unload now and the line drops back parallel, and the bar stays longer."]},"text":{"nl":"Ontlast je nu, dan zakt de lijn evenwijdig terug en blijft de staaf langer.","en":"Unload now and the line drops back parallel, and the bar stays longer."},"speak":{"nl":"Ontlast je nu, dan zakt de lijn evenwijdig terug en blijft de staaf langer.","en":"Unload now and the line drops back parallel, and the bar stays longer."},"cues":["spec","ext"],"still":0.439,"say":{"nl":["Haal je de kracht nu weg, dan zakt de lijn evenwijdig aan het rechte stuk terug, en blijft er rek over. De staaf is langer gebleven."],"en":["Take the force away now, and the line drops back parallel to the straight part, leaving some strain behind. The bar has stayed longer."]},"voice":{"nl":"Haal je de kracht nu weg, dan zakt de lijn evenwijdig aan het rechte stuk terug, en blijft er rek over. De staaf is langer gebleven.","en":"Take the force away now, and the line drops back parallel to the straight part, leaving some strain behind. The bar has stayed longer."}},{"seg":{"nl":["S235 vloeit bij ","235"," MPa of meer, S355 bij ","355"," MPa: de vloeigrens staat in de naam."],"en":["S235 yields at ","235"," MPa or more, S355 at ","355"," MPa: the yield strength is in the name."]},"text":{"nl":"S235 vloeit bij 235 MPa of meer, S355 bij 355 MPa: de vloeigrens staat in de naam.","en":"S235 yields at 235 MPa or more, S355 at 355 MPa: the yield strength is in the name."},"speak":{"nl":"Es 235 vloeit bij 235 MPa of meer, es 355 bij 355 MPa: de vloeigrens staat in de naam.","en":"S235 yields at 235 MPa or more, S355 at 355 MPa: the yield strength is in the name."},"cues":["yieldPt"],"still":0.73,"say":{"nl":["Europese constructiestaalsoorten dragen hun minimale vloeigrens in de naam. S235 vloeit bij ","235"," megapascal of meer, S355 bij ","355","."],"en":["European structural steels carry their minimum yield strength in their name. S235 yields at ","235"," megapascals or more, S355 at ","355","."]},"voice":{"nl":"Europese constructiestaalsoorten dragen hun minimale vloeigrens in de naam. Es 235 vloeit bij 235 megapascal of meer, es 355 bij 355.","en":"European structural steels carry their minimum yield strength in their name. S235 yields at 235 megapascals or more, S355 at 355."}},{"seg":{"nl":["Dat geldt voor plaat tot ","16"," mm dik; dikkere plaat zit iets lager."],"en":["That holds for plate up to ","16"," mm thick; thicker plate is slightly lower."]},"text":{"nl":"Dat geldt voor plaat tot 16 mm dik; dikkere plaat zit iets lager.","en":"That holds for plate up to 16 mm thick; thicker plate is slightly lower."},"speak":{"nl":"Dat geldt voor plaat tot 16 millimeter dik; dikkere plaat zit iets lager.","en":"That holds for plate up to 16 millimetres thick; thicker plate is slightly lower."},"cues":["yieldPt"],"still":0.968,"say":{"nl":["Dat geldt voor plaat tot ","16"," mm dik; dikkere plaat zit iets lager. Ontwerpers houden de spanning onder de vloeigrens, met marge: een onderdeel dat blijvend verbuigt, is meestal al kapot."],"en":["That holds for plate up to ","16"," mm thick; thicker plate is slightly lower. Designers keep the stress below the yield strength, with a margin: a part that bends permanently has usually already failed."]},"voice":{"nl":"Dat geldt voor plaat tot 16 millimeter dik; dikkere plaat zit iets lager. Ontwerpers houden de spanning onder de vloeigrens, met marge: een onderdeel dat blijvend verbuigt, is meestal al kapot.","en":"That holds for plate up to 16 millimetres thick; thicker plate is slightly lower. Designers keep the stress below the yield strength, with a margin: a part that bends permanently has usually already failed."}}],"terms":[ p één plek wordt hij zichtbaar dunner, alle verdere rek gaat naar die hals, en de kracht die nodig is om door te trekken zakt.","en":"Then the bar necks. In one spot it gets visibly thinner, all further stretching goes into that neck, and the force needed to keep pulling drops."}},{"seg":{"nl":["In de hals breekt hij. Voor een ontwerp telt de vloeigrens, niet de breuk."],"en":["It breaks in the neck. For a design the yield strength counts, not the break."]},"text":{"nl":"In de hals breekt hij. Voor een ontwerp telt de vloeigrens, niet de breuk.","en":"It breaks in the neck. For a design the yield strength counts, not the break."},"speak":{"nl":"In de hals breekt hij. Voor een ontwerp telt de vloeigrens, niet de breuk.","en":"It breaks in the neck. For a design the yield strength counts, not the break."},"cues":["spec","yieldPt"],"still":0.966,"say":{"nl":["Tot slot breekt hij in de hals. Maar voor een ontwerp is de vloeigrens de grens, niet de breuk."],"en":["Finally it breaks in the neck. But for a design the limit is the yield strength, not the break."]},"voice":{"nl":"Tot slot breekt hij in de hals. Maar voor een ontwerp is de vloeigrens de grens, niet de breuk.","en":"Finally it breaks in the neck. But for a design the limit is the yield strength, not the break."}}],"terms":[{"lesson":"eng.mechanics.strength","index":2,"nl":"Treksterkte","en":"Tensile strength","cue":"utsPt"}]},{"id":"s4","n":4,"level":1,"dur":28,"still":0.9,"title":{"nl":"De klasse op een bout","en":"The class on a bolt"},"beats":[{"seg":{"nl":["Op de kop van een bout staat zijn sterkteklasse, bijvoorbeeld 8.8 (ISO 898-1)."],"en":["A bolt's head shows its property class, for example 8.8 (ISO 898-1)."]},"text":{"nl":"Op de kop van een bout staat zijn sterkteklasse, bijvoorbeeld 8.8 (ISO 898-1).","en":"A bolt's head shows its property class, for example 8.8 (ISO 898-1)."},"speak":{"nl":"Op de kop van een bout staat zijn sterkteklasse, bijvoorbeeld 8.8 (ISO 898-1).","en":"A bolt's head shows its property class, for example 8.8 (ISO 898-1)."},"cues":[],"still":0.207,"say":{"nl":["Bouten hebben een sterkteklasse. Op de kop staat bijvoorbeeld acht punt acht."],"en":["Bolts carry a property class. The head shows, for example, eight point eight."]},"voice":{"nl":"Bouten hebben een sterkteklasse. Op de kop staat bijvoorbeeld acht punt acht.","en":"Bolts carry a property class. The head shows, for example, eight point eight."}},{"seg":{"nl":["Het eerste getal maal 100 is de treksterkte: ","800"," MPa."],"en":["The first number times 100 is the tensile strength: ","800"," MPa."]},"text":{"nl":"Het eerste getal maal 100 is de treksterkte: 800 MPa.","en":"The first number times 100 is the tensile strength: 800 MPa."},"speak":{"nl":"Het eerste getal maal 100 is de treksterkte: 800 MPa.","en":"The first number times 100 is the tensile strength: 800 MPa."},"cues":[],"still":0.4,"say":{"nl":["Het eerste getal maal honderd is de treksterkte in megapascal. Acht maal honderd: ","800"," megapascal."],"en":["The first number times one hundred is the tensile strength in megapascals. Eight times one hundred: ","800"," megapascals."]},"voice":{"nl":"Het eerste getal maal honderd is de treksterkte in megapascal. Acht maal honderd: 800 megapascal.","en":"The first number times one hundred is the tensile strength in megapascals. Eight times one hundred: 800 megapascals."}},{"seg":{"nl":["Het tweede getal maal 10 geeft de vloeigrens als percentage daarvan: ","80","%, dus ","640"," MPa."],"en":["The second number times 10 gives the yield as a percentage of it: ","80","%, so ","640"," MPa."]},"text":{"nl":"Het tweede getal maal 10 geeft de vloeigrens als percentage daarvan: 80%, dus 640 MPa.","en":"The second number times 10 gives the yield as a percentage of it: 80%, so 640 MPa."},"speak":{"nl":"Het tweede getal maal 10 geeft de vloeigrens als percentage daarvan: 80 procent, dus 640 MPa.","en":"The second number times 10 gives the yield as a percentage of it: 80 percent, so 640 MPa."} racture."]},"text":{"nl":"Bros (brittle) gietijzer breekt bijna zonder rek en zonder waarschuwing, met een vlak breukvlak.","en":"Brittle cast iron breaks with almost no strain and no warning, with a flat fracture."},"speak":{"nl":"Bros gietijzer breekt bijna zonder rek en zonder waarschuwing, met een vlak breukvlak.","en":"Brittle cast iron breaks with almost no strain and no warning, with a flat fracture."},"cues":["spec","britC"],"still":0.559,"say":{"nl":["Nu een staaf grijs gietijzer. Die is ",{"t":"bros","k":"eng.mechanics.strength#4","en":"brittle"},": de lijn stopt bijna meteen, en hij breekt zonder in te snoeren. Glas, keramiek en heel hard staal breken net zo, zonder waarschuwing."],"en":["Now a bar of grey cast iron. It is ",{"t":"brittle","k":"eng.mechanics.strength#4"},": the line stops almost at once, and it breaks without necking. Glass, ceramics and very hard steel break the same way, without warning."]},"voice":{"nl":"Nu een staaf grijs gietijzer. Die is bros: de lijn stopt bijna meteen, en hij breekt zonder in te snoeren. Glas, keramiek en heel hard staal breken net zo, zonder waarschuwing.","en":"Now a bar of grey cast iron. It is brittle: the line stops almost at once, and it breaks without necking. Glass, ceramics and very hard steel break the same way, without warning."}},{"seg":{"nl":["Kou maakt sommige staalsoorten bros. Dat meet de kerfslagproef, met een slingerhamer."],"en":["Cold makes some steels brittle. The impact test measures that, with a swinging hammer."]},"text":{"nl":"Kou maakt sommige staalsoorten bros. Dat meet de kerfslagproef, met een slingerhamer.","en":"Cold makes some steels brittle. The impact test measures that, with a swinging hammer."},"speak":{"nl":"Kou maakt sommige staalsoorten bros. Dat meet de kerfslag-proef, met een slingerhamer.","en":"Cold makes some steels brittle. The impact test measures that, with a swinging hammer."},"cues":[],"still":0.795,"say":{"nl":["Kou maakt sommige staalsoorten bros. Dat meet de kerf e":{"nl":"Een gangbare eis, bijvoorbeeld voor kwaliteit J2, is minstens 27 joule bij min 20 graden. Veel energie in de kou betekent: dit staal blijft ook in de winter taai. Die waarde staat op het materiaalcertificaat van de partij, vaak een certificaat drie punt één, naast de gemeten vloeigrens, treksterkte en rek bij breuk. Vraag erom bij veiligheidskritische onderdelen.","en":"A common requirement, for example for grade J2, is at least 27 joules at minus 20 degrees. Plenty of energy in the cold means this steel stays ductile in winter too. That value is on the batch's material certificate, often a three point one certificate, next to the measured yield, tensile strength and elongation at break. Ask for it on safety-critical parts."}}],"terms":[{"lesson":"eng.mechanics.strength","index":3,"nl":"Taai","en":"Ductile","cue":"ductC"},{"lesson":"eng.mechanics.strength","index":4,"nl":"Bros","en":"Brittle","cue":"britC"}]},{"id":"s6","n":6,"level":1,"dur":32,"still":0.92,"title":{"nl":"Veiligheidsfactor tegen wat?","en":"Safety factor against what?"},"beats":[{"seg":{"nl":[{"t":"Veiligheidsfactor","c":"sfC","k":"eng.mechanics.strength#5","en":"safety factor"},": vloeigrens gedeeld door werkspanning. ","235"," / ","120"," = ","1,96","."],"en":[{"t":"Safety factor","c":"sfC","k":"eng.mechanics.strength#5"},": yield divided by working stress. ","235"," / ","120"," = ","1.96","."]},"text":{"nl":"Veiligheidsfactor (safety factor): vloeigrens gedeeld door werkspanning. 235 / 120 = 1,96.","en":"Safety factor: yield divided by working stress. 235 / 120 = 1.96."},"speak":{"nl":"Veiligheidsfactor: vloeigrens gedeeld door werkspanning. 235 gedeeld door 120 is 1,96.","en":"Safety factor: yield divided by working stress. 235 divided by 120 is 1.96."},"cues":["sfC"],"still":0.175,"say":{"nl":["Hoeveel marge heb je? De ",{"t":"veiligheidsfactor","k":"eng.mechanics.strength#5","en":"safety factor"}," is de vloeigrens gedeeld door de werkspanning, de spanning bij normaal gebruik. Een console van S235 heeft een werkspanning van ","120"," megapascal: ","235"," gedeeld door ","120"," is ","1,96",". Prima bij een rustige belasting."],"en":["How much margin do you have? The ",{"t":"safety factor","k":"eng.mechanics.strength#5"}," is the yield strength divided by the working stress, the stress in normal use. A bracket of S235 sees a working stress of ","120"," megapascals: ","235"," divided by ","120"," is ","1.96",". Fine for a steady load."]},"voice":{"nl":"Hoeveel marge heb je? De veiligheidsfactor is de vloeigrens gedeeld door de werkspanning, de spanning bij normaal gebruik. Een console van es 235 heeft een werkspanning van 120 megapascal: 235 gedeeld door 120 is 1,96. Prima bij een rustige belasting.","en":"How much margin do you have? The safety factor is the yield strength divided by the working stress, the stress in normal use. A bracket of S235 sees a working stress of 120 megapascals: 235 divided by 120 is 1.96. Fine for a steady load."}},{"seg":{"nl":["De belasting verdubbelt: ","240"," MPa, boven de vloeigrens. De console verbuigt blijvend."],"en":["The load doubles: ","240"," MPa, above the yield strength. The bracket bends for good."]},"text":{"nl":"De belasting verdubbelt: 240 MPa, boven de vloeigrens. De console verbuigt blijvend.","en":"The load doubles: 240 MPa, above the yield strength. The bracket bends for good."},"speak":{"nl":"De belasting verdubbelt: 240 MPa, boven de vloeigrens. De console verbuigt blijvend.","en":"The load doubles: 240 MPa, above the yield strength. The bracket bends for good."},"cues":["sfC"],"still":0.378,"say":{"nl":["Na een proceswijziging verdubbelt de belasting: ","240"," megapascal. Dat is boven de vloeigrens, dus de console gaat blijvend verbuigen."],"en":["After a process change the load doubles: ","240"," megapascals. That is above the yield strength, so the bracket will bend permanently."]},"voice":{"nl":"Na een proceswijziging verdubbelt de belasting: 240 megapascal. Dat is boven de vloeigrens, dus de console gaat blijvend verbuigen.","en":"After a process change the load doubles: 240 megapascals. That is above the yield strength, so the bracket will bend permanently."}},{"seg":{"nl":["S355 geeft ","355"," / ","240"," = ","1,48",": krap als het trilt. Een dikkere console herstelt de marge."],"en":["S355 gives ","355"," / ","240"," = ","1.48",": thin if it vibrates. A thicker bracket restores the margin."]},"text":{"nl":"S355 geeft 355 / 240 = 1,48: krap als het trilt. Een dikkere console herstelt de marge.","en":"S355 gives 355 / 240 = 1.48: thin if it vibrates. A thicker bracket restores the margin."},"speak":{"nl":"Es 355 geeft 355 gedeeld door 240 is 1,48: krap als het trilt. Een dikkere console herstelt de marge.","en":"S355 gives 355 divided by 240 is 1.48: thin if it vibrates. A thicker bracket restores the margin."},"cues":["sfC"],"still":0.655,"say":{"nl":["Overstappen op S355 geeft ","355"," gedeeld door ","240",", is ","1,48",". Hij houdt het, maar de marge is krap als de last trilt, en dan wordt vermoeiing misschien het volgende probleem. Een dikkere console in S235 brengt de spanning terug naar ","120",", en herstelt de oude marge."],"en":["Switching to S355 gives ","355"," divided by ","240",", that is ","1.48",". It holds, but the margin is thin if the load vibrates, and then fatigue may be the next problem. A thicker bracket in S235 brings the stress back to ","120",", and restores the old margin."]},"voice":{"nl":"Overstappen op es 355 geeft 355 gedeeld door 240, is 1,48. Hij houdt het, maar de marge is krap als de last trilt, en dan wordt vermoeiing misschien het volgende probleem. Een dikkere console in es 235 brengt de spanning terug naar 120, en herstelt de oude marge.","en":"Switching to S355 gives 355 divided by 240, that is 1.48. It holds, but the margin is thin if the load vibrates, and then fatigue may be the next problem. A thicker bracket in S235 brings the stress back to 120, and restores the old margin."}},{"seg":{"nl":["Gangbaar: zo’n ","1,5"," bij rustige lasten, ","3"," of meer bij onzekere, ","4"," à ","7"," voor hijsmiddelen, tegen breuk."],"en":["Typical: about ","1.5"," for steady loads, ","3"," or more for uncertain ones, ","4"," to ","7"," for lifting gear, against breaking."]},"text":{"nl":"Gangbaar: zo’n 1,5 bij rustige lasten, 3 of meer bij onzekere, 4 à 7 voor hijsmiddelen, tegen breuk.","en":"Typical: about 1.5 for steady loads, 3 or more for uncertain ones, 4 to 7 for lifting gear, against breaking."},"speak":{"nl":"Gangbaar: zo'n 1,5 bij rustige lasten, 3 of meer bij onzekere, 4 à 7 voor hijsmiddelen, tegen breuk.","en":"Typical: about 1.5 for steady loads, 3 or more for uncertain ones, 4 to 7 for lifting gear, against breaking."},"cues":["sfC"],"still":0.957,"say":{"nl":["Gangbaar is zo'n ","1,5"," bij goed bekende, rustige lasten, en ","3"," of meer bij onzekere of wisselende. Voor hijsen geldt ","4"," tot ","7"," tegen breuk, afhankelijk van het type. De factor dekt het onbekende af; het is geen ruimte voor extra last. Een factor twee tegen breuk is geen twee tegen vloeien, en een factor op het stilstaande gewicht zegt weinig over een last die trilt. Vraag dus altijd: veiligheidsfactor tegen wat, en op welke belasting?"],"en":["Typical is about ","1.5"," for well-known, steady loads, and ","3"," or more for uncertain or dynamic ones. Lifting gear uses ","4"," to ","7"," against breaking, depending on the type. The factor covers the unknowns; it is not room for extra load. A factor of two against breaking is not two against yield, and a factor on the static weight says little about a load that vibrates. So always ask: safety factor against what, and on which load?"]},"voice":{"nl":"Gangbaar is zo'n 1,5 bij goed bekende, rustige lasten, en 3 of meer bij onzekere of wisselende. Voor hijsen geldt 4 tot 7 tegen breuk, afhankelijk van het type. De factor dekt het onbekende af; het is geen ruimte voor extra last. Een factor twee tegen breuk is geen twee tegen vloeien, en een factor op het stilstaande gewicht zegt weinig over een last die trilt. Vraag dus altijd: veiligheidsfactor tegen wat, en op welke belasting?","en":"Typical is about 1.5 for well-known, steady loads, and 3 or more for uncertain or dynamic ones. Lifting gear uses 4 to 7 against breaking, depending on the type. The factor covers the unknowns; it is not room for extra load. A factor of two against breaking is not two against yield, and a factor on the static weight says little about a load that vibrates. So always ask: safety factor against what, and on which load?"}}],"terms":[{"lesson":"eng.mechanics.strength","index":5,"nl":"Veiligheidsfactor","en":"Safety factor","cue":"sfC"}]}],"skip":[],"numbers":[{"lesson":"eng.mechanics.strength","value":"235","scene":"s2"},{"lesson":"eng.mechanics.strength","value":"355","scene":"s2"},{"lesson":"eng.mechanics.strength","value":"16","scene":"s2"},{"lesson":"eng.mechanics.strength","value":"800","scene":"s4"},{"lesson":"eng.mechanics.strength","value":"80","scene":"s4"},{"lesson":"eng.mechanics.strength","value":"640","scene":"s4"},{"lesson":"eng.mechanics.strength","value":"27","scene":"s5"},{"lesson":"eng.mechanics.strength","value":"20","scene":"s5"},{"lesson":"eng.mechanics.strength","value":"120","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"1,96","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"240","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"1,48","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"1,5","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"3","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"4","scene":"s6"},{"lesson":"eng.mechanics.strength","value":"7","scene":"s6"}],"label":{"nl":"Een trekbank met twee kolommen op een voet met stelpoten: een vaste bovenbalk, een traverse die omhoog loopt met een krachtopnemer, wigklemmen boven en onder met een klemvenster en een hendel, een rekopnemer met twee meskanten op de staaf en een bedieningskastje met noodstop. Tussen de klemmen wordt een ronde proefstaaf uitgetrokken: hij rekt, wordt dunner, snoert in en breekt; later breekt een staaf gietijzer kort en vlak. Kaarten, elk gemarkeerd als voorbeeld, tonen de lijn van spanning tegen rek, de boutklasse 8.8, de kerfslagproef met een slingerhamer en een console met zijn veiligheidsfactor.","en":"A two-column testing machine on a base with levelling feet: a fixed top beam, a crosshead that moves up carrying a load cell, wedge grips above and below with a jaw window and a handle, an extensometer with two knife edges on the bar and a control pendant with an emergency stop. Between the grips a round test bar is pulled: it stretches, thins, necks and breaks; later a cast-iron bar breaks short and flat. Cards, each marked as an example, show the stress-strain line, the bolt class 8.8, the impact test with a swinging hammer and a bracket with its safety factor."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;

// A scene lasts at least (caption words / 2.5) + 2 s, so it can be read.
const minSceneDur = (words) => words / 2.5 + 2;

// "De {t:Snijsnelheid} is {n:220} m/min" → text, term and number pieces.
// {t:Term|shown} names lesson term Term but shows "shown" (another form).
function parseMarked(src) {
  const out = [];
  const re = /\{([a-z]):([^{}]*)\}/g;
  let last = 0;
  let m;
  const plain = (s) => {
    if (/[{}]/.test(s)) throw new Error(`bad marker in "${src}"`);
    if (s) out.push({ text: s });
  };
  while ((m = re.exec(src))) {
    plain(src.slice(last, m.index));
    if (m[1] === 't') {
      const [term, shown] = m[2].split('|');
      out.push({ term: term.trim(), shown: (shown ?? term).trim() });
    } else if (m[1] === 'n') out.push({ num: m[2].trim() });
    else throw new Error(`bad marker {${m[1]}:} in "${src}"`);
    last = re.lastIndex;
  }
  plain(src.slice(last));
  return out;
}

// "1167" → 1.167 (nl) or 1,167 (en); "0.3" → 0,3 or 0.3. Decimals as written.
function formatNumber(raw, lang) {
  const s = String(raw);
  if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error(`not a plain number: ${s}`);
  const [int, dec] = s.split('.');
  const group = lang === 'en' ? ',' : '.';
  const point = lang === 'en' ? '.' : ',';
  const body = int.replace(/^-/, '');
  const grouped = body.length >= 4 ? body.replace(/\B(?=(\d{3})+(?!\d))/g, group) : body;
  return (int.startsWith('-') ? '-' : '') + grouped + (dec !== undefined ? point + dec : '');
}

// A resolved caption is a list of strings and term pieces {t, en?, c}. In Dutch
// a term carries its English word (en) on first use only.
const plainOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t + (p.en ? ` (${p.en})` : ''))).join('');
// Units and signs a voice would spell out or skip, said as words. Longest first.
// Also for Piper (espeak-ng reads "6,0" as "zes komma nul" and "€8,67" badly).
const SAY = {
  // 1.167 is "elfhonderdzevenenzestig" (espeak-ng says "duizend honderd zevenenzestig")
  nl: [[/\b([1-9])\.([1-9])(\d\d)\b/g, (m, a, b, cd) => `${a}${b}honderd${cd === '00' ? '' : ` ${Number(cd)}`}`],
    [/omw\/min/g, 'omwentelingen per minuut'], [/\bmm\/min\b/g, 'millimeter per minuut'], [/\bm\/min\b/g, 'meter per minuut'], [/µm\b/g, 'micrometer'], [/\brpm\b/g, 'omwentelingen per minuut'],
    [/€\s?(\d[\d.]*(?:,\d+)?)/g, '$1 euro'], [/(\d),0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimeter'], [/(\d)\s?min\b/g, '$1 minuten'], [/(\d)\s?%/g, '$1 procent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' maal '], [/\s\/\s/g, ' gedeeld door '], [/\s=\s/g, ' is '], [/°/g, ' graden'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    // acronym pairs (MIG/MAG, IQ/OQ/PQ) without the slash, t8/5, and a standard's number in parts
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 deel $3'],
    // the weld standards as said on the floor (ISO 58 17, not "vijfduizend..."), the execution
    // classes as letters, and the ISO 6520-1 code 401 digit by digit; only these, so ISO 9001 stays
    [/\bISO (5817|9712)\b/g, (m, n) => `ISO ${n.slice(0, 2)} ${n.slice(2)}`], [/\bEXC([1-4])\b/g, 'E X C $1'], [/\b401\b/g, 'vier nul één'],
    // MIG, MAG and TIG on their own as letters, like MAG-lassen (espeak-ng reads MAG as the verb "mag")
    [/\b(MIG|MAG|TIG)\b(?!-)/g, (m) => m.split('').join(' ')],
    // DOE (design of experiments) as letters in both languages, not the Dutch verb "doe" or the English "doe"
    [/\bDOE\b/g, 'D O E'],
    // PFMEA as letters (espeak-ng says "pfmeea" in Dutch and drops the A in English)
    [/\bPFMEA\b/g, 'P F M E A'],
    // the go/no-go gauge and gauge R&R without "slash" or "ampersand": gaat, gaat niet; R en R
    [/\b([Gg])aat\/gaat-niet\b/g, '$1aat, gaat niet'], [/\bR&R\b/g, 'R en R'],
    // I/O without "slash"; OEE, MES and HMI as letters (espeak-ng says "oe", the word "mes", "hmie"); CE needs
    // nothing: espeak-ng already spells it in CE-markering
    [/\bI\/O\b/g, 'I O'], [/\bOEE\b/g, 'O E E'], [/\bMES\b/g, 'M E S'], [/\bHMI\b/g, 'H M I'],
    // English robot words in a Dutch sentence as the floor says them (espeak-ng reads "pajlo-at", "te-ach", "tolling", French "vision")
    [/\b([Pp])ayload/g, '$1ee-lood'], [/\b([Tt])each pendant\b/g, '$1ietsj pendant'], [/\btooling\b/g, 'toeling'], [/\b([Vv])ision\b/g, '$1izjun'],
    // espeak-ng reads "miksed-model", "heijunka" with the u of "bus", and drops the pr of "robotprogramma's"
    [/\b([Mm])ixed-model\b/g, '$1ikst moddul'], [/\b([Hh])eijunka/g, '$1eijoenka'], [/\b([Rr])obotprogramma/g, '$1obot-programma'],
    // the machine states and the Pareto chart (espeak-ng reads "star-vet", "blok-ket", and stresses "PA-re-to-diagram")
    [/\b([Ss])tarved\b/g, '$1taarft'], [/\b([Bb])locked\b/g, '$1lokt'], [/\b([Pp])aretodiagram/g, '$1areto-diagram'],
    // the range of a subgroup as the floor says it (espeak-ng reads the Dutch "rang-e"), and slijtagecompensatie
    // with its parts apart (espeak-ng reads "slijtaaɣee" in the compound; "slijtage" alone is right)
    [/\b([Rr])ange\b/g, '$1eenzj'], [/\b([Ss])lijtagecompensatie/g, '$1lijtage-compensatie'],
    // ISO 2768 as "ISO 27 68" (espeak-ng says "tweeduizend zevenhonderd ...")
    [/\bISO 2768\b/g, 'ISO 27 68'],
    // the Weibull shape factor: espeak-ng reads "bèta" as "be-TAA" with a schwa; said as "beeta"
    [/\b([Bb])èta\b/g, '$1eeta'],
    // espeak-ng stresses "hoofdschaKElaar" (with the e of "bed") and "veiligheidsreGELS": split, each part
    // keeps its own stress and vowels (HOOFD-SCHAkelaar, VEILigheids-REgels)
    [/\b([Hh])oofdschakelaar/g, '$1oofd-schakelaar'], [/\b([Vv])eiligheidsregels\b/g, '$1eiligheids-regels'],
    // steel grades with the letter said as "es" (espeak-ng gives a bare hiss for the S in S235; capital at a
    // sentence start, so the sentence still ends before it), and compounds espeak-ng stresses at the end
    // (kerfslagPROEF, Elasticiteitsmodulus): split at the head
    [/(^|[.!?]\s+)S(235|275|355)\b/g, '$1Es $2'], [/\bS(235|275|355)\b/g, 'es $1'],

    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  // pause when the film leaves the screen or the tab is hidden
  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  // tell the app how tall the film is, so its frame fits without scrolling
  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    // the frame is the video: no poster, controls or speech; time from the script
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          STAGE.render(at.si, at.u);
          caption(at.si, at.bi);
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        // the cue's glow breathes with the film's own clock, not the wall clock
        main.style.setProperty('--fp-b', `${(2.5 * (0.5 - 0.5 * Math.cos((2 * Math.PI * time) / 1.8))).toFixed(2)}px`);
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
