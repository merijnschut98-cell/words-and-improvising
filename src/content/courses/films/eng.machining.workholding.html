  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };

  const m = meridian.length;
  const faces = [];

    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);

    const [nr, na] = normalAt(i, u);

      groups.get(arc.tone).push(arc);

    if (x.groups.size !== y.groups.size) return false;

      out.to -= TAU;

        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {

          const p1 = pointAt(i, b.u, hi[key]);

    levels[0].groups.get(tone).forEach((arc, index) => {

      const last = levels.length - 1;

      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));

  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

      let best = null;
      let score = -Infinity;
      for (const entry of above) {

        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;

      } else {

    for (const entry of above) {
      if (entry.used) continue;

  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);

      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;

        if (at < run.length) strip(tone, run[at - 1], run[at]);

      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));

      const mid = levelOf(i, (a.u + b.u) / 2);

        return;

      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));

    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);

  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }

      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;

    tones.push(toneRow);

        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);

  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;

  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;

    fillPath = surface.fill;
    outline = surface.outline;

    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";

      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";

        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];

    outline = "";

  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }

    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);

const CAM = [[[0,[174.9,127,420]],[0.42,[174.9,127,400]],[0.66,[174.9,127,400]],[0.86,[444.2,220.3,360]]],[[0,[449.8,188.3,350]],[1,[449.8,188.3,330]]],[[0,[449.8,197.5,340]],[1,[449.8,206.6,320]]],[[0,[466.6,236.5,340]],[1,[466.6,236.5,370]]],[[0,[174.9,136.1,360]],[0.4,[174.9,127,330]],[1,[174.9,127,340]]],[[0,[447,218,330]],[0.5,[467.8,221.4,300]],[1,[447,218,330]]],[[0,[395.4,218.1,250]],[0.7,[395.4,218.1,240]],[1,[419,215.5,330]]],[[0,[435.2,167.1,440]],[0.4,[435.2,144.1,470]],[1,[435.2,167.1,440]]]];
const W = 640, H = 400;
// The stage of the film "Opspannen: 3-2-1 en nulpuntsystemen / Workholding": a
// pure function of (scene, u). Inlined into the page after the anatomy kit
// (iso-kit functions in scope, the lathe module as G) and a preamble from
// build.mjs that defines P (projection), C (world constants), CAM (camera key
// frames per scene), W and H. Moves are placed per caption beat (beatStarts),
// so the video's narration timing (films/_kit/beatwarp.js) keeps them in step.
/* global G, P, C, CAM, W, H, iso, pathOf, solidSvg, lineSvg, dotsSvg, extrude, cylinder, slabOf, onTop, cameraOf, translateAlong, span, beatStarts */
const STAGE = (() => {
  const svg = document.querySelector('.fp-stage svg');
  const E = {};
  svg.querySelectorAll('[data-k]').forEach((el) => { E[el.getAttribute('data-k')] = el; });
  const D = JSON.parse(document.getElementById('film-data').textContent);
  const LANG = document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'nl';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const f1 = (v) => (Math.round(v * 10) / 10).toString();
  const f2 = (v) => v.toFixed(2);
  const at = (p) => iso(p, P);
  const fmt = (pts, close) => (pts.length ? 'M' + pts.map(([x, y]) => f2(x) + ' ' + f2(y)).join('L') + (close ? 'Z' : '') : '');
  const show = (e, on) => { const want = on ? '' : 'none'; if (e.style.display !== want) e.style.display = want; };
  const set = (e, html) => { if (e.__h !== html) { e.innerHTML = html; e.__h = html; } };
  const move = (e, by) => { const t = translateAlong(P, by); if (e.__t !== t) { e.setAttribute('transform', t); e.__t = t; } };
  const fade = (e, a) => { const v = a >= 0.999 ? '' : Math.max(0, a).toFixed(3); if (e.style.opacity !== v) e.style.opacity = v; };
  const dec = (v, d) => { const t = String(Number(v.toFixed(d))); return LANG === 'nl' ? t.replace('.', ',') : t; };
  const tr = (nl, en) => (LANG === 'nl' ? nl : en);
  const txt = (x, y, t, size = 19, anchor = 'start', cls = 'wh-txt') => `<text class="${cls}" x="${f1(x)}" y="${f1(y)}" font-size="${f1(size)}" text-anchor="${anchor}">${t}</text>`;
  const S = (paths, style = {}) => solidSvg(paths, { tone: 'mid', ...style });
  const ph = (p, a, b) => span(p, a, b);

  // the beat on screen and its progress, from the caption beats of the scene
  function beatOf(si, u) {
    const sc = D.scenes[si];
    const fr = beatStarts(sc, 'nl').map((x) => x / sc.dur);
    let b = 0;
    for (let i = 0; i < fr.length; i++) if (u >= fr[i] - 1e-9) b = i;
    const a0 = fr[b];
    const a1 = b + 1 < fr.length ? fr[b + 1] : 1;
    return { b, p: clamp((u - a0) / Math.max(1e-6, a1 - a0), 0, 1) };
  }

  // ------------------------------------------------------------ camera: eased key frames
  let camW = 300;
  function camera(si, u) {
    const keys = CAM[si];
    let c = keys[0][1];
    for (let i = 0; i + 1 < keys.length; i++) {
      const [u0, c0] = keys[i];
      const [u1, c1] = keys[i + 1];
      if (u >= u0) { const t = span(u, u0, u1); c = [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)]; }
    }
    camW = c[2];
    const s = W / c[2];
    const t = `translate(${f1(W / 2)} ${f1(H / 2)}) scale(${s.toFixed(4)}) translate(${f1(-c[0])} ${f1(-c[1])})`;
    if (E.world.__t !== t) { E.world.setAttribute('transform', t); E.world.__t = t; }
  }
  // a font size in world units that shows as `px` stage units
  const wfs = (px) => (px * camW) / W;

  // ------------------------------------------------------------ the housing, drawn from its pose
  // Flange and body boxes and the bore, moved by a small twist about pose.o:
  // p' = p + v + w × (p − o). The bore is an ellipse (a along x, b along y)
  // on the body top. Returns the flange and the body separately (the vice's
  // back lip sits between them in depth).
  const CAMV = cameraOf(P);
  const VIEW = [CAMV.cosA * CAMV.cosE, CAMV.sinA * CAMV.cosE, CAMV.sinE];
  const LIGHT = [-CAMV.sinA, CAMV.cosA];
  function partSvg(pose) {
    const { o, v, w } = pose;
    const mv = (p) => { const r = [p[0] - o[0], p[1] - o[1], p[2] - o[2]]; return [p[0] + v[0] + w[1] * r[2] - w[2] * r[1], p[1] + v[1] + w[2] * r[0] - w[0] * r[2], p[2] + v[2] + w[0] * r[1] - w[1] * r[0]]; };
    const turn = (n) => [n[0] + w[1] * n[2] - w[2] * n[1], n[1] + w[2] * n[0] - w[0] * n[2], n[2] + w[0] * n[1] - w[1] * n[0]];
    const hull = (pts) => {
      const s = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const cr = (q, a, b) => (a[0] - q[0]) * (b[1] - q[1]) - (a[1] - q[1]) * (b[0] - q[0]);
      const lo = [];
      const hi = [];
      for (const p of s) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
      for (const p of s.slice().reverse()) { while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
      return lo.slice(0, -1).concat(hi.slice(0, -1));
    };
    function boxOf({ x, y, w: bw, d }, z0, z1, top) {
      const c = [];
      for (let i = 0; i < 8; i++) c.push(mv([i & 1 ? x + bw : x, i & 2 ? y + d : y, i & 4 ? z1 : z0]));
      const sc = c.map(at);
      const faces = [[0, 0, [0, 2, 6, 4]], [0, 1, [1, 3, 7, 5]], [1, 0, [0, 1, 5, 4]], [1, 1, [2, 3, 7, 6]], [2, 0, [0, 1, 3, 2]], [2, 1, [4, 5, 7, 6]]].map(([ax, side, idx]) => {
        const n0 = [0, 0, 0];
        n0[ax] = side ? 1 : -1;
        const n = turn(n0);
        return { ax, side, idx, n, show: n[0] * VIEW[0] + n[1] * VIEW[1] + n[2] * VIEW[2] > 1e-6 };
      });
      const face = (ax, side) => faces[ax * 2 + side];
      const shades = [[], [], [], []];
      let topD = '';
      for (const f of faces) {
        if (!f.show) continue;
        const d = fmt(f.idx.map((i) => sc[i]), true);
        if (f.ax === 2) { topD += d; continue; }
        const lit = (f.n[0] * LIGHT[0] + f.n[1] * LIGHT[1] + 1) / 2;
        shades[Math.min(3, Math.max(0, Math.floor(lit * 4)))].push(d);
      }
      const outline = [];
      const crease = [];
      for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) for (let sa = 0; sa < 2; sa++) for (let sb = 0; sb < 2; sb++) {
        const fa = face(a, sa);
        const fb = face(b, sb);
        const ends = [];
        for (let i = 0; i < 8; i++) if (((i >> a) & 1) === sa && ((i >> b) & 1) === sb) ends.push(i);
        const d = fmt(ends.map((i) => sc[i]));
        if (fa.show !== fb.show) outline.push(d);
        else if (fa.show && (a === 2 || b === 2)) crease.push(d);
      }
      return '<g class="iso-solid"><path class="iso-fill" d="' + fmt(hull(sc), true) + '"/>'
        + shades.map((list, i) => (list.length ? '<path class="iso-shade" data-shade="' + i + '" d="' + list.join('') + '"/>' : '')).join('')
        + '<path class="iso-top" d="' + topD + '"/><path class="iso-line iso-crease" data-tone="lo" d="' + crease.join('') + '"/>'
        + top + '<path class="iso-line iso-edge" data-tone="hi" d="' + outline.join('') + '"/></g>';
    }
    const ring = (cx, cy, rx, ry, z, steps) => fmt(Array.from({ length: steps }, (_, i) => { const t = (i / steps) * TAU; return at(mv([cx + rx * Math.cos(t), cy + ry * Math.sin(t), z])); }), true);
    const F = pose.flange;
    const B = pose.body;
    const holes = pose.holes.map(([x, y]) => ring(x, y, 2.4, 2.4, pose.ft, 14)).join('');
    const gw = 2;
    const lid = fmt([[B.x + gw, B.y + gw], [B.x + B.w - gw, B.y + gw], [B.x + B.w - gw, B.y + B.d - gw], [B.x + gw, B.y + B.d - gw]].map(([x, y]) => at(mv([x, y, pose.bt]))), true);
    const [bx, by] = pose.boreAt;
    const boreD = ring(bx, by, pose.bore[0], pose.bore[1], pose.bt, 56);
    const bodyTop = '<path class="iso-line" data-tone="faint" d="' + lid + '"/>'
      + '<path class="iso-line" data-tone="faint" d="' + ring(bx, by, pose.bore[0] + 1.6, pose.bore[1] + 1.6, pose.bt, 56) + '"/>'
      + '<path class="wh-bore" d="' + boreD + '"/><path class="iso-line" data-tone="hi" d="' + boreD + '"/>';
    return {
      flange: boxOf(F, pose.pb, pose.ft, '<path class="iso-line" data-tone="lo" d="' + holes + '"/>'),
      body: boxOf(B, pose.ft, pose.bt, bodyTop),
      boreRing: boreD,
      mv,
    };
  }
  const POSE = { o: C.O, v: [0, 0, 0], w: [0, 0, 0], flange: C.FL, body: C.BODY, pb: C.PB, ft: C.FT, bt: C.BT, holes: C.HOLES, bore: [C.BORE_R, C.BORE_R], boreAt: [0, 0] };
  const VFL = { ...C.FL, x: C.FL.x + C.VX };
  const VHOLES = C.HOLES.map(([x, y]) => [x + C.VX, y]);

  // ------------------------------------------------------------ small drawing helpers
  // an arrow along screen points, with a head at the end (and the start if both)
  function arrowSvg(pts, cls = 'wh-arrow', both = false, on = false, size = 5) {
    if (pts.length < 2) return '';
    const head = (a, b) => {
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const l = Math.hypot(dx, dy) || 1;
      const ux = dx / l;
      const uy = dy / l;
      const s = size;
      return `<path class="${cls === 'wh-force' ? 'wh-forcehead' : 'wh-head'}"${on ? ' data-on=""' : ''} d="${fmt([[b[0] + ux * s * 0.6, b[1] + uy * s * 0.6], [b[0] - ux * s + uy * s * 0.6, b[1] - uy * s - ux * s * 0.6], [b[0] - ux * s - uy * s * 0.6, b[1] - uy * s + ux * s * 0.6]], true)}"/>`;
    };
    return `<path class="${cls}"${on ? ' data-on=""' : ''} d="${fmt(pts)}"/>` + head(pts[pts.length - 2], pts[pts.length - 1]) + (both ? head(pts[1], pts[0]) : '');
  }
  // a circle in the plane perpendicular to world axis ax, around c
  const arcPts = (c, ax, r, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => {
    const t = a0 + ((a1 - a0) * i) / n;
    const u = Math.cos(t) * r;
    const v = Math.sin(t) * r;
    const p = ax === 0 ? [c[0], c[1] + u, c[2] + v] : ax === 1 ? [c[0] + u, c[1], c[2] + v] : [c[0] + u, c[1] + v, c[2]];
    return at(p);
  });

  // ------------------------------------------------------------ the degrees-of-freedom gizmo
  const G0 = [104, -20, 176];
  function dofSvg(lit, alpha) {
    if (alpha <= 0.01) return '';
    const L = 26;
    let out = '';
    const dirs = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
    dirs.forEach((d, i) => {
      if (alpha * lit[i].a <= 0.01) return;
      const p0 = at([G0[0] - d[0] * L, G0[1] - d[1] * L, G0[2] - d[2] * L]);
      const p1 = at([G0[0] + d[0] * L, G0[1] + d[1] * L, G0[2] + d[2] * L]);
      out += `<g style="opacity:${(alpha * lit[i].a).toFixed(2)}">${arrowSvg([p0, p1], 'wh-arrow', true, lit[i].on, 4)}</g>`;
    });
    dirs.forEach((d, i) => {
      const l = lit[3 + i];
      if (alpha * l.a <= 0.01) return;
      const c = [G0[0] + d[0] * (L + 8), G0[1] + d[1] * (L + 8), G0[2] + d[2] * (L + 8)];
      out += `<g style="opacity:${(alpha * l.a).toFixed(2)}">${arrowSvg(arcPts(c, i, 9, 0.3, 0.3 + TAU * 0.78), 'wh-arrow', false, l.on, 4)}</g>`;
    });
    out += dotsSvg([at(G0)], { size: 0.6, tone: 'hi' });
    return out;
  }

  // ------------------------------------------------------------ the spindle with an end mill or a boring bar
  function spindleSvg(x, y, zTip, kind, zCut) {
    const z0 = Math.max(zTip, zCut);
    const r = kind === 'bore' ? 9 : 8;
    let out = '';
    const toolLen = 44;
    if (zTip + toolLen > z0) out += S(cylinder(x, y, r, z0, zTip + toolLen - z0, P, 28), { tone: 'hi', crease: 'lo' });
    if (kind === 'mill' && zTip + toolLen > z0 + 6) {
      // flutes: two helix lines on the visible side
      const lines = [0, Math.PI].map((ph0) => fmt(Array.from({ length: 9 }, (_, i) => { const t = i / 8; const a = ph0 + t * 2.2 + 0.9; return at([x + r * Math.cos(a), y + r * Math.sin(a), z0 + 3 + t * (zTip + toolLen - z0 - 8)]); }))).join('');
      out += lineSvg(lines, { tone: 'lo' });
    }
    if (kind === 'bore' && zTip >= zCut - 1) out += S(slabOf({ x: x + r - 1, y: y - 2, w: C.BORE_R - r + 1, d: 4, r: 0.5 }, zTip, 4, P, 2), { tone: 'hi' });
    out += S(cylinder(x, y, 15, zTip + toolLen, 26, P, 36), { crease: 'lo', inner: lineSvg(onTop(Array.from({ length: 36 }, (_, i) => [x + 15 * Math.cos(i / 36 * TAU), y + 15 * Math.sin(i / 36 * TAU)]), zTip + toolLen + 8, P, true), { tone: 'faint' }) });
    out += S(cylinder(x, y, 24, zTip + toolLen + 26, 40, P, 40), { tone: 'lo', crease: 'lo' });
    return out;
  }

  // ------------------------------------------------------------ the vice and its housing
  // s: wall squeeze (world mm, exaggerated); g: the moving jaw's offset;
  // bore: [a, b]; lift: the housing above its parallels
  function renderVice(st) {
    const sq = st.s || 0;
    const pose = {
      o: [C.VX, 0, C.VPB], v: [0, 0, st.lift || 0], w: [0, 0, 0], flange: VFL,
      body: { x: C.VX - 38, y: -35, w: 76, d: 70 - sq, r: 1.2 }, pb: C.VPB, ft: C.VFT, bt: C.VBT,
      holes: VHOLES, bore: st.bore || [C.BORE_R, C.BORE_R], boreAt: [C.VX, -sq / 2],
    };
    const part = partSvg(pose);
    set(E.vFlange, st.part ? part.flange : '');
    set(E.vBody, st.part ? part.body : '');
    const refRing = fmt(Array.from({ length: 56 }, (_, i) => { const t = (i / 56) * TAU; return at([C.VX + C.BORE_R * Math.cos(t), -sq / 2 + C.BORE_R * Math.sin(t), C.VBT]); }), true);
    set(E.boreMark, st.part && st.mark ? `<path class="fp-mark" d="${part.boreRing}"/>` + (st.ref ? `<path class="wh-ref" d="${refRing}"/>` : '') : '');
    move(E.viceFront, [0, st.g ?? 0, 0]);
    let tool = '';
    if (st.tool) tool += spindleSvg(st.tool.x, st.tool.y, st.tool.z, st.tool.kind, st.tool.kind === 'bore' ? C.VBT : -999);
    if (st.force) {
      const z = C.VBT;
      tool += arrowSvg([at([C.VX - 10 + st.force.x, -20, z + 4]), at([C.VX + 22 + st.force.x, -20, z + 4])], 'wh-force', false, false, 7);
    }
    set(E.vTool, tool);
  }

  // ------------------------------------------------------------ the fixture
  // st: pose (v, w, o), straps (0 down, 1 released and slid back), push (0 in, 1 back),
  // chip, wrench angle, air, pallet lift and alpha
  function renderFixture(st) {
    const pose = { ...POSE, v: st.v || [0, 0, 0], w: st.w || [0, 0, 0], o: st.o || C.O };
    const part = partSvg(pose);
    set(E.part, st.part === false ? '' : part.flange + part.body);
    // straps: lift 7, then slide back along their slots
    const rel = st.straps || 0;
    const lift = 7 * span(rel, 0, 0.35);
    const slide = 26 * span(rel, 0.35, 1);
    move(E.strapL, [-slide, 0, lift]);
    move(E.strapR, [slide, 0, lift]);
    // push screws (retract 9)
    const back = 9 * (st.push ?? 0);
    const sb = G.frameOf([C.PUSH.back.x, -54, C.PZ + 14], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
    const se = G.frameOf([-80, C.PUSH.end.y, C.PZ + 14], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
    const tipB = 9 - back; // the screw runs from the bush (y = −54) to the flange (y = −45)
    set(E.screwsBack, S(G.disc(-14, Math.max(0.5, tipB), 3, sb, P), { tone: 'hi', crease: 'none' }) + S(G.disc(-22, -14, 5, sb, P), { crease: 'lo' })
      + S(G.disc(-14, Math.max(0.5, 10 - back), 3, se, P), { tone: 'hi', crease: 'none' }) + S(G.disc(-22, -14, 5, se, P), { crease: 'lo' }));
    // chip on rest button A1
    if (st.chip > 0.01) {
      const [x, y] = C.LOC.A1.p;
      const dx = st.chipGo || 0;
      const curl = Array.from({ length: 19 }, (_, i) => { const t = i / 18; const a = -1.2 + t * 2.4 * TAU; return [x + 1 + 3.2 * Math.cos(a), y + 6 + 3.2 * Math.sin(a), C.PB + 0.4 + 5.6 * t]; });
      const tail = [[x, y + 9, C.PB + 0.4], [x - 2, y + 14, C.PB - 2], [x - 5, y + 19, C.PZ + 4], [x - 9, y + 22, C.PZ + 0.4]];
      const pts = tail.slice().reverse().concat(curl).map((p) => at([p[0] - dx * 0.8, p[1] + dx, p[2] + dx * 0.2]));
      set(E.chip, `<g style="opacity:${st.chip.toFixed(2)}"><path class="wh-chip" d="${fmt(pts)}"/><path class="wh-chipi" d="${fmt(pts)}"/></g>`);
    } else set(E.chip, '');
    // datum faces A (bottom: its visible bottom edges), B (front), C (end)
    if (st.datum > 0.01) {
      const mv = part.mv;
      const F = C.FL;
      const face = (pts) => `<path class="wh-face" d="${fmt(pts.map((p) => at(mv(p))), true)}"/>`;
      const y1 = F.y + F.d;
      const x1 = F.x + F.w;
      const fs = wfs(19);
      const tag = (p, l) => { const [sx, sy] = at(p); const r = fs * 0.78; return `<circle class="wh-tag" cx="${f1(sx)}" cy="${f1(sy)}" r="${f2(r)}"/>` + txt(sx, sy + fs * 0.36, l, fs, 'middle', 'wh-acc'); };
      const edgeA = `<path class="wh-face" style="fill:none;stroke-width:3" d="${fmt([[F.x, y1, C.PB], [x1, y1, C.PB], [x1, F.y, C.PB]].map((p) => at(mv(p))))}"/>`;
      set(E.marks, `<g style="opacity:${st.datum.toFixed(2)}">${edgeA}${face([[F.x, y1, C.PB], [x1, y1, C.PB], [x1, y1, C.FT], [F.x, y1, C.FT]])}${face([[x1, F.y, C.PB], [x1, y1, C.PB], [x1, y1, C.FT], [x1, F.y, C.FT]])}`
        + `<path class="wh-lead" d="${fmt([at([F.x - 4, y1 + 14, C.PB - 12]), at(mv([F.x + 14, y1, C.PB]))])}"/>`

// v14b: keeps a film's stage in step with its narration in the video.
// A stage is drawn as STAGE.render(scene, u), its moves placed at fractions of
// the scene that match the caption beats of the HTML film (beatStarts, by the
// caption's words). In the video (?render=1) the beats are timed by the
// recorded narration instead, which is longer and spread differently. This
// maps the narration time back: while beat k is being spoken (from its start to
// the next beat's), the stage runs from caption beat k's fraction to beat k+1's.
// The HTML film (no timing handed over) is left as it is.
//
// Plain browser script: a film's build appends it after its stage script.
/* global STAGE, beatStarts */
(() => {
  const D = JSON.parse(document.getElementById('film-data').textContent);
  let atl = null;
  let film;
  // the render script hands the audio timeline to window.__film.setTiming
  Object.defineProperty(window, '__film', {
    configurable: true,
    get: () => film,
    set(v) {
      film = v;
      if (v && typeof v.setTiming === 'function') {
        const set = v.setTiming;
        v.setTiming = (a) => { atl = a; return set.call(v, a); };
      }
    },
  });
  const inner = STAGE.render.bind(STAGE);
  STAGE.render = (si, u) => {
    const s = atl && atl.scenes[si];
    const sc = D.scenes[si];
    if (!s || !sc || !s.beats.length) return inner(si, u);
    const fr = beatStarts(sc, 'nl').map((x) => x / sc.dur);
    const t = s.start + u * s.dur;
    let k = 0;
    for (let i = 0; i < s.beats.length; i++) if (t >= s.beats[i].start) k = i;
    const a0 = k === 0 ? s.start : s.beats[k].start;
    const a1 = k + 1 < s.beats.length ? s.beats[k + 1].start : s.start + s.dur;
    const f0 = fr[k] ?? 0;
    const f1 = k + 1 < fr.length ? fr[k + 1] : 1;
    const p = Math.min(1, Math.max(0, (t - a0) / Math.max(1e-6, a1 - a0)));
    return inner(si, f0 + p * (f1 - f0));
  };
})();

  const lightFocus = () => stage.querySelectorAll('[data-cue]').forEach((el) => el.toggleAttribute('data-on', focusOn.has(el.getAttribute('data-cue'))));

  document.title = DATA.title[LANG];
  doc.lang = LANG;
  main.setAttribute('aria-label', `${STR.label}: ${DATA.title[LANG]}`);
  $('.fp-poster-title').textContent = DATA.title[LANG];
  $('.fp-poster-go span').textContent = STR.start;
  $('.fp-sheet-title').textContent = STR.scenes;
  $('[data-act="close"]').setAttribute('aria-label', STR.close);
  prevBtn.setAttribute('aria-label', STR.prev);
  nextBtn.setAttribute('aria-label', STR.next);
  scenesBtn.setAttribute('aria-label', STR.scenes);
  range.setAttribute('aria-label', STR.scrub);
  range.max = String(tl.total);
  const svgEl = stage.querySelector('svg');
  if (svgEl && DATA.label) svgEl.setAttribute('aria-label', DATA.label[LANG]);

  const ticks = $('.fp-ticks');
  tl.starts.slice(1).forEach((s) => { const i = document.createElement('i'); i.style.left = `${(s / tl.total) * 100}%`; ticks.append(i); });
  const list = $('.fp-list');
  scenes.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fp-item';
    b.innerHTML = `<span class="fp-item-n">${i + 1}</span><span class="fp-item-t"></span><span class="fp-item-d">${fmtClock(tl.starts[i])}</span>`;
    b.querySelector('.fp-item-t').textContent = s.title[LANG];
    b.addEventListener('click', () => { closeSheet(); jump(tl.starts[i]); if (!playing) play(); });
    list.append(b);
  });
  const speedBtn = $('[data-act="speed"]');
  speedBtn.querySelector('.fp-speed-l').textContent = STR.speed;

  const inFrame = window.parent !== window;
  let bridge = false;
  const post = (msg) => { try { window.parent.postMessage(Object.assign({ type: 'vp-film' }, msg), '*'); } catch (e) { /* no parent */ } };
  window.addEventListener('message', (e) => {
    if (!inFrame || e.source !== window.parent) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'vp-film') return;
    if (d.op === 'ready') { bridge = true; doc.dataset.narration = 'bridge'; }
    else if (d.op === 'said') lineDone(d.id, d.result);
  });
  if (inFrame) post({ op: 'hello' });
  if (inFrame) document.body.style.background = 'transparent'; // the app's card shows round the player
  doc.dataset.narration = 'local';
  doc.dataset.said = '0';

  const localSynth = (() => { try { return window.speechSynthesis && typeof SpeechSynthesisUtterance === 'function' ? window.speechSynthesis : null; } catch (e) { return null; } })();
  function localSay(id, text) {
    if (!localSynth) { setTimeout(() => lineDone(id, 'failed'), 0); return; }
    try {
      localSynth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'en' ? 'en-GB' : 'nl-NL';
      u.rate = rate;
      const code = LANG === 'en' ? 'en' : 'nl';
      const voices = localSynth.getVoices();
      const v = voices.find((x) => x.lang.toLowerCase().startsWith(code) && x.localService) || voices.find((x) => x.lang.toLowerCase().startsWith(code));
      if (v) u.voice = v;
      const t0 = Date.now();
      u.onend = () => lineDone(id, Date.now() - t0 < 300 ? 'failed' : 'spoken');
      u.onerror = () => lineDone(id, 'failed');
      localSynth.speak(u);
    } catch (e) { setTimeout(() => lineDone(id, 'failed'), 0); }
  }
  function sayBeat(si, bi) {
    const b = scenes[si].beats[bi];
    const text = (b.voice || b.speak)[LANG]; // the narration script when the film has one
    const id = nextId++;
    speaking = { id, scene: si, beat: bi };
    const limit = Math.max(6000, 2000 + text.length * 90) / rate;
    setTimeout(() => lineDone(id, 'timeout'), limit);
    if (bridge) post({ op: 'say', id, text, lang: LANG, rate });
    else localSay(id, text);
  }
  let failures = 0;
  function lineDone(id, result) {
    if (!speaking || speaking.id !== id || speaking.until) return;
    speaking.until = performance.now() + 400; // a breath before the next line
    doc.dataset.said = String(Number(doc.dataset.said) + 1);
    if (result === 'failed') { failures += 1; if (failures >= 2) note.textContent = STR.voice; }
  }
  function cancelSpeech() {
    if (speaking) { if (bridge) post({ op: 'cancel' }); else if (localSynth) { try { localSynth.cancel(); } catch (e) { /* ignore */ } } }
    speaking = null;
  }

  const local = () => {
    const si = sceneIndexAt(t, tl);
    return { si, lt: t - tl.starts[si] };
  };
  let shownKey = '';
  function caption(si, bi) {
    const key = `${si}:${bi}`;
    if (key === shownKey) return;
    shownKey = key;
    const b = scenes[si].beats[bi];
    const line = b.seg[LANG].map((p) => {
      if (typeof p === 'string') return document.createTextNode(p);
      const s = document.createElement('span');
      s.className = 'fp-term';
      s.textContent = p.t;
      if (!p.en) return s;
      const f = document.createDocumentFragment();
      const en = document.createElement('span');
      en.className = 'fp-en';
      en.lang = 'en';
      en.textContent = ` (${p.en})`;
      f.append(s, en);
      return f;
    });
    if (PRM.render) { const one = document.createElement('span'); one.append(...line); cap.replaceChildren(one); } else cap.replaceChildren(...line);
    let r = null;
    for (let k = bi; k >= 0 && !r; k--) r = scenes[si].beats[k].read || null;
    read.textContent = r ? r[LANG] : '';
    read.hidden = !r;
    focusOn = new Set(b.cues);
    main.dataset.focus = main.dataset.focus === 'a' ? 'b' : 'a'; // the halo eases in again
  }
  function draw() {
    const { si, lt } = local();
    const s = scenes[si];
    const bi = beatIndexAt(s, LANG, lt);
    const u = reduce ? (s.beats[bi].still ?? s.still) : Math.min(1, Math.max(0, lt / s.dur)); // a beat may set its own still
    caption(si, bi);
    STAGE.render(si, u); lightFocus();
    if (!scrubbing) range.value = String(Math.round(t * 10) / 10);
    range.setAttribute('aria-valuetext', `${STR.scene(si + 1, scenes.length)}: ${s.title[LANG]}, ${fmtClock(t)}`);
    clock.textContent = `${fmtClock(t)} / ${fmtClock(tl.total)}`;
    doc.dataset.scene = String(si + 1);
  }

  function advance(dt) {
    let target = t + dt * rate;
    const now = performance.now();
    if (!muted && speaking) {
      if (speaking.until && now >= speaking.until) speaking = null;
      else target = Math.min(target, holdLimit(tl, scenes, LANG, speaking.scene, speaking.beat) - 0.001);
    }
    t = Math.max(t, target);
    if (t >= tl.total - 0.0005) { t = tl.total; finish(); return; }
    const { si, lt } = local();
    const bi = beatIndexAt(scenes[si], LANG, lt);
    const key = `${si}:${bi}`;
    if (key !== spokenKey) {
      spokenKey = key;
      if (!muted) sayBeat(si, bi);
    }
  }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (playing && visible && !scrubbing) advance(dt);
    draw();
    if (playing) raf = requestAnimationFrame(frame);
  }
  const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };

  function setPlayBtn() {
    const label = ended ? STR.replay : playing ? STR.pause : STR.play;
    playBtn.setAttribute('aria-label', label);
    playBtn.dataset.state = ended ? 'replay' : playing ? 'pause' : 'play';
    main.dataset.playing = playing ? '1' : '0';
  }
  function play() {
    if (ended) { ended = false; t = 0; spokenKey = null; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    playing = true;
    setPlayBtn();
    kick();
  }
  function pause() {
    playing = false;
    cancelSpeech();
    spokenKey = null; // the beat speaks again from its start when play resumes
    setPlayBtn();
    draw();
  }
  function finish() {
    playing = false;
    ended = true;
    speaking = null;
    main.dataset.ended = '1';
    setPlayBtn();
  }
  function jump(to) {
    cancelSpeech();
    t = Math.max(0, Math.min(tl.total - 0.01, to));
    if (ended) { ended = false; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    spokenKey = null;
    setPlayBtn();
    draw();
  }
  const sceneStep = (dir) => {
    const { si, lt } = local();
    const to = dir < 0 ? (lt > 1.5 ? si : si - 1) : si + 1;
    if (to >= scenes.length) { jump(tl.total - 0.01); return; }
    jump(tl.starts[Math.max(0, to)]);
  };
  const toggle = () => (playing ? pause() : play());
  playBtn.addEventListener('click', toggle);
  $('.fp-poster-go').addEventListener('click', play);
  $('.fp-again').addEventListener('click', play);
  prevBtn.addEventListener('click', () => sceneStep(-1));
  nextBtn.addEventListener('click', () => sceneStep(1));
  function setMute(m) {
    muted = m;
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? STR.unmute : STR.mute);
    main.dataset.muted = muted ? '1' : '0';
    if (muted) cancelSpeech(); else spokenKey = null;
    if (inFrame) post({ op: 'mute', muted });
    else { try { localStorage.setItem('vp:filmMuted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ } }
  }
  muteBtn.addEventListener('click', () => setMute(!muted));
  speedBtn.addEventListener('click', () => {
    rate = rate === 1 ? 1.25 : 1;
    speedBtn.querySelector('.fp-speed-v').textContent = rate === 1 ? '1×' : '1,25×'.replace(',', LANG === 'en' ? '.' : ',');
    speedBtn.setAttribute('aria-pressed', rate !== 1 ? 'true' : 'false');
  });
  function openSheet() { sheet.hidden = false; scenesBtn.setAttribute('aria-expanded', 'true'); const { si } = local(); (list.children[si] || list.children[0]).focus(); }
  function closeSheet() { sheet.hidden = true; scenesBtn.setAttribute('aria-expanded', 'false'); }
  scenesBtn.addEventListener('click', () => (sheet.hidden ? openSheet() : closeSheet()));
  $('[data-act="close"]').addEventListener('click', () => { closeSheet(); scenesBtn.focus(); });

  range.addEventListener('pointerdown', () => { scrubbing = true; cancelSpeech(); });
  const endScrub = () => { if (scrubbing) { scrubbing = false; spokenKey = null; kick(); } };
  range.addEventListener('pointerup', endScrub);
  range.addEventListener('pointercancel', endScrub);
  range.addEventListener('change', endScrub);
  range.addEventListener('input', () => { jump(Number(range.value)); if (playing) kick(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return; // the scrubber's own keys
    if (e.key === ' ' || e.key === 'k') { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') return; toggle(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          caption(at.si, at.bi);
          STAGE.render(at.si, at.u); lightFocus();
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
