 zin voor de stuurgroep. Rechts een paneel met per scène een kaart, gemarkeerd als voorbeeld of schema: twee vragen; de premortem van Gary Klein met het onderzoek uit 1989; de single point of failure en de beheersmaatregel; de ladder van bewijs, het eerste antwoord en de grove regel; een premortem voor een MES in vijf stappen; jargon en terugvertalen naar doel, kosten, tijd en risico; de acht letters van MORE PIES, parafraseren en doorvragen; terugvertellen en de klassieke fouten; en een ERP-koppeling met tot 15 minuten vertraging en dubbele orders.","en":"A meeting room. On the back wall a whiteboard and a clock, on the side wall a calendar strip of twelve weeks, where the go-live about two months away and next week's scanner test appear. You, the consultant in petrol, stand at the front of the table. The team lead at the left end is the expert, in the last example the integration specialist; the planner with a tablet behind the table is a team member, in the example the IT lead; the sponsor in a suit stands at the right end. On the table a sheet: the premortem's written reasons, later the one plain sentence for the steering meeting. At the right a panel with one card per scene, marked as example or diagram: two questions; Gary Klein's premortem with the 1989 study; the single point of failure and the mitigation; the ladder of evidence, the first answer and the rough rule; an MES premortem in five steps; jargon and translating back into goal, cost, time and risk; the eight letters of MORE PIES, paraphrasing and inquiry; teach-back and the typical failures; and an ERP interface with up to 15 minutes of delay and doubled orders."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
