 in de eerste wikkeling maakt een magnetisch veld in de kern. De stroom wisselt steeds van richting, dus het veld ook."],"en":["Alternating current in the first winding makes a magnetic field in the core. The current keeps changing direction, and so does the field."]},"voice":{"nl":"Wissel-stroom in de eerste wikkeling maakt een magnetisch veld in de kern. De stroom wisselt steeds van richting, dus het veld ook.","en":"Alternating current in the first winding makes a magnetic field in the core. The current keeps changing direction, and so does the field."}},{"seg":{"nl":["Dat veld wekt een spanning op in de tweede wikkeling."],"en":["That field induces a voltage in the second winding."]},"text":{"nl":"Dat veld wekt een spanning op in de tweede wikkeling.","en":"That field induces a voltage in the second winding."},"speak":{"nl":"Dat veld wekt een spanning op in de tweede wikkeling.","en":"That field induces a voltage in the second winding."},"cues":["lv","flux"],"still":0.962,"say":{"nl":["Een wisselend veld wekt een spanning op in elke spoel om de kern, dus ook in de tweede wikkeling. Zo gaat het vermogen over, zonder dat de wikkelingen elkaar raken."],"en":["A changing field induces a voltage in every coil round the core, so also in the second winding. That is how power passes across, without the windings touching."]},"voice":{"nl":"Een wisselend veld wekt een spanning op in elke spoel om de kern, dus ook in de tweede wikkeling. Zo gaat het vermogen over, zonder dat de wikkelingen elkaar raken.","en":"A changing field induces a voltage in every coil round the core, so also in the second winding. That is how power passes across, without the windings touching."}}],"terms":[]},{"id":"s3","n":3,"level":1,"dur":30,"still":0.9,"title":{"nl":"De wikkelverhouding","en":"The turns ratio"},"beats":[{"seg":{"nl":["De ",{"t":"wikkelverhouding","c":"ratio","k":"eng.transformers.principle#0","en":"turns ratio"},": de windingen van de ene wikkeling gedeeld door die van de andere // variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.
// The part between the build-only markers (caption markers, numbers, the SAY
// table and the speak variants) runs only at build time: the page's film data
// already carries the resolved captions and voice/speak strings, so the page
// inlines everything except that part (runtimeTimeline in films/_kit/player.mjs).
// Keep runtime code out of it, and build-only code in it.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;


// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each sentence is one
// Piper clip (films/_kit/narrate.mjs), commas inside: the voice makes its own
// comma pause and keeps the sentence melody. Piper's own edge silence is
// trimmed to about 40 ms (films/_kit/speak.py), so these are the pauses heard:
// sentence after a full stop, beat between two lines, hold at a scene's end.
// The listen guard (films/_kit/listen-guard.mjs) checks them on the render.
const PAUSES = { sentence: 0.6, beat: 0.9, hold: 0.8 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: PAUSES.hold, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
      return b;
    });
    t = round3(at + (si + 1 < durs.length ? g.hold : g.tail));
    scenes.push({ start: round3(start), dur: round3(t - start), beats: out });
  });
  return { scenes, total: t };
}
const round3 = (x) => Math.round(x * 1000) / 1000;

// Where time t falls on an audio timeline: the scene, the beat on screen (the
// last one started; the first while the scene opens) and the scene's progress u.
function timedAt(t, atl) {
  const sc = atl.scenes;
  let si = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) si = k;
  const s = sc[si];
  let bi = 0;
  for (let k = 0; k < s.beats.length; k++) if (t >= s.beats[k].start) bi = k;
  const u = Math.min(1, Math.max(0, (t - s.start) / s.dur));
  return { si, bi, u };
}

function timelineOf(scenes) {
  const starts = [];
  let t = 0;
  for (const s of scenes) { starts.push(t); t += s.dur; }
  return { starts, total: t };
}

function sceneIndexAt(t, tl) {
  let i = 0;
  for (let k = 0; k < tl.starts.length; k++) if (t >= tl.starts[k]) i = k;
  return i;
}

// v14b: keeps a film's stage in step with its narration in the video.
// A stage is drawn as STAGE.render(scene, u), its moves placed at fractions of
// the scene that match the caption beats of the HTML film (beatStarts, by the
// caption's words). In the video (?render=1) the beats are timed by the
// recorded narration instead, which is longer and spread differently. This
// maps the narration time back: while beat k is being spoken (from its start to
// the next beat's), the stage runs from caption beat k's fraction to beat k+1's.
// The HTML film (no timing handed over) is left as it is.
//
// Plain browser script: a film's build appends it after its stage script.
/* global STAGE, beatStarts */

    configurable: true,
    get: () => film,
    set(v) {
      film = v;
      if (v && typeof v.setTiming === 'function') {
        const set = v.setTiming;
        v.setTiming = (a) => { atl = a; return set.call(v, a); };

  });
  const inner = STAGE.render.bind(STAGE);
  STAGE.render = (si, u) => {
    const s = atl && atl.scenes[si];

    if (!s || !sc || !s.beats.length) return inner(si, u);
    const fr = beatStarts(sc, 'nl').map((x) => x / sc.dur);
    const t = s.start + u * s.dur;
    let k = 0;
