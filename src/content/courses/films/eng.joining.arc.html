    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

  const XE = C.XE;

  const HEATF = G.frameAlong([0, 0, 0], C.HEAT_AX);

  // ------------------------------------------------------------ the weld, pass by pass
  // Each scene that welds lays one stretch; earlier stretches stay.
  const RUNS = [
    { si: 0, x0: XE, x1: 50, w: 26, h: 3, a: 0.06, b: 0.96 },
    { si: 1, x0: 50, x1: 15, w: 20, h: 2, a: 0.04, b: 0.96 },

  const PORE_X = -82; // where the gas had dropped below 10 L/min in scene 5
  // the end of the weld now, and the stretches laid so far

      for (let x = x1 + 3; x < x0 - 0.5; x += step) lines.push(pth(ys.map((y) => at([x - 1.8 * (1 - (y / hw) ** 2), y, zOf(y, r.w, r.h) + 0.05]))));

  }
  function hazSvg(runs) {

  const ellipseTop = (cx, cy, rx, ry, z, tail = 0) => {

  // ------------------------------------------------------------ the section face (x = XE), drawn once

  const sec = (pts) => pth(pts.map(([y, z]) => at([XE + 0.15, y, z])), true);
  const secLine = (pts) => pth(pts.map(([y, z]) => at([XE + 0.15, y, z])));
  const SECT = (() => {
    const right = [];

    const cap = [];
    for (let i = 0; i <= 12; i++) { const y = FT - (2 * FT * i) / 12; cap.push([y, PT + 3 * Math.sqrt(Math.max(0, 1 - (y / FT) ** 2))]); }
    const root = [];
    for (let i = 0; i <= 6; i++) { const y = -2.5 + (5 * i) / 6; root.push([y, -1.1 * Math.sqrt(Math.max(0, 1 - (y / 2.5) ** 2))]); }

    const hz = (z) => fus(z) + 3.2;
    const hr = [];
    const hl = [];
    for (let z = 0; z <= PT + 0.01; z += 2) { hr.push([hz(z), z]); hl.push([-hz(z), z]); }

    });

  })();
  set(E.section, `<path class="fp-hazf" d="${sec(SECT.haz)}"/><path class="fp-weld" d="${sec(SECT.weld)}"/><path class="fp-ripple" d="${SECT.passes.map(secLine).join('')}"/>`);

  // the macro (scenes 7–8): the same section, drawn flat and large, as an etched cut is looked at
  const MC = C.MACRO;
  const MK = 5.6;
  const mX = (y) => MC.x + MC.w / 2 + y * MK;
  const mZ = (z) => MC.y + 34 + (25 - z) * MK;
  const M2 = (pts, closed = true) => pth(pts.map(([y, z]) => [mX(y), mZ(z)]), closed);
  (() => {
    const { gap, face, top } = C.GROOVE;
    const far = [[-40, 0], [-gap, 0], [-gap, face], [-top, PT], [-40, PT]];
    const near = [[gap, 0], [40, 0], [40, PT], [top, PT], [gap, face]];
    const table = `<path class="fp-meter" d="${M2([[-40, 0], [40, 0], [40, -6], [-40, -6]])}"/>`;
    set(E.macroBody, table + `<path class="fp-steel" d="${M2(far)}"/><path class="fp-steel" d="${M2(near)}"/><path class="fp-hazf" d="${M2(SECT.haz)}"/><path class="fp-weld" d="${M2(SECT.weld)}"/><path class="fp-ripple" d="${SECT.passes.map((q) => M2(q, false)).join('')}"/>`);

      const z = 1 + seeded(i) * (PT - 1.5);

      const l = 0.7;

  // ------------------------------------------------------------ torches, arc, wire, gas, cable
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

  set(E.flowScale, (() => {
    let t = '';

  // documents (scene 6), in the page's language
  const T = EN
    ? { pwps: 'pWPS', wps: 'WPS', wpqr: 'WPQR', thick: 'thickness', heat: 'heat input' }

  const BAR = { x0: 252, x1: 596 };

      + (stamp > 0 ? `<g style="opacity:${stamp.toFixed(2)}"><circle class="fp-mark" style="stroke-width:2.4" cx="164" cy="228" r="28"/>${hudText(164, 233, T.wpqr, 14)}</g>` : ''));

    // thickness: 0–30 mm

    const y1 = 118;
    const rangeA = `<rect class="fp-meter" x="${BAR.x0}" y="${y1 - 8}" width="${BAR.x1 - BAR.x0}" height="16" rx="8"/><rect class="fp-fill" x="${f1(barX(t.tMin, 0, 30))}" y="${y1 - 8}" width="${f1(barX(t.tMax, 0, 30) - barX(t.tMin, 0, 30))}" height="16" rx="8"/>`;
    const y2 = 224;
    const rangeB = `<rect class="fp-meter" x="${BAR.x0}" y="${y2 - 8}" width="${BAR.x1 - BAR.x0}" height="16" rx="8"/><rect class="fp-fill" x="${BAR.x0}" y="${y2 - 8}" width="${f1(barX(t.qMax, 0.6, 1.8) - BAR.x0)}" height="16" rx="8"/>`;
    const rIn = span(u, 0.2, 0.28);
    const oIn = span(u, 0.42, 0.48);
    const hIn = span(u, 0.58, 0.66);
    set(E.docRange, `<g style="opacity:${rIn.toFixed(2)}">${rangeA}${hudText(barX(t.tMin, 0, 30), y1 + 30, num(t.tMin), 18)}${hudText(barX(t.tMax, 0, 30), y1 + 30, num(t.tMax), 18)}</g>`

  const playBtn = $('[data-act="play"]');
  const muteBtn = $('[data-act="mute"]');
  const scenesBtn = $('[data-act="scenes"]');
  const prevBtn = $('[data-act="prev"]');
  const nextBtn = $('[data-act="next"]');
  const range = $('.fp-range');
  const clock = $('.fp-time');
  const poster = $('.fp-poster');
  const sheet = $('.fp-sheet');
  const note = $('.fp-note');
  const cueEls = [...document.querySelectorAll('[data-cue]')];

  document.title = DATA.title[LANG];
  doc.lang = LANG;
  main.setAttribute('aria-label', `${STR.label}: ${DATA.title[LANG]}`);
  $('.fp-poster-title').textContent = DATA.title[LANG];
  $('.fp-poster-go span').textContent = STR.start;
  $('.fp-sheet-title').textContent = STR.scenes;
  $('[data-act="close"]').setAttribute('aria-label', STR.close);
  prevBtn.setAttribute('aria-label', STR.prev);
  nextBtn.setAttribute('aria-label', STR.next);
  scenesBtn.setAttribute('aria-label', STR.scenes);
  range.setAttribute('aria-label', STR.scrub);
  range.max = String(tl.total);
  const svgEl = stage.querySelector('svg');
  if (svgEl && DATA.label) svgEl.setAttribute('aria-label', DATA.label[LANG]);

  // scene ticks on the scrubber, and the scene list
  const ticks = $('.fp-ticks');
  tl.starts.slice(1).forEach((s) => { const i = document.createElement('i'); i.style.left = `${(s / tl.total) * 100}%`; ticks.append(i); });
  const list = $('.fp-list');
  scenes.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fp-item';
    b.innerHTML = `<span class="fp-item-n">${i + 1}</span><span class="fp-item-t"></span><span class="fp-item-d">${fmtClock(tl.starts[i])}</span>`;
    b.querySelector('.fp-item-t').textContent = s.title[LANG];
    b.addEventListener('click', () => { closeSheet(); jump(tl.starts[i]); if (!playing) play(); });
    list.append(b);
  });
  const speedBtn = $('[data-act="speed"]');
  speedBtn.querySelector('.fp-speed-l').textContent = STR.speed;

  // ---------------------------------------------------------------- narration
  const inFrame = window.parent !== window;
  let bridge = false;
  const post = (msg) => { try { window.parent.postMessage(Object.assign({ type: 'vp-film' }, msg), '*'); } catch (e) { /* no parent */ } };
  window.addEventListener('message', (e) => {
    if (!inFrame || e.source !== window.parent) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'vp-film') return;
    if (d.op === 'ready') { bridge = true; doc.dataset.narration = 'bridge'; }
    else if (d.op === 'said') lineDone(d.id, d.result);
  });
  if (inFrame) post({ op: 'hello' });
  if (inFrame) document.body.style.background = 'transparent'; // the app's card shows round the player
  doc.dataset.narration = 'local';
  doc.dataset.said = '0';

  const localSynth = (() => { try { return window.speechSynthesis && typeof SpeechSynthesisUtterance === 'function' ? window.speechSynthesis : null; } catch (e) { return null; } })();
  function localSay(id, text) {
    if (!localSynth) { setTimeout(() => lineDone(id, 'failed'), 0); return; }
    try {
      localSynth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'en' ? 'en-GB' : 'nl-NL';
      u.rate = rate;
      const code = LANG === 'en' ? 'en' : 'nl';
      const voices = localSynth.getVoices();
      const v = voices.find((x) => x.lang.toLowerCase().startsWith(code) && x.localService) || voices.find((x) => x.lang.toLowerCase().startsWith(code));
      if (v) u.voice = v;
      const t0 = Date.now();
      u.onend = () => lineDone(id, Date.now() - t0 < 300 ? 'failed' : 'spoken');
      u.onerror = () => lineDone(id, 'failed');
      localSynth.speak(u);
    } catch (e) { setTimeout(() => lineDone(id, 'failed'), 0); }
  }
  function sayBeat(si, bi) {
    const b = scenes[si].beats[bi];
    const text = (b.voice || b.speak)[LANG]; // the narration script when the film has one
    const id = nextId++;
    speaking = { id, scene: si, beat: bi };
    // never wait forever: some engines never end a line
    const limit = Math.max(6000, 2000 + text.length * 90) / rate;
    setTimeout(() => lineDone(id, 'timeout'), limit);
    if (bridge) post({ op: 'say', id, text, lang: LANG, rate });
    else localSay(id, text);
  }
  let failures = 0;
  function lineDone(id, result) {
    if (!speaking || speaking.id !== id || speaking.until) return;
    speaking.until = performance.now() + 400; // a breath before the next line
    doc.dataset.said = String(Number(doc.dataset.said) + 1);
    if (result === 'failed') { failures += 1; if (failures >= 2) note.textContent = STR.voice; }
  }
  function cancelSpeech() {
    if (speaking) { if (bridge) post({ op: 'cancel' }); else if (localSynth) { try { localSynth.cancel(); } catch (e) { /* ignore */ } } }
    speaking = null;
  }

  // ---------------------------------------------------------------- drawing
  const local = () => {
    const si = sceneIndexAt(t, tl);
    return { si, lt: t - tl.starts[si] };
  };
  let shownKey = '';
  function caption(si, bi) {
    const key = `${si}:${bi}`;
    if (key === shownKey) return;
    shownKey = key;
    const b = scenes[si].beats[bi];
    const line = b.seg[LANG].map((p) => {
      if (typeof p === 'string') return document.createTextNode(p);
      const s = document.createElement('span');
      s.className = 'fp-term';
      s.textContent = p.t;
      if (!p.en) return s;
      const f = document.createDocumentFragment();
      const en = document.createElement('span');
      en.className = 'fp-en';
      en.lang = 'en';
      en.textContent = ` (${p.en})`;
      f.append(s, en);
      return f;
    });
    // in a video frame the line sits centred in a band of fixed height (one span)
    if (PRM.render) { const one = document.createElement('span'); one.append(...line); cap.replaceChildren(one); } else cap.replaceChildren(...line);
    // the readout of this beat, or the last one before it in the scene
    let r = null;
    for (let k = bi; k >= 0 && !r; k--) r = scenes[si].beats[k].read || null;
    read.textContent = r ? r[LANG] : '';
    read.hidden = !r;
    const on = new Set(b.cues);
    cueEls.forEach((el) => el.toggleAttribute('data-on', on.has(el.getAttribute('data-cue'))));
  }
  function draw() {
    const { si, lt } = local();
    const s = scenes[si];
    const bi = beatIndexAt(s, LANG, lt);
    const u = reduce ? (s.beats[bi].still ?? s.still) : Math.min(1, Math.max(0, lt / s.dur)); // a beat may set its own still
    STAGE.render(si, u);
    caption(si, bi);
    if (!scrubbing) range.value = String(Math.round(t * 10) / 10);
    range.setAttribute('aria-valuetext', `${STR.scene(si + 1, scenes.length)}: ${s.title[LANG]}, ${fmtClock(t)}`);
    clock.textContent = `${fmtClock(t)} / ${fmtClock(tl.total)}`;
    doc.dataset.scene = String(si + 1);
  }

  // ---------------------------------------------------------------- clock
  function advance(dt) {
    let target = t + dt * rate;
    const now = performance.now();
    if (!muted && speaking) {
      if (speaking.until && now >= speaking.until) speaking = null;
      else target = Math.min(target, holdLimit(tl, scenes, LANG, speaking.scene, speaking.beat) - 0.001);
    }
    t = Math.max(t, target);
    if (t >= tl.total - 0.0005) { t = tl.total; finish(); return; }
    const { si, lt } = local();
    const bi = beatIndexAt(scenes[si], LANG, lt);
    const key = `${si}:${bi}`;
    if (key !== spokenKey) {
      spokenKey = key;
      if (!muted) sayBeat(si, bi);
    }
  }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (playing && visible && !scrubbing) advance(dt);
    draw();
    if (playing) raf = requestAnimationFrame(frame);
  }
  const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };

  // ---------------------------------------------------------------- controls
  function setPlayBtn() {
    const label = ended ? STR.replay : playing ? STR.pause : STR.play;
    playBtn.setAttribute('aria-label', label);
    playBtn.dataset.state = ended ? 'replay' : playing ? 'pause' : 'play';
    main.dataset.playing = playing ? '1' : '0';
  }
  function play() {
    if (ended) { ended = false; t = 0; spokenKey = null; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    playing = true;
    setPlayBtn();
    kick();
  }
  function pause() {
    playing = false;
    cancelSpeech();
    spokenKey = null; // the beat speaks again from its start when play resumes
    setPlayBtn();
    draw();
  }
  function finish() {
    playing = false;
    ended = true;
    speaking = null;
    main.dataset.ended = '1';
    setPlayBtn();
  }
  function jump(to) {
    cancelSpeech();
    t = Math.max(0, Math.min(tl.total - 0.01, to));
    if (ended) { ended = false; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    spokenKey = null;
    setPlayBtn();
    draw();
  }
  const sceneStep = (dir) => {
    const { si, lt } = local();
    const to = dir < 0 ? (lt > 1.5 ? si : si - 1) : si + 1;
    if (to >= scenes.length) { jump(tl.total - 0.01); return; }
    jump(tl.starts[Math.max(0, to)]);
  };
  const toggle = () => (playing ? pause() : play());
  playBtn.addEventListener('click', toggle);
  $('.fp-poster-go').addEventListener('click', play);
  $('.fp-again').addEventListener('click', play);
  prevBtn.addEventListener('click', () => sceneStep(-1));
  nextBtn.addEventListener('click', () => sceneStep(1));
  function setMute(m) {
    muted = m;
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? STR.unmute : STR.mute);
    main.dataset.muted = muted ? '1' : '0';
    if (muted) cancelSpeech(); else spokenKey = null;
    if (inFrame) post({ op: 'mute', muted });
    else { try { localStorage.setItem('vp:filmMuted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ } }
  }
  muteBtn.addEventListener('click', () => setMute(!muted));
  speedBtn.addEventListener('click', () => {
    rate = rate === 1 ? 1.25 : 1;
    speedBtn.querySelector('.fp-speed-v').textContent = rate === 1 ? '1×' : '1,25×'.replace(',', LANG === 'en' ? '.' : ',');
    speedBtn.setAttribute('aria-pressed', rate !== 1 ? 'true' : 'false');
  });
  function openSheet() { sheet.hidden = false; scenesBtn.setAttribute('aria-expanded', 'true'); const { si } = local(); (list.children[si] || list.children[0]).focus(); }
  function closeSheet() { sheet.hidden = true; scenesBtn.setAttribute('aria-expanded', 'false'); }
  scenesBtn.addEventListener('click', () => (sheet.hidden ? openSheet() : closeSheet()));
  $('[data-act="close"]').addEventListener('click', () => { closeSheet(); scenesBtn.focus(); });

  // scrub: speech stops; the scene you land in speaks from its beat's start
  range.addEventListener('pointerdown', () => { scrubbing = true; cancelSpeech(); });
  const endScrub = () => { if (scrubbing) { scrubbing = false; spokenKey = null; kick(); } };
  range.addEventListener('pointerup', endScrub);
  range.addEventListener('pointercancel', endScrub);
  range.addEventListener('change', endScrub);
  range.addEventListener('input', () => { jump(Number(range.value)); if (playing) kick(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return; // the scrubber's own keys
    if (e.key === ' ' || e.key === 'k') { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') return; toggle(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  // pause when the film leaves the screen or the tab is hidden
  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  // tell the app how tall the film is, so its frame fits without scrolling
  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    // the frame is the video: no poster, controls or speech; time from the script
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          STAGE.render(at.si, at.u);
          caption(at.si, at.bi);
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        // the cue's glow breathes with the film's own clock, not the wall clock
        main.style.setProperty('--fp-b', `${(2.5 * (0.5 - 0.5 * Math.cos((2 * Math.PI * time) / 1.8))).toFixed(2)}px`);
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
