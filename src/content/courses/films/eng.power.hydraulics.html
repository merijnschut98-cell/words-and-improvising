 de pomp aan. De pomp maakt het debiet, de liters per minuut.","en":"The power unit: a motor drives the pump. The pump makes the flow, the litres per minute."},"cues":["motor","pump"],"still":0.252,"say":{"nl":["Die olie komt uit het hydraulisch aggregaat: tank, motor en pomp. Een tandwielpomp, schoepenpomp of zuigerpomp maakt het debiet: de liters per minuut."],"en":["That oil comes from the hydraulic power unit: tank, motor and pump. A gear, vane or piston pump makes the flow: the litres per minute."]},"voice":{"nl":"Die olie komt uit het hydraulisch aggregaat: tank, motor en pomp. Een tandwielpomp, schoepenpomp of zuigerpomp maakt het debiet: de liters per minuut.","en":"That oil comes from the hydraulic power unit: tank, motor and pump. A gear, vane or piston pump makes the flow: the litres per minute."}},{"seg":{"nl":["Het ",{"t":"stuurventiel","c":"valve","k":"eng.power.hydraulics#0","en":"directional valve"}," kiest waar de olie heen gaat: boven of onder de zuiger."],"en":["The ",{"t":"directional valve","c":"valve","k":"eng.power.hydraulics#0"}," chooses where the oil goes: above or below the piston."]},"text":{"nl":"Het stuurventiel (directional valve) kiest waar de olie heen gaat: boven of onder de zuiger.","en":"The directional valve chooses where the oil goes: above or below the piston."},"speak":{"nl":"Het stuur-ventiel kiest waar de olie heen gaat: boven of onder de zuiger.","en":"The directional valve chooses where the oil goes: above or below the piston."},"cues":["spool","valve"],"still":0.515,"say":{"nl":["Het ",{"t":"stuurventiel","k":"eng.power.hydraulics#0","en":"directional valve"}," op de tank kiest waar de olie heen gaat. In de ene stand gaat ze boven op de zuiger en schuift de stoter omlaag; in de andere gaat ze eronder en komt hij terug."],"en":["The ",{"t":"directional valve","k":"eng.power.hydraulics#0"}," on the tank chooses where the oil goes. In one position it goes on top of the piston, and the ram moves down. In the other it goes underneath, and the ram comes back."]},"voice":{"nl":"Het stuur-ventiel op de tank kiest waar de olie heen gaat. In de ene stand gaat ze boven op de zuiger en schuift de stoter omlaag; in de andere gaat ze eronder en komt hij terug.","en":"The directional valve on the tank chooses where the oil goes. In one position it goes on top of the piston, and the ram moves down. In the other it goes underneath, and the ram comes back."}},{"seg":{"nl":["De olie van de andere kant loopt via het filter terug naar de tank."],"en":["The oil from the other side runs back to the tank through the filter."]},"text":{"nl":"De olie van de andere kant loopt via het filter terug naar de tank.","en":"The oil from the other side runs back to the tank through the filter."},"speak":{"nl":"De olie van de andere kant loopt via het filter terug naar de tank.","en":"The oil from the other side runs back to the tank through the filter."},"cues":["filter"],"still":0.759,"say":{"nl":["De olie aan de andere kant van de zuiger loopt terug, door het filter, naar de tank."],"en":["The oil on the other side of the piston runs back, through the filter, to the tank."]},"voice":{"nl":"De olie aan de andere kant van de zuiger loopt terug, door het filter, naar de tank.","en":"The oil on the other side of the piston runs back, through the filter, to the tank."}},{"seg":{"nl":[{"t":"Cilindersnelheid","c":"speed","k":"eng.power.hydraulics#2","en":"cylinder speed"}," = debiet / zuigeroppervlak. Minder debiet: een tragere stoter."],"en":[{"t":"Cylinder speed","c":"speed","k":"eng.power.hydraulics#2"}," = flow / piston area. Less flow: a slower ram."]},"text":{"nl":"Cilindersnelheid (cylinder speed) = debiet / zuigeroppervlak. Minder debiet: een tragere stoter.","en":"Cylinder speed = flow / piston area. Less flow: a slower ram."},"speak":{"nl":"Cilinder-snelheid is debiet gedeeld door zuiger-oppervlak. Minder debiet: een tragere stoter.","en":"Cylinder speed is flow divided by piston area. Less flow: a slower ram."},"cues":["ram","speed"],"still":0.971,"say":{"nl":["De ",{"t":"cilindersnelheid","k":"eng.power.hydraulics#2","en":"cylinder speed"},", hoe snel de stoter gaat, is het debiet gedeeld door het zuigeroppervlak. Een smoorventiel knijpt het debiet en regelt zo de snelheid."],"en":["The ",{"t":"cylinder speed","k":"eng.power.hydraulics#2"},", how fast the ram moves, is the flow divided by the piston area. A flow control valve throttles the flow and so sets the speed."]},"voice":{"nl":"De cilinder-snelheid, hoe snel de stoter gaat, is het debiet gedeeld door het zuiger-oppervlak. Een smoor-ventiel knijpt het debiet en regelt zo de snelheid.","en":"The cylinder speed, how fast the ram moves, is the flow divided by the piston area. A flow control valve throttles the flow and so sets the speed."}}],"terms":[{"lesson":"eng.power.hydraulics","index":0,"nl":"Stuurventiel","en":"Directional valve","cue":"valve"},{"lesson":"eng.power.hydraulics","index":2,"nl":"Cilindersnelheid","en":"Cylinder speed","cue":"speed"}]},{"id":"s3","n":3,"level":2,"dur":38,"still":0.9,"title":{"nl":"De last maakt de druk","en":"The load makes the pressure"},"beats":[{"seg":{"nl":["De pomp maakt debiet, geen druk. Zakt de stoter vrij, dan blijft de druk laag."],"en":["The pump makes flow, not pressure. While the ram moves freely, the pressure stays low."]},"text":{"nl":"De pomp maakt debiet, geen druk. Zakt de stoter vrij, dan blijft de druk laag.","en":"The pump makes flow, not pressure. While the ram moves freely, the pressure stays low."},"speak":{"nl":"De pomp maakt debiet, geen druk. Zakt de stoter vrij, dan blijft de druk laag.","en":"The pump makes flow, not pressure. While the ram moves freely, the pressure stays low."},"cues":["ram","gaugeBig"],"still":0.258,"say":{"nl":["Een pomp maakt debiet, geen druk. De druk loopt maar zo ver op als de belasting tegenhoudt. Zolang de stoter vrij zakt, blijft de druk laag."],"en":["A pump makes flow, not pressure. The pressure only rises as far as the load resists. While the ram comes down freely, the pressure stays low."]},"voice":{"nl":"Een pomp maakt debiet, geen druk. De druk loopt maar zo ver op als de belasting tegenhoudt. Zolang de stoter vrij zakt, blijft de druk laag.","en":"A pump makes flow, not pressure. The pressure only rises as far as the load resists. While the ram comes down freely, the pressure stays low."}},{"seg":{"nl":["Raakt de matrijs het werkstuk, dan loopt de druk op."],"en":["When the die meets the workpiece, the pressure rises."]},"text":{"nl":"Raakt de matrijs het werkstuk, dan loopt de druk op.","en":"When the die meets the workpiece, the pressure rises."},"speak":{"nl":"Raakt de matrijs het werkstuk, dan loopt de druk op.","en":"When the die meets the workpiece, the pressure rises."},"cues":["gaugeBig"],"still":0.472,"say":{"nl":["Dan raakt de bovenste matrijs het werkstuk. De olie kan nergens meer heen, en de druk loopt snel op."],"en":["Then the upper die meets the workpiece. The oil has nowhere left to go, and the pressure climbs fast."]},"voice":{"nl":"Dan raakt de bovenste matrijs het werkstuk. De olie kan nergens meer heen, en de druk loopt snel op.","en":"Then the upper die meets the workpiece. The oil has nowhere left to go, and the pressure climbs fast."}},{"seg":{"nl":["Het ",{"t":"drukbegrenzingsventiel","c":"relief","k":"eng.power.hydraulics#1","en":"pressure relief valve"}," opent boven de ingestelde druk naar de tank."],"en":["The ",{"t":"pressure relief valve","c":"relief","k":"eng.power.hydraulics#1"}," opens to the tank above its set pressure."]},"text":{"nl":"Het drukbegrenzingsventiel (pressure relief valve) opent boven de ingestelde druk naar de tank.","en":"The pressure relief valve opens to the tank above its set pressure."},"speak":{"nl":"Het drukbegrenzings-ventiel opent boven de ingestelde druk naar de tank.","en":"The pressure relief valve opens to the tank above its set pressure."},"cues":["relief"],"still":0.724,"say":{"nl":["Daarom zit er altijd een ",{"t":"drukbegrenzingsventiel","k":"eng.power.hydraulics#1","en":"pressure relief valve"}," in. Boven een ingestelde waarde opent het naar de tank. Zo begrenst het de druk en beschermt het pomp, slangen en pers."],"en":["That is why there is always a ",{"t":"pressure relief valve","k":"eng.power.hydraulics#1"},". Above a set value it opens to the tank. That caps the pressure, and protects pump, hoses and press."]},"voice":{"nl":"Daarom zit er altijd een drukbegrenzings-ventiel in. Boven een ingestelde waarde opent het naar de tank. Zo begrenst het de druk en beschermt het pomp, slangen en pers.","en":"That is why there is always a pressure relief valve. Above a set value it opens to the tank. That caps the pressure, and protects pump, hoses and press."}},{"seg":{"nl":["Het debiet stroomt dan over het ventiel weg. Elk drukverlies wordt warmte."],"en":["The flow then pours away over the valve. Every pressure drop turns into heat."]},"text":{"nl":"Het debiet stroomt dan over het ventiel weg. Elk drukverlies wordt warmte.","en":"The flow then pours away over the valve. Every pressure drop turns into heat."},"speak":{"nl":"Het debiet stroomt dan over het ventiel weg. Elk drukverlies wordt warmte.","en":"The flow then pours away over the valve. Every pressure drop turns into heat."},"cues":["relief","filter"],"still":0.966,"say":{"nl":["Staat de stoter vast en draait de pomp door, dan stroomt het hele debiet over dat ventiel weg. Elk drukverlies over een ventiel wordt warmte."],"en":["If the ram is held and the pump keeps running, all of the flow pours away over that valve. Every pressure drop across a valve turns into heat."]},"voice":{"nl":"Staat de stoter vast en draait de pomp door, dan stroomt het hele debiet over dat ventiel weg. Elk drukverlies over een ventiel wordt warmte.","en":"If the ram is held and the pump keeps running, all of the flow pours away over that valve. Every pressure drop across a valve turns into heat."}}],"terms":[{"lesson":"eng.power.hydraulics","ind esson":"eng.power.hydraulics","value":"10","scene":"s5"},{"lesson":"eng.power.hydraulics","value":"4","scene":"s6"},{"lesson":"eng.power.hydraulics","value":"6","scene":"s6"},{"lesson":"eng.power.hydraulics","value":"14","scene":"s6"},{"lesson":"eng.power.hydraulics","value":"18","scene":"s6"},{"lesson":"eng.power.hydraulics","value":"13","scene":"s6"}],"label":{"nl":"Een hydraulische pers met een bed, twee staanders, een kop met de hoofdcilinder en een stoter met de bovenste matrijs boven de onderste matrijs, een veiligheidsblok, en rechts een hydraulisch aggregaat: een tank met peilglas, thermometer, ontluchter en retourfilter, een motor met pomp, een ventielblok met een stuurventiel met twee spoelen en een drukbegrenzingsventiel, en een accumulator met aftapventiel en manometer. Slangen lopen van het ventielblok naar de cilinder; een koppeling kan lekken, met een stuk karton ervoor. Kaarten tonen een doorsnede van de cilinder met de kracht, de schuif van het stuurventiel, de manometer, het rekenvoorbeeld met snelheid en warmte, de reinheidscode volgens ISO 4406 en twee lijstjes.","en":"A hydraulic press with a bed, two uprights, a crown with the main cylinder and a ram with the upper die above the lower die, a safety block, and on the right a hydraulic power unit: a tank with a level glass, thermometer, breather and return filter, a motor with a pump, a valve manifold with a two-coil directional valve and a pressure relief valve, and an accumulator with a bleed valve and gauge. Hoses run from the manifold to the cylinder; one fitting can leak, with a piece of cardboard held in front. Cards show a section through the cylinder with the force, the directional valve spool, the gauge, the worked example with speed and heat, the ISO 4406 cleanliness code and two checklists."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.
// The part between the build-only markers (caption markers, numbers, the SAY
// table and the speak variants) runs only at build time: the page's film data
// already carries the resolved captions and voice/speak strings, so the page
// inlines everything except that part (runtimeTimeline in films/_kit/player.mjs).
// Keep runtime code out of it, and build-only code in it.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;


// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each sentence is one
// Piper clip (films/_kit/narrate.mjs), commas inside: the voice makes its own
// comma pause and keeps the sentence melody. Piper's own edge silence is
// trimmed to about 40 ms (films/_kit/speak.py), so these are the pauses heard:
// sentence after a full stop, beat between two lines, hold at a scene's end.
// The listen guard (films/_kit/listen-guard.mjs) checks them on the render.
const PAUSES = { sentence: 0.6, beat: 0.9, hold: 0.8 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: PAUSES.hold, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
      return b;
    });
    t = round3(at + (si + 1 < durs.length ? g.hold : g.tail));
    scenes.push({ start: round3(start), dur: round3(t - start), beats: out });
  });
  return { scenes, total: t };
}
const round3 = (x) => Math.round(x * 1000) / 1000;

// Where time t falls on an audio timeline: the scene, the beat on screen (the
// last one started; the first while the scene opens) and the scene's progress u.
function timedAt(t, atl) {
  const sc = atl.scenes;
  let si = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) si = k;
  const s = sc[si];
  let bi = 0;
  for (let k = 0; k < s.beats.length; k++) if (t >= s.beats[k].start) bi = k;
  const u = Math.min(1, Math.max(0, (t - s.start) / s.dur));
  return { si, bi, u };
}

function timelineOf(scenes) {
  const starts = [];
  let t = 0;
  for (const s of scenes) { starts.push(t); t += s.dur; }
  return { starts, total: t };
}

function sceneIndexAt(t, tl) {
  let i = 0;
  for (let k = 0; k < tl.starts.length; k++) if (t >= tl.starts[k]) i = k;
  return i;
}

// ?scene=n is 1-based; anything odd opens the first scene.
function clampScene(param, count) {
  const n = parseInt(param, 10);
  if (!Number.isFinite(n) || n < 1) return 0;
  return Math.min(count, n) - 1;
}

// Beat starts within a scene (seconds), by each beat's share of the words.
function beatStarts(scene, lang) {
  const counts = scene.beats.map((b) => Math.max(1, wordsOf(b.text[lang] ?? b.text.nl)));
  const all = counts.reduce((a, b) => a + b, 0);
  const out = [];
  let acc = 0;
  for (const c of counts) { out.push(Math.round((acc / all) * scene.dur * 100) / 100); acc += c; }
  return out;
}

// The stage's u (0..1) in the HTML film. A stage drawn on the Dutch beats
// (nlBeats, set by beatwarp.js) runs, while caption beat k shows in `lang`,
// from Dutch beat k's fraction to k+1's, so English is never a beat off.
function stageU(scene, lang, local, nlBeats) {
  const u = Math.min(1, Math.max(0, local / scene.dur));
  if (!nlBeats || lang === 'nl' || !scene.beats || !scene.beats.length) return u;
  const own = beatStarts(scene, lang);
  const nl = beatStarts(scene, 'nl');
  let k = 0;
  for (let i = 0; i < own.length; i++) if (local >= own[i]) k = i;
  const a0 = own[k];
  const a1 = k + 1 < own.length ? own[k + 1] : scene.dur;
  const b0 = nl[k];
  const b1 = k + 1 < nl.length ? nl[k + 1] : scene.dur;
  const p = Math.min(1, Math.max(0, (local - a0) / Math.max(1e-6, a1 - a0)));
  return Math.min(1, Math.max(0, (b0 + p * (b1 - b0)) / scene.dur));
}

function beatIndexAt(scene, lang, local) {
  const starts = beatStarts(scene, lang);
  let i = 0;
  for (let k = 0; k < starts.length; k++) if (local >= starts[k]) i = k;
  return i;
}

// While a beat is being spoken the clock may run up to the next beat, or to the

  const STR = {
    nl: { play: 'Afspelen', pause: 'Pauzeren', replay: 'Opnieuw afspelen', mute: 'Gesproken uitleg uit', unmute: 'Gesproken uitleg aan', scenes: 'Scènes', close: 'Sluiten', prev: 'Vorige', next: 'Volgende', speed: 'Snelheid', scrub: 'Tijdlijn van de film', scene: (n, m) => `Scène ${n} van ${m}`, start: 'Bekijk de film', again: 'Nog een keer', voice: 'Geen stem op dit apparaat: lees de ondertitels mee.', label: 'Uitlegfilm' },
    en: { play: 'Play', pause: 'Pause', replay: 'Play again', mute: 'Narration off', unmute: 'Narration on', scenes: 'Scenes', close: 'Close', prev: 'Previous', next: 'Next', speed: 'Speed', scrub: 'Film timeline', scene: (n, m) => `Scene ${n} of ${m}`, start: 'Watch the film', again: 'Watch again', voice: 'No voice on this device: follow the captions.', label: 'Explainer film' },
  }[LANG];
  const doc = document.documentElement;
  const $ = (sel) => document.querySelector(sel);
  const scenes = DATA.scenes;
  const tl = timelineOf(scenes);
  const reduceMq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = !PRM.render && (PRM.reduce || reduceMq.matches);

  let t = tl.starts[clampScene(PRM.scene, scenes.length)];
  let playing = false;
  let started = false;
  let ended = false;
  let scrubbing = false;
  let visible = true;
  let rate = 1;
  let muted = PRM.muted;
  if (window.parent === window) { try { muted = localStorage.getItem('vp:filmMuted') === '1' || PRM.muted; } catch (e) { /* storage blocked */ } }
  let spokenKey = null; // "scene:beat" last handed to the voice
  let speaking = null; // { id, scene, beat, until? }
  let nextId = 1;
  let raf = 0;
  let last = 0;

  const main = $('.fp');
  const stage = $('.fp-stage');
  const cap = $('.fp-cap');
  const read = $('.fp-read');
  const playBtn = $('[data-act="play"]');
  const muteBtn = $('[data-act="mute"]');
  const scenesBtn = $('[data-act="scenes"]');
  const prevBtn = $('[data-act="prev"]');
  const nextBtn = $('[data-act="next"]');
  const range = $('.fp-range');
  const clock = $('.fp-time');
  const poster = $('.fp-poster');
  const sheet = $('.fp-sheet');
  const note = $('.fp-note');
  let focusOn = new Set();
  const lightFocus = () => stage.querySelectorAll('[data-cue]').forEach((el) => el.toggleAttribute('data-on', focusOn.has(el.getAttribute('data-cue'))));

  document.title = DATA.title[LANG];
  doc.lang = LANG;
  main.setAttribute('aria-label', `${STR.label}: ${DATA.title[LANG]}`);
  $('.fp-poster-title').textContent = DATA.title[LANG];
  $('.fp-poster-go span').textContent = STR.start;
  $('.fp-sheet-title').textContent = STR.scenes;
  $('[data-act="close"]').setAttribute('aria-label', STR.close);
  prevBtn.setAttribute('aria-label', STR.prev);
  nextBtn.setAttribute('aria-label', STR.next);
  scenesBtn.setAttribute('aria-label', STR.scenes);
  range.setAttribute('aria-label', STR.scrub);
  range.max = String(tl.total);
  const svgEl = stage.querySelector('svg');
  if (svgEl && DATA.label) svgEl.setAttribute('aria-label', DATA.label[LANG]);

  const ticks = $('.fp-ticks');
  tl.starts.slice(1).forEach((s) => { const i = document.createElement('i'); i.style.left = `${(s / tl.total) * 100}%`; ticks.append(i); });
  const list = $('.fp-list');
  scenes.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fp-item';
    b.innerHTML = `<span class="fp-item-n">${i + 1}</span><span class="fp-item-t"></span><span class="fp-item-d">${fmtClock(tl.starts[i])}</span>`;
    b.querySelector('.fp-item-t').textContent = s.title[LANG];
    b.addEventListener('click', () => { closeSheet(); jump(tl.starts[i]); if (!playing) play(); });
    list.append(b);
  });
  const speedBtn = $('[data-act="speed"]');
  speedBtn.querySelector('.fp-speed-l').textContent = STR.speed;

  const inFrame = window.parent !== window;
  let bridge = false;
  const post = (msg) => { try { window.parent.postMessage(Object.assign({ type: 'vp-film' }, msg), '*'); } catch (e) { /* no parent */ } };
  window.addEventListener('message', (e) => {
    if (!inFrame || e.source !== window.parent) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'vp-film') return;
    if (d.op === 'ready') { bridge = true; doc.dataset.narration = 'bridge'; }
    else if (d.op === 'said') lineDone(d.id, d.result);
  });
  if (inFrame) post({ op: 'hello' });
  if (inFrame) document.body.style.background = 'transparent'; // the app's card shows round the player
  doc.dataset.narration = 'local';
  doc.dataset.said = '0';

  const localSynth = (() => { try { return window.speechSynthesis && typeof SpeechSynthesisUtterance === 'function' ? window.speechSynthesis : null; } catch (e) { return null; } })();
  function localSay(id, text) {
    if (!localSynth) { setTimeout(() => lineDone(id, 'failed'), 0); return; }
    try {
      localSynth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'en' ? 'en-GB' : 'nl-NL';
      u.rate = rate;
      const code = LANG === 'en' ? 'en' : 'nl';
      const voices = localSynth.getVoices();
      const v = voices.find((x) => x.lang.toLowerCase().startsWith(code) && x.localService) || voices.find((x) => x.lang.toLowerCase().startsWith(code));
      if (v) u.voice = v;
      const t0 = Date.now();
      u.onend = () => lineDone(id, Date.now() - t0 < 300 ? 'failed' : 'spoken');
      u.onerror = () => lineDone(id, 'failed');
      localSynth.speak(u);
    } catch (e) { setTimeout(() => lineDone(id, 'failed'), 0); }
  }
  function sayBeat(si, bi) {
    const b = scenes[si].beats[bi];
    const text = (b.voice || b.speak)[LANG]; // the narration script when the film has one
    const id = nextId++;
    speaking = { id, scene: si, beat: bi };
    const limit = Math.max(6000, 2000 + text.length * 90) / rate;
    setTimeout(() => lineDone(id, 'timeout'), limit);
    if (bridge) post({ op: 'say', id, text, lang: LANG, rate });
    else localSay(id, text);
  }
  let failures = 0;
  function lineDone(id, result) {
    if (!speaking || speaking.id !== id || speaking.until) return;
    speaking.until = performance.now() + 400; // a breath before the next line
    doc.dataset.said = String(Number(doc.dataset.said) + 1);
    if (result === 'failed') { failures += 1; if (failures >= 2) note.textContent = STR.voice; }
  }
  function cancelSpeech() {
    if (speaking) { if (bridge) post({ op: 'cancel' }); else if (localSynth) { try { localSynth.cancel(); } catch (e) { /* ignore */ } } }
    speaking = null;
  }

  const local = () => {
    const si = sceneIndexAt(t, tl);
    return { si, lt: t - tl.starts[si] };
  };
  let shownKey = '';
  function caption(si, bi) {
    const key = `${si}:${bi}`;
    if (key === shownKey) return;
    shownKey = key;
    const b = scenes[si].beats[bi];
    const line = b.seg[LANG].map((p) => {
      if (typeof p === 'string') return document.createTextNode(p);
      const s = document.createElement('span');
      s.className = 'fp-term';
      s.textContent = p.t;
      if (!p.en) return s;
      const f = document.createDocumentFragment();
      const en = document.createElement('span');
      en.className = 'fp-en';
      en.lang = 'en';
      en.textContent = ` (${p.en})`;
      f.append(s, en);
      return f;
    });
    if (PRM.render) { const one = document.createElement('span'); one.append(...line); cap.replaceChildren(one); } else cap.replaceChildren(...line);
    let r = null;
    for (let k = bi; k >= 0 && !r; k--) r = scenes[si].beats[k].read || null;
    read.textContent = r ? r[LANG] : '';
    read.hidden = !r;
    focusOn = new Set(b.cues);
    main.dataset.focus = main.dataset.focus === 'a' ? 'b' : 'a'; // the halo eases in again
  }
  function draw() {
    const { si, lt } = local();
    const s = scenes[si];
    const bi = beatIndexAt(s, LANG, lt);
    const u = reduce ? (s.beats[bi].still ?? s.still) : stageU(s, LANG, lt, STAGE.nlBeats === true);
    caption(si, bi);
    STAGE.render(si, u); lightFocus();
    if (!scrubbing) range.value = String(Math.round(t * 10) / 10);
    range.setAttribute('aria-valuetext', `${STR.scene(si + 1, scenes.length)}: ${s.title[LANG]}, ${fmtClock(t)}`);
    clock.textContent = `${fmtClock(t)} / ${fmtClock(tl.total)}`;
    doc.dataset.scene = String(si + 1);
  }

  function advance(dt) {
    let target = t + dt * rate;
    const now = performance.now();
    if (!muted && speaking) {
      if (speaking.until && now >= speaking.until) speaking = null;
      else target = Math.min(target, holdLimit(tl, scenes, LANG, speaking.scene, speaking.beat) - 0.001);
    }
    t = Math.max(t, target);
    if (t >= tl.total - 0.0005) { t = tl.total; finish(); return; }
    const { si, lt } = local();
    const bi = beatIndexAt(scenes[si], LANG, lt);
    const key = `${si}:${bi}`;
    if (key !== spokenKey) {
      spokenKey = key;
      if (!muted) sayBeat(si, bi);
    }
  }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (playing && visible && !scrubbing) advance(dt);
    draw();
    if (playing) raf = requestAnimationFrame(frame);
  }
  const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };

  function setPlayBtn() {
    const label = ended ? STR.replay : playing ? STR.pause : STR.play;
    playBtn.setAttribute('aria-label', label);
    playBtn.dataset.state = ended ? 'replay' : playing ? 'pause' : 'play';
    main.dataset.playing = playing ? '1' : '0';
  }
  function play() {
    if (ended) { ended = false; t = 0; spokenKey = null; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    playing = true;
    setPlayBtn();
    kick();
  }
  function pause() {
    playing = false;
    cancelSpeech();
    spokenKey = null; // the beat speaks again from its start when play resumes
    setPlayBtn();
    draw();
  }
  function finish() {
    playing = false;
    ended = true;
    speaking = null;
    main.dataset.ended = '1';
    setPlayBtn();
  }
  function jump(to) {
    cancelSpeech();
    t = Math.max(0, Math.min(tl.total - 0.01, to));
    if (ended) { ended = false; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    spokenKey = null;
    setPlayBtn();
    draw();
  }
  const sceneStep = (dir) => {
    const { si, lt } = local();
    const to = dir < 0 ? (lt > 1.5 ? si : si - 1) : si + 1;
    if (to >= scenes.length) { jump(tl.total - 0.01); return; }
    jump(tl.starts[Math.max(0, to)]);
  };
  const toggle = () => (playing ? pause() : play());
  playBtn.addEventListener('click', toggle);
  $('.fp-poster-go').addEventListener('click', play);
  $('.fp-again').addEventListener('click', play);
  prevBtn.addEventListener('click', () => sceneStep(-1));
  nextBtn.addEventListener('click', () => sceneStep(1));
  function setMute(m) {
    muted = m;
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? STR.unmute : STR.mute);
    main.dataset.muted = muted ? '1' : '0';
    if (muted) cancelSpeech(); else spokenKey = null;
    if (inFrame) post({ op: 'mute', muted });
    else { try { localStorage.setItem('vp:filmMuted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ } }
  }
  muteBtn.addEventListener('click', () => setMute(!muted));
  speedBtn.addEventListener('click', () => {
    rate = rate === 1 ? 1.25 : 1;
    speedBtn.querySelector('.fp-speed-v').textContent = rate === 1 ? '1×' : '1,25×'.replace(',', LANG === 'en' ? '.' : ',');
    speedBtn.setAttribute('aria-pressed', rate !== 1 ? 'true' : 'false');
  });
  function openSheet() { sheet.hidden = false; scenesBtn.setAttribute('aria-expanded', 'true'); const { si } = local(); (list.children[si] || list.children[0]).focus(); }
  function closeSheet() { sheet.hidden = true; scenesBtn.setAttribute('aria-expanded', 'false'); }
  scenesBtn.addEventListener('click', () => (sheet.hidden ? openSheet() : closeSheet()));
  $('[data-act="close"]').addEventListener('click', () => { closeSheet(); scenesBtn.focus(); });

  range.addEventListener('pointerdown', () => { scrubbing = true; cancelSpeech(); });
  const endScrub = () => { if (scrubbing) { scrubbing = false; spokenKey = null; kick(); } };
  range.addEventListener('pointerup', endScrub);
  range.addEventListener('pointercancel', endScrub);
  range.addEventListener('change', endScrub);
  range.addEventListener('input', () => { jump(Number(range.value)); if (playing) kick(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return; // the scrubber's own keys
    if (e.key === ' ' || e.key === 'k') { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') return; toggle(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          caption(at.si, at.bi);
          STAGE.render(at.si, at.u); lightFocus();
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
