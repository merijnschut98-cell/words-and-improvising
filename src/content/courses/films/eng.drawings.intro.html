s":[]}],"skip":[],"numbers":[],"module":"eng.drawings","topics":[{"id":"draw","title":{"nl":"Een technische tekening lezen","en":"Reading a technical drawing"},"scene":"s2","cue":"tDraw"},{"id":"tol","title":{"nl":"Toleranties en GD&T","en":"Tolerances and GD&T"},"scene":"s3","cue":"tTol"},{"id":"schematics","title":{"nl":"P&ID’s, schema’s en het besturingssysteem","en":"P&IDs, schematics and the control system"},"scene":"s4","cue":"tSch"},{"id":"control","title":{"nl":"Regelkringen en PID","en":"Control loops and PID"},"scene":"s5","cue":"tCtl"}],"tileUnits":250,"strictFocus":true,"label":{"nl":"Een kantoorhoek, een werkbank en de tank van de fabriek, op mensenmaat. Links vooraan een tekentafel met de tekening van de plaat: het vooraanzicht met vier gaten, een zijaanzicht, een tolerantiekader bij een gat en rechtsonder de stempel; vooraan rechts een werkbank met de plaat zelf; achterin rechts de tank van de vuleenheid met een niveaumeter bovenop, een regelklep in de toevoerleiding en een afvoerleiding met een pomp naar de eenheid; op de achterwand een besturingsscherm met het niveau en de streefwaarde. Een ontwerper aan de tekentafel, een maker met een veiligheidsbril en handschoenen, een operator met een veiligheidsbril, en jij, de engineer. Rechts een paneel, gemarkeerd als voorbeeld of schema: de tekening voor de maker, de aanzichten van de plaat, de maat met zijn tolerantie, de P&ID van de tank, de regelkring van het niveau en de vier onderwerpen van de module; aan het eind de kaart van Engineering met Tekeningen en regeling verlicht en de vier onderwerpen met hun niveaus.","en":"An office corner, a workbench and the tank of the plant, at person scale. At the front left a drawing table with the drawing of the plate: the front view with four holes, a side view, a feature control frame at a hole and the title block bottom right; at the front right a workbench with the plate itself; at the back right the tank of the filling unit with a level meter on top, a contro
