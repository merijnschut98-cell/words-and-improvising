 en tot slot hoe je het zegt zonder jargon.","en":"A meeting room. On the back wall a whiteboard and a clock, on the side wall a calendar strip of sixteen weeks, with milestones as diamonds in weeks 4, 8 and 16 and two-week rounds. You, the consultant in petrol, stand at the board. The team lead stands at the left end of the table, the sponsor in a suit and tie at the right end, the planner with a tablet at the front. On the table a paper checklist with five checks, one of which is struck out and one added. At the right a panel with one card per scene: the four phases of a waterfall with sign-offs, the short rounds of agile and the Agile Manifesto of 2001, a sprint with planning, review and retrospective, a hybrid plan with milestones above and rounds below and a pilot, a grid operator's readiness check with its plan, the checklist round by round, and finally how to say it without jargon."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.
// The part between the build-only markers (caption markers, numbers, the SAY
// table and the speak variants) runs only at build time: the page's film data
// already carries the resolved captions and voice/speak strings, so the page
// inlines everything except that part (runtimeTimeline in films/_kit/player.mjs).
// Keep runtime code out of it, and build-only code in it.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;


// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each sentence is one
// Piper clip (films/_kit/narrate.mjs), commas inside: the voice makes its own
// comma pause and keeps the sentence melody. Piper's own edge silence is
// trimmed to about 40 ms (films/_kit/speak.py), so these are the pauses heard:
// sentence after a full stop, beat between two lines, hold at a scene's end.
// The listen guard (films/_kit/listen-guard.mjs) checks them on the render.
const PAUSES = { sentence: 0.6, beat: 0.9, hold: 0.8 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: PAUSES.hold, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
      return b;
    });
    t = round3(at + (si + 1 < durs.length ? g.hold : g.tail));
    scenes.push({ start: round3(start), dur: round3(t - start), beats: out });
  });
  return { scenes, total: t };
}
const round3 = (x) => Math.round(x * 1000) / 1000;

// Where time t falls on an audio timeline: the scene, the beat on screen (the
// last one started; the first while the scene opens) and the scene's progress u.
function timedAt(t, atl) {
  const sc = atl.scenes;
  let si = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) si = k;
  const s = sc[si];
  let bi = 0;
  for (let k = 0; k < s.beats.length; k++) if (t >= s.beats[k].start) bi = k;
  const u = Math.min(1, Math.max(0, (t - s.start) / s.dur));
  return { si, bi, u };
}

function timelineOf(scenes) {
  const starts = [];
  let t = 0;
  for (const s of scenes) { starts.push(t); t += s.dur; }
  return { starts, total: t };
}

function sceneIndexAt(t, tl) {
  let i = 0;
  for (let k = 0; k < tl.starts.length; k++) if (t >= tl.starts[k]) i = k;
  return i;
}

// ?scene=n is 1-based; anything odd opens the first scene.
function clampScene(param, count) {
  const n = parseInt(param, 10);
  if (!Number.isFinite(n) || n < 1) return 0;
  return Math.min(count, n) - 1;
}

// Beat starts within a scene (seconds), by each beat's share of the words.
function beatStarts(scene, lang) {
  const counts = scene.beats.map((b) => Math.max(1, wordsOf(b.text[lang] ?? b.text.nl)));
  const all = counts.reduce((a, b) => a + b, 0);
  const out = [];
  let acc = 0;
  for (const c of counts) { out.push(Math.round((acc / all) * scene.dur * 100) / 100); acc += c; }
  return out;
}

// The stage's u (0..1) in the HTML film. A stage drawn on the Dutch beats
// (nlBeats, set by beatwarp.js) runs, while caption beat k shows in `lang`,
// from Dutch beat k's fraction to k+1's, so English is never a beat off.
function stageU(scene, lang, local, nlBeats) {
  const u = Math.min(1, Math.max(0, local / scene.dur));
  if (!nlBeats || lang === 'nl' || !scene.beats || !scene.beats.length) return u;
  const own = beatStarts(scene, lang);
  const nl = beatStarts(scene, 'nl');
  let k = 0;
  for (let i = 0; i < own.length; i++) if (local >= own[i]) k = i;

    if (d.op === 'ready') { bridge = true; doc.dataset.narration = 'bridge'; }
    else if (d.op === 'said') lineDone(d.id, d.result);
  });
  if (inFrame) post({ op: 'hello' });
  if (inFrame) document.body.style.background = 'transparent'; // the app's card shows round the player
  doc.dataset.narration = 'local';
  doc.dataset.said = '0';

  const localSynth = (() => { try { return window.speechSynthesis && typeof SpeechSynthesisUtterance === 'function' ? window.speechSynthesis : null; } catch (e) { return null; } })();
  function localSay(id, text) {
    if (!localSynth) { setTimeout(() => lineDone(id, 'failed'), 0); return; }
    try {
      localSynth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'en' ? 'en-GB' : 'nl-NL';
      u.rate = rate;
      const code = LANG === 'en' ? 'en' : 'nl';
      const voices = localSynth.getVoices();
      const v = voices.find((x) => x.lang.toLowerCase().startsWith(code) && x.localService) || voices.find((x) => x.lang.toLowerCase().startsWith(code));
      if (v) u.voice = v;
      const t0 = Date.now();
      u.onend = () => lineDone(id, Date.now() - t0 < 300 ? 'failed' : 'spoken');
      u.onerror = () => lineDone(id, 'failed');
      localSynth.speak(u);
    } catch (e) { setTimeout(() => lineDone(id, 'failed'), 0); }
  }
  function sayBeat(si, bi) {
    const b = scenes[si].beats[bi];
    const text = (b.voice || b.speak)[LANG]; // the narration script when the film has one
    const id = nextId++;
    speaking = { id, scene: si, beat: bi };
    const limit = Math.max(6000, 2000 + text.length * 90) / rate;
    setTimeout(() => lineDone(id, 'timeout'), limit);
    if (bridge) post({ op: 'say', id, text, lang: LANG, rate });
    else localSay(id, text);
  }
  let failures = 0;
  function lineDone(id, result) {
    if (!speaking || speaking.id !== id || speaking.until) return;
    speaking.until = performance.now() + 400; // a breath before the next line
    doc.dataset.said = String(Number(doc.dataset.said) + 1);
    if (result === 'failed') { failures += 1; if (failures >= 2) note.textContent = STR.voice; }
  }
  function cancelSpeech() {
    if (speaking) { if (bridge) post({ op: 'cancel' }); else if (localSynth) { try { localSynth.cancel(); } catch (e) { /* ignore */ } } }
    speaking = null;
  }

  const local = () => {
    const si = sceneIndexAt(t, tl);
    return { si, lt: t - tl.starts[si] };
  };
  let shownKey = '';
  function caption(si, bi) {
    const key = `${si}:${bi}`;
    if (key === shownKey) return;
    shownKey = key;
    const b = scenes[si].beats[bi];
    const line = b.seg[LANG].map((p) => {
      if (typeof p === 'string') return document.createTextNode(p);
      const s = document.createElement('span');
      s.className = 'fp-term';
      s.textContent = p.t;
      if (!p.en) return s;
      const f = document.createDocumentFragment();
      const en = document.createElement('span');
      en.className = 'fp-en';
      en.lang = 'en';
      en.textContent = ` (${p.en})`;
      f.append(s, en);
      return f;
    });
    if (PRM.render) { const one = document.createElement('span'); one.append(...line); cap.replaceChildren(one); } else cap.replaceChildren(...line);
    let r = null;
    for (let k = bi; k >= 0 && !r; k--) r = scenes[si].beats[k].read || null;
    read.textContent = r ? r[LANG] : '';
    read.hidden = !r;
    focusOn = new Set(b.cues);
    main.dataset.focus = main.dataset.focus === 'a' ? 'b' : 'a'; // the halo eases in again
  }
  function draw() {
    const { si, lt } = local();
    const s = scenes[si];
    const bi = beatIndexAt(s, LANG, lt);
    const u = reduce ? (s.beats[bi].still ?? s.still) : stageU(s, LANG, lt, STAGE.nlBeats === true);
    caption(si, bi);
    STAGE.render(si, u); lightFocus();
    if (!scrubbing) range.value = String(Math.round(t * 10) / 10);
    range.setAttribute('aria-valuetext', `${STR.scene(si + 1, scenes.length)}: ${s.title[LANG]}, ${fmtClock(t)}`);
    clock.textContent = `${fmtClock(t)} / ${fmtClock(tl.total)}`;
    doc.dataset.scene = String(si + 1);
  }

  function advance(dt) {
    let target = t + dt * rate;
    const now = performance.now();
    if (!muted && speaking) {
      if (speaking.until && now >= speaking.until) speaking = null;
      else target = Math.min(target, holdLimit(tl, scenes, LANG, speaking.scene, speaking.beat) - 0.001);
    }
    t = Math.max(t, target);
    if (t >= tl.total - 0.0005) { t = tl.total; finish(); return; }
    const { si, lt } = local();
    const bi = beatIndexAt(scenes[si], LANG, lt);
    const key = `${si}:${bi}`;
    if (key !== spokenKey) {
      spokenKey = key;
      if (!muted) sayBeat(si, bi);
    }
  }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (playing && visible && !scrubbing) advance(dt);
    draw();
    if (playing) raf = requestAnimationFrame(frame);
  }
  const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };

  function setPlayBtn() {
    const label = ended ? STR.replay : playing ? STR.pause : STR.play;
    playBtn.setAttribute('aria-label', label);
    playBtn.dataset.state = ended ? 'replay' : playing ? 'pause' : 'play';
    main.dataset.playing = playing ? '1' : '0';
  }
  function play() {
    if (ended) { ended = false; t = 0; spokenKey = null; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    playing = true;
    setPlayBtn();
    kick();
  }
  function pause() {
    playing = false;
    cancelSpeech();
    spokenKey = null; // the beat speaks again from its start when play resumes
    setPlayBtn();
    draw();
  }
  function finish() {
    playing = false;
    ended = true;
    speaking = null;
    main.dataset.ended = '1';
    setPlayBtn();
  }
  function jump(to) {
    cancelSpeech();
    t = Math.max(0, Math.min(tl.total - 0.01, to));
    if (ended) { ended = false; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    spokenKey = null;
    setPlayBtn();
    draw();
  }
  const sceneStep = (dir) => {
    const { si, lt } = local();
    const to = dir < 0 ? (lt > 1.5 ? si : si - 1) : si + 1;
    if (to >= scenes.length) { jump(tl.total - 0.01); return; }
    jump(tl.starts[Math.max(0, to)]);
  };
  const toggle = () => (playing ? pause() : play());
  playBtn.addEventListener('click', toggle);
  $('.fp-poster-go').addEventListener('click', play);
  $('.fp-again').addEventListener('click', play);
  prevBtn.addEventListener('click', () => sceneStep(-1));
  nextBtn.addEventListener('click', () => sceneStep(1));
  function setMute(m) {
    muted = m;
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? STR.unmute : STR.mute);
    main.dataset.muted = muted ? '1' : '0';
    if (muted) cancelSpeech(); else spokenKey = null;
    if (inFrame) post({ op: 'mute', muted });
    else { try { localStorage.setItem('vp:filmMuted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ } }
  }
  muteBtn.addEventListener('click', () => setMute(!muted));
  speedBtn.addEventListener('click', () => {
    rate = rate === 1 ? 1.25 : 1;
    speedBtn.querySelector('.fp-speed-v').textContent = rate === 1 ? '1×' : '1,25×'.replace(',', LANG === 'en' ? '.' : ',');
    speedBtn.setAttribute('aria-pressed', rate !== 1 ? 'true' : 'false');
  });
  function openSheet() { sheet.hidden = false; scenesBtn.setAttribute('aria-expanded', 'true'); const { si } = local(); (list.children[si] || list.children[0]).focus(); }
  function closeSheet() { sheet.hidden = true; scenesBtn.setAttribute('aria-expanded', 'false'); }
  scenesBtn.addEventListener('click', () => (sheet.hidden ? openSheet() : closeSheet()));
  $('[data-act="close"]').addEventListener('click', () => { closeSheet(); scenesBtn.focus(); });

  range.addEventListener('pointerdown', () => { scrubbing = true; cancelSpeech(); });
  const endScrub = () => { if (scrubbing) { scrubbing = false; spokenKey = null; kick(); } };
  range.addEventListener('pointerup', endScrub);
  range.addEventListener('pointercancel', endScrub);
  range.addEventListener('change', endScrub);
  range.addEventListener('input', () => { jump(Number(range.value)); if (playing) kick(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return; // the scrubber's own keys
    if (e.key === ' ' || e.key === 'k') { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') return; toggle(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          caption(at.si, at.bi);
          STAGE.render(at.si, at.u); lightFocus();
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
