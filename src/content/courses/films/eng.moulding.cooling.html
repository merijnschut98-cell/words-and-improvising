etter."]},"voice":{"nl":"Het water moet hard genoeg stromen voor turbulente stroming. Wervelend in plaats van in laagjes glijdend, want wervelend water voert veel beter warmte af.","en":"The water must flow hard enough for turbulent flow. Swirling instead of sliding in layers, because swirling water carries heat away far better."}},{"seg":{"nl":["Kalkaanslag in de kanalen werkt als isolatie."],"en":["Limescale in the channels acts as insulation."]},"text":{"nl":"Kalkaanslag in de kanalen werkt als isolatie.","en":"Limescale in the channels acts as insulation."},"speak":{"nl":"Kalkaanslag in de kanalen werkt als isolatie.","en":"Limescale in the channels acts as insulation."},"cues":["turb"],"focus":["turb"],"say":{"nl":["Kalkaanslag in de kanalen werkt als isolatie."],"en":["Limescale in the channels acts as insulation."]},"voice":{"nl":"Kalkaanslag in de kanalen werkt als isolatie.","en":"Limescale in the channels acts as insulation."}}],"terms":[{"lesson":"eng.moulding.cooling","index":3,"nl":"Turbulente stroming","en":"Turbulent flow","cue":"turb"}]},{"id":"s5","n":5,"level":2,"dur":18,"still":0.9,"title":{"nl":"De controle","en":"The check"},"beats":[{"seg":{"nl":["Goede check: het water komt er maar een paar graden warmer uit. Een groot verschil: te weinig doorstroming."],"en":["A good check: the water comes out only a few degrees warmer. A large difference means too little flow."]},"text":{"nl":"Goede check: het water komt er maar een paar graden warmer uit. Een groot verschil: te weinig doorstroming.","en":"A good check: the water comes out only a few degrees warmer. A large difference means too little flow."},"speak":{"nl":"Goede check: het water komt er maar een paar graden warmer uit. Een groot verschil: te weinig doorstroming.","en":"A good check: the water comes out only a few degrees warmer. A large difference means too little flow."},"cues":["labels"],"focus":["labels"],"say":{"nl":["Een goede check. Het water komt er maar een paar graden warmer uit da jes van een seconde en meet bij elke stap de kritische maat.","en":"Lower the cooling time in steps of a second and measure the critical size at each step."},"speak":{"nl":"Verlaag de koeltijd in stapjes van een seconde en meet bij elke stap de kritische maat.","en":"Lower the cooling time in steps of a second and measure the critical size at each step."},"cues":["card"],"focus":["card"],"say":{"nl":["Instellers zetten er vaak seconden koeltijd bij voor de zekerheid. De nette manier om het echte minimum te vinden is anders. Verlaag de koeltijd in kleine stapjes, bijvoorbeeld een seconde. Meet bij elke stap de kritische maat of het kromtrekken, nadat de producten op kamertemperatuur zijn."],"en":["Setters often add seconds of cooling time to be safe. The proper way to find the real minimum is different. Lower the cooling time in small steps, for example a second. At each step measure the critical dimension or the warpage, after the parts are at room temperature."]},"voice":{"nl":"Instellers zetten er vaak seconden koeltijd bij voor de zekerheid. De nette manier om het echte minimum te vinden is anders. Verlaag de koeltijd in kleine stapjes, bijvoorbeeld een seconde. Meet bij elke stap de kritische maat of het kromtrekken, nadat de producten op kamertemperatuur zijn.","en":"Setters often add seconds of cooling time to be safe. The proper way to find the real minimum is different. Lower the cooling time in small steps, for example a second. At each step measure the critical dimension or the warpage, after the parts are at room temperature."}},{"seg":{"nl":["Een 4-voudige matrijs: cyclus ","24"," s, koelen ","14"," s, ","3.600"," / ","24"," × ","4"," = ","600"," per uur."],"en":["A 4-cavity mould: cycle ","24"," s, cooling ","14"," s, ","3,600"," / ","24"," × ","4"," = ","600"," per hour."]},"text":{"nl":"Een 4-voudige matrijs: cyclus 24 s, koelen 14 s, 3.600 / 24 × 4 = 600 per uur.","en":"A 4-cavity mould: cycle 24 s, cooling 14 s, 3,600 / 24 × 4 = 600 per hour."},"spe
