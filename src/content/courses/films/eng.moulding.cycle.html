l":["Dan de matrijs. De ",{"t":"matrijsafschrijving","k":"eng.moulding.partcost#1","en":"mould amortisation"}," verdeelt de ","80.000"," euro die hij kost over een miljoen stuks: acht cent per stuk."],"en":["Then the mould. The ",{"t":"mould amortisation","k":"eng.moulding.partcost#1"}," spreads the ","80,000"," euros it costs over a million parts: eight cents each."]},"voice":{"nl":"Dan de matrijs. De matrijsafschrijving verdeelt de 80.000 euro die hij kost over een miljoen stuks: acht cent per stuk.","en":"Then the mould. The mould amortisation spreads the 80,000 euros it costs over a million parts: eight cents each."}},{"seg":{"nl":["Samen zo’n € ","0,31",": de machinetijd is hier de grootste post."],"en":["Together about €","0.31",": machine time is the biggest line here."]},"text":{"nl":"Samen zo’n € 0,31: de machinetijd is hier de grootste post.","en":"Together about €0.31: machine time is the biggest line here."},"speak":{"nl":"Samen zo'n 0,31 euro: de machinetijd is hier de grootste post.","en":"Together about 0.31 euros: machine time is the biggest line here."},"cues":["rate"],"say":{"nl":["Samen zo’n eenendertig cent. De machinetijd is hier de grootste post, dus elke seconde cyclus zie je terug in de prijs."],"en":["Together about thirty-one cents. Machine time is the biggest line here, so every second of cycle shows up in the price."]},"voice":{"nl":"Samen zo'n eenendertig cent. De machinetijd is hier de grootste post, dus elke seconde cyclus zie je terug in de prijs.","en":"Together about thirty-one cents. Machine time is the biggest line here, so every second of cycle shows up in the price."}}],"terms":[{"lesson":"eng.moulding.partcost","index":2,"nl":"Afkeurpercentage","en":"Scrap rate","cue":"scrap"},{"lesson":"eng.moulding.partcost","index":0,"nl":"Machine-uurtarief","en":"Machine hour rate","cue":"rate"},{"lesson":"eng.moulding.partcost","index":1,"nl":"Matrijsafschrijving","en":"Mould amortisation","cue":"amort"}]}],"skip":[],"numbers":[{"lesson":"eng.moulding.cycle","value":"30","scene":"s1"},{"lesson":"eng.moulding.cycle","value":"2","scene":"s1"},{"lesson":"eng.moulding.cycle","value":"1,5","scene":"s1"},{"lesson":"eng.moulding.cycle","value":"6","scene":"s1"},{"lesson":"eng.moulding.cycle","value":"15","scene":"s1"},{"lesson":"eng.moulding.cycle","value":"3,5","scene":"s1"},{"lesson":"eng.moulding.cycle","value":"20","scene":"s2"},{"lesson":"eng.moulding.cycle","value":"3.600","scene":"s2"},{"lesson":"eng.moulding.cycle","value":"360","scene":"s2"},{"lesson":"eng.moulding.cycle","value":"12","scene":"s4"},{"lesson":"eng.moulding.cycle","value":"3","scene":"s4"},{"lesson":"eng.moulding.cycle","value":"2,4","scene":"s4"},{"lesson":"eng.moulding.cycle","value":"7,7","scene":"s4"},{"lesson":"eng.moulding.cycle","value":"459","scene":"s4"},{"lesson":"eng.moulding.cycle","value":"0,64","scene":"s4"},{"lesson":"eng.moulding.cycle","value":"15,7","scene":"s4"},{"lesson":"eng.moulding.cooling","value":"80","scene":"s5"},{"lesson":"eng.moulding.cavities","value":"720","scene":"s6"},{"lesson":"eng.moulding.cavities","value":"24","scene":"s6"},{"lesson":"eng.moulding.cavities","value":"1.200","scene":"s6"},{"lesson":"eng.moulding.partcost","value":"40","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"2,00","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"0,082","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"60","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"408","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"0,147","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"0,85","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"85","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"80.000","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"1","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"0,080","scene":"s7"},{"lesson":"eng.moulding.partcost","value":"0,31","scene":"s7"}],"label":{"nl":"Een spuitgietmachine die één cyclus draait; een doorsnede door een matrijs met koelkanalen en een temperatuurregelaar; matrijsplaten met vier en acht holtes; munten die de kostprijs van een dop tonen.","en":"An injection moulding machine running one cycle; a section through a mould with cooling channels and a temperature control unit; mould plates with four and eight cavities; coins showing what a cap costs."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;

// A scene lasts at least (caption words / 2.5) + 2 s, so it can be read.
const minSceneDur = (words) => words / 2.5 + 2;

// "De {t:Snijsnelheid} is {n:220} m/min" → text, term and number pieces.
// {t:Term|shown} names lesson term Term but shows "shown" (another form).
function parseMarked(src) {
  const out = [];
  const re = /\{([a-z]):([^{}]*)\}/g;
  let last = 0;
  let m;
  const plain = (s) => {
    if (/[{}]/.test(s)) throw new Error(`bad marker in "${src}"`);
    if (s) out.push({ text: s });
  };
  while ((m = re.exec(src))) {
    plain(src.slice(last, m.index));
    if (m[1] === 't') {
      const [term, shown] = m[2].split('|');
      out.push({ term: term.trim(), shown: (shown ?? term).trim() });
    } else if (m[1] === 'n') out.push({ num: m[2].trim() });
    else throw new Error(`bad marker {${m[1]}:} in "${src}"`);
    last = re.lastIndex;
  }
  plain(src.slice(last));
  return out;
}

// "1167" → 1.167 (nl) or 1,167 (en); "0.3" → 0,3 or 0.3. Decimals as written.
function formatNumber(raw, lang) {
  const s = String(raw);
  if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error(`not a plain number: ${s}`);
  const [int, dec] = s.split('.');
  const group = lang === 'en' ? ',' : '.';
  const point = lang === 'en' ? '.' : ',';
  const body = int.replace(/^-/, '');
  const grouped = body.length >= 4 ? body.replace(/\B(?=(\d{3})+(?!\d))/g, group) : body;
  return (int.startsWith('-') ? '-' : '') + grouped + (dec !== undefined ? point + dec : '');
}

// A resolved caption is a list of strings and term pieces {t, en?, c}. In Dutch
// a term carries its English word (en) on first use only.
const plainOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t + (p.en ? ` (${p.en})` : ''))).join('');
// Units and signs a voice would spell out or skip, said as words. Longest first.
// Also for Piper (espeak-ng reads "6,0" as "zes komma nul" and "€8,67" badly).
const SAY = {
  // 1.167 is "elfhonderdzevenenzestig" (espeak-ng says "duizend honderd zevenenzestig")
  nl: [[/\b([1-9])\.([1-9])(\d\d)\b/g, (m, a, b, cd) => `${a}${b}honderd${cd === '00' ? '' : ` ${Number(cd)}`}`],
    [/omw\/min/g, 'omwentelingen per minuut'], [/\bmm\/min\b/g, 'millimeter per minuut'], [/\bm\/min\b/g, 'meter per minuut'], [/µm\b/g, 'micrometer'], [/\brpm\b/g, 'omwentelingen per minuut'],
    [/€\s?(\d[\d.]*(?:,\d+)?)/g, '$1 euro'], [/(\d),0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimeter'], [/(\d)\s?min\b/g, '$1 minuten'], [/(\d)\s?%/g, '$1 procent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' maal '], [/\s\/\s/g, ' gedeeld door '], [/\s=\s/g, ' is '], [/°/g, ' graden'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    // acronym pairs (MIG/MAG, IQ/OQ/PQ) without the slash, t8/5, and a standard's number in parts
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 deel $3'],
    // the weld standards as said on the floor (ISO 58 17, not "vijfduizend..."), the execution
    // classes as letters, and the ISO 6520-1 code 401 digit by digit; only these, so ISO 9001 stays
    [/\bISO (5817|9712)\b/g, (m, n) => `ISO ${n.slice(0, 2)} ${n.slice(2)}`], [/\bEXC([1-4])\b/g, 'E X C $1'], [/\b401\b/g, 'vier nul één'],
    // MIG, MAG and TIG on their own as letters, like MAG-lassen (espeak-ng reads MAG as the verb "mag")
    [/\b(MIG|MAG|TIG)\b(?!-)/g, (m) => m.split('').join(' ')]],
  en: [[/\brpm\b/g, 'revolutions per minute'], [/\bmm\/min\b/g, 'millimetres per minute'], [/\bm\/min\b/g, 'metres per minute'], [/µm\b/g, 'micrometres'],
    [/€\s?(\d[\d,]*(?:\.\d+)?)/g, '$1 euros'], [/(\d)\.0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimetres'], [/(\d)\s?min\b/g, '$1 minutes'], [/(\d)\s?%/g, '$1 percent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' times '], [/\s\/\s/g, ' divided by '], [/\s=\s/g, ' is '], [/°/g, ' degrees'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 part $3'],
    [/\bISO (5817|9712)\b/g, (m, n) => `ISO ${n.slice(0, 2)} ${n.slice(2)}`], [/\bEXC([1-4])\b/g, 'E X C $1'], [/\b401\b/g, 'four oh one']],
};
const sayable = (text, lang) => (SAY[lang] || []).reduce((s, [re, w]) => s.replace(re, w), text);
// The words the voice says: no English gloss, and with a language, units as words.
const speakOf = (seg, lang) => sayable(seg.map((p) => (typeof p === 'string' ? p : p.t)).join(''), lang).replace(/\s+/g, ' ').trim();
// What is said, as written (no gloss, units kept): the subtitles of the video.
const saidOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t)).join('').replace(/\s+/g, ' ').trim();

// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each phrase (up to
// a comma) and sentence is recorded as its own clip (films/_kit/narrate.mjs):
// comma after a phrase, sentence after a full stop, beat between two lines.
const PAUSES = { comma: 0.2, sentence: 0.55, beat: 0.9 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: 0.8, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
