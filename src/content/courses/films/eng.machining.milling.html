de draaiassen vast, en freest gewoon met X, Y en Z. Zo blijft de machine stijf."],"en":["In ",{"t":"3+2 machining","k":"eng.machining.fiveaxis#1"}," it tilts the part to a fixed angle, locks the rotary axes, and simply mills with X, Y and Z. That keeps the machine stiff."]},"voice":{"nl":"Bij 3 plus 2-bewerking kantelt hij het werkstuk naar een vaste hoek, zet de draaiassen vast, en freest gewoon met X, Y en Z. Zo blijft de machine stijf.","en":"In 3 plus 2 machining it tilts the part to a fixed angle, locks the rotary axes, and simply mills with X, Y and Z. That keeps the machine stiff."}},{"seg":{"nl":["Van ","4"," naar ","1"," opspanning: per serie ","3"," × ","30"," = ","90"," minuten minder ombouwen."],"en":["From ","4"," setups to ","1",": per batch ","3"," × ","30"," = ","90"," minutes less changeover."]},"text":{"nl":"Van 4 naar 1 opspanning: per serie 3 × 30 = 90 minuten minder ombouwen.","en":"From 4 setups to 1: per batch 3 × 30 = 90 minutes less changeover."},"speak":{"nl":"Van 4 naar 1 opspanning: per serie 3 maal 30 is 90 minuten minder ombouwen.","en":"From 4 setups to 1: per batch 3 times 30 is 90 minutes less changeover."},"cues":[],"read":{"nl":"4 → 1 opspanning · 3 × 30 = 90 min","en":"4 → 1 setup · 3 × 30 = 90 min"},"say":{"nl":["Van ","4"," opspanningen naar ","1",". Elke opspanning die wegvalt, scheelt zo’n ","30"," minuten ombouwen: ","90"," minuten per serie."],"en":["From ","4"," setups to ","1",". Each setup that goes saves about ","30"," minutes of changeover: ","90"," minutes per batch."]},"voice":{"nl":"Van 4 opspanningen naar 1. Elke opspanning die wegvalt, scheelt zo'n 30 minuten ombouwen: 90 minuten per serie.","en":"From 4 setups to 1. Each setup that goes saves about 30 minutes of changeover: 90 minutes per batch."}},{"seg":{"nl":[{"t":"Simultaan vijfassig","c":"simul","k":"eng.machining.fiveaxis#2","en":"simultaneous 5-axis"},": alles beweegt tegelijk, de frees houdt zijn hoek op het bolle vlak."],"en":[{"t":"Simultaneous 5-axis","c":"simul","k":"eng.machining.fiveaxis#2"},": the axes move at once, the cutter keeps its angle to the domed face."]},"text":{"nl":"Simultaan vijfassig (simultaneous 5-axis): alles beweegt tegelijk, de frees houdt zijn hoek op het bolle vlak.","en":"Simultaneous 5-axis: the axes move at once, the cutter keeps its angle to the domed face."},"speak":{"nl":"Simultaan vijfassig: alles beweegt tegelijk, de frees houdt zijn hoek op het bolle vlak.","en":"Simultaneous 5-axis: the axes move at once, the cutter keeps its angle to the domed face."},"cues":["simul"],"say":{"nl":["Bij ",{"t":"simultaan vijfassig","k":"eng.machining.fiveaxis#2","en":"simultaneous 5-axis"}," bewegen alle assen tegelijk. Zo houdt de frees steeds dezelfde stand op het bolle vlak, zoals bij de schoepen van een pompwaaier."],"en":["In ",{"t":"simultaneous 5-axis","k":"eng.machining.fiveaxis#2"}," machining, all axes move at once. That keeps the cutter at a steady angle to the domed face, as on the vanes of a pump impeller."]},"voice":{"nl":"Bij simultaan vijfassig bewegen alle assen tegelijk. Zo houdt de frees steeds dezelfde stand op het bolle vlak, zoals bij de schoepen van een pompwaaier.","en":"In simultaneous 5-axis machining, all axes move at once. That keeps the cutter at a steady angle to the domed face, as on the vanes of a pump impeller."}}],"terms":[{"lesson":"eng.machining.fiveaxis","index":0,"nl":"Draai-kanteltafel","en":"Trunnion table","cue":"trunnion"},{"lesson":"eng.machining.fiveaxis","index":1,"nl":"3+2-bewerking","en":"3+2 machining","cue":"lock"},{"lesson":"eng.machining.fiveaxis","index":2,"nl":"Simultaan vijfassig","en":"Simultaneous 5-axis","cue":"simul"}]}],"skip":[],"numbers":[{"lesson":"eng.machining.mill","value":"100","scene":"s1"},{"lesson":"eng.machining.mill","value":"80","scene":"s1"},{"lesson":"eng.machining.mill","value":"25","scene":"s1"},{"lesson":"eng.machining.mill","value":"1","scene":"s2"},{"lesson":"eng.machining.mill","value":"10","scene":"s3"},{"lesson":"eng.machining.mill","value":"60","scene":"s3"},{"lesson":"eng.machining.mill","value":"40","scene":"s3"},{"lesson":"eng.machining.mill","value":"8","scene":"s3"},{"lesson":"eng.machining.mill","value":"4","scene":"s3"},{"lesson":"eng.machining.millfeeds","value":"12","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"3","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"150","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"3.980","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"150.000","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"0,05","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"597","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"17,9","scene":"s4"},{"lesson":"eng.machining.millfeeds","value":"1.000","scene":"s4"},{"lesson":"eng.machining.millstrategy","value":"0,6","scene":"s6"},{"lesson":"eng.machining.millstrategy","value":"0,083","scene":"s6"},{"lesson":"eng.machining.millstrategy","value":"1.200","scene":"s6"},{"lesson":"eng.machining.millstrategy","value":"2.000","scene":"s6"},{"lesson":"eng.machining.millstrategy","value":"5","scene":"s6"},{"lesson":"eng.machining.millstrategy","value":"15","scene":"s6"},{"lesson":"eng.machining.fiveaxis","value":"30","scene":"s7"},{"lesson":"eng.machining.fiveaxis","value":"90","scene":"s7"}],"label":{"nl":"Een verticaal bewerkingscentrum: een kolom met gereedschapsmagazijn, een spilkop met frees, en een tafel met een bankschroef en een aluminium blok. Later een draai-kanteltafel die een werkstuk met een bolle bovenkant kantelt en draait.","en":"A vertical machining centre: a column with a tool magazine, a spindle head with a cutter, and a table with a vice and an aluminium block. Later a trunnion table that tilts and turns a part with a domed top."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;

// A scene lasts at least (caption words / 2.5) + 2 s, so it can be read.
const minSceneDur = (words) => words / 2.5 + 2;

// "De {t:Snijsnelheid} is {n:220} m/min" → text, term and number pieces.
// {t:Term|shown} names lesson term Term but shows "shown" (another form).
function parseMarked(src) {
  const out = [];
  const re = /\{([a-z]):([^{}]*)\}/g;
  let last = 0;
  let m;
  const plain = (s) => {
    if (/[{}]/.test(s)) throw new Error(`bad marker in "${src}"`);
    if (s) out.push({ text: s });
  };
  while ((m = re.exec(src))) {
    plain(src.slice(last, m.index));
    if (m[1] === 't') {
      const [term, shown] = m[2].split('|');
      out.push({ term: term.trim(), shown: (shown ?? term).trim() });
    } else if (m[1] === 'n') out.push({ num: m[2].trim() });
    else throw new Error(`bad marker {${m[1]}:} in "${src}"`);
    last = re.lastIndex;
  }
  plain(src.slice(last));
  return out;
}

// "1167" → 1.167 (nl) or 1,167 (en); "0.3" → 0,3 or 0.3. Decimals as written.
function formatNumber(raw, lang) {
  const s = String(raw);
  if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error(`not a plain number: ${s}`);
  const [int, dec] = s.split('.');
  const group = lang === 'en' ? ',' : '.';
  const point = lang === 'en' ? '.' : ',';
  const body = int.replace(/^-/, '');
  const grouped = body.length >= 4 ? body.replace(/\B(?=(\d{3})+(?!\d))/g, group) : body;
  return (int.startsWith('-') ? '-' : '') + grouped + (dec !== undefined ? point + dec : '');
}

// A resolved caption is a list of strings and term pieces {t, en?, c}. In Dutch
// a term carries its English word (en) on first use only.
const plainOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t + (p.en ? ` (${p.en})` : ''))).join('');
// Units and signs a voice would spell out or skip, said as words. Longest first.
// Also for Piper (espeak-ng reads "6,0" as "zes komma nul" and "€8,67" badly).
const SAY = {
  // 1.167 is "elfhonderdzevenenzestig" (espeak-ng says "duizend honderd zevenenzestig")
  nl: [[/\b([1-9])\.([1-9])(\d\d)\b/g, (m, a, b, cd) => `${a}${b}honderd${cd === '00' ? '' : ` ${Number(cd)}`}`],
    [/omw\/min/g, 'omwentelingen per minuut'], [/\bmm\/min\b/g, 'millimeter per minuut'], [/\bm\/min\b/g, 'meter per minuut'], [/µm\b/g, 'micrometer'], [/\brpm\b/g, 'omwentelingen per minuut'],
    [/€\s?(\d[\d.]*(?:,\d+)?)/g, '$1 euro'], [/(\d),0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimeter'], [/(\d)\s?min\b/g, '$1 minuten'], [/(\d)\s?%/g, '$1 procent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' maal '], [/\s\/\s/g, ' gedeeld door '], [/\s=\s/g, ' is '], [/°/g, ' graden'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    // acronym pairs (MIG/MAG, IQ/OQ/PQ) without the slash, t8/5, and a standard's number in parts
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 deel $3'],
    // MIG, MAG and TIG on their own as letters, like MAG-lassen (espeak-ng reads MAG as the verb "mag")
    [/\b(MIG|MAG|TIG)\b(?!-)/g, (m) => m.split('').join(' ')]],
  en: [[/\brpm\b/g, 'revolutions per minute'], [/\bmm\/min\b/g, 'millimetres per minute'], [/\bm\/min\b/g, 'metres per minute'], [/µm\b/g, 'micrometres'],
    [/€\s?(\d[\d,]*(?:\.\d+)?)/g, '$1 euros'], [/(\d)\.0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimetres'], [/(\d)\s?min\b/g, '$1 minutes'], [/(\d)\s?%/g, '$1 percent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' times '], [/\s\/\s/g, ' divided by '], [/\s=\s/g, ' is '], [/°/g, ' degrees'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 part $3']],
};
const sayable = (text, lang) => (SAY[lang] || []).reduce((s, [re, w]) => s.replace(re, w), text);
// The words the voice says: no English gloss, and with a language, units as words.
const speakOf = (seg, lang) => sayable(seg.map((p) => (typeof p === 'string' ? p : p.t)).join(''), lang).replace(/\s+/g, ' ').trim();
// What is said, as written (no gloss, units kept): the subtitles of the video.
const saidOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t)).join('').replace(/\s+/g, ' ').trim();

// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each phrase (up to
// a comma) and sentence is recorded as its own clip (films/_kit/narrate.mjs):
// comma after a phrase, sentence after a full stop, beat between two lines.
const PAUSES = { comma: 0.2, sentence: 0.55, beat: 0.9 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: 0.8, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
      return b;
    });
    t = round3(at + (si + 1 < durs.length ? g.hold : g.tail));
    scenes.push({ start: round3(start), dur: round3(t - start), beats: out });
  });
  return { scenes, total: t };
}
const round3 = (x) => Math.round(x * 1000) / 1000;

// Where time t falls on an audio timeline: the scene, the beat on screen (the
// last one started; the first while the scene opens) and the scene's progress u.
function timedAt(t, atl) {
  const sc = atl.scenes;
  let si = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) si = k;
  const s = sc[si];
  let bi = 0;
  for (let k = 0; k < s.beats.length; k++) if (t >= s.beats[k].start) bi = k;
  const u = Math.min(1, Math.max(0, (t - s.start) / s.dur));
  return { si, bi, u };
}

function timelineOf(scenes) {
  const starts = [];
  let t = 0;
  for (const s of scenes) { starts.push(t); t += s.dur; }
  return { starts, total: t };
}

function sceneIndexAt(t, tl) {
  let i = 0;
  for (let k = 0; k < tl.starts.length; k++) if (t >= tl.starts[k]) i = k;
  return i;
}

// ?scene=n is 1-based; anything odd opens the first scene.
function clampScene(param, count) {
  const n = parseInt(param, 10);
  if (!Number.isFinite(n) || n < 1) return 0;
  return Math.min(count, n) - 1;
}

// Beat starts within a scene (seconds), by each beat's share of the words.
function beatStarts(scene, lang) {
  const counts = scene.beats.map((b) => Math.max(1, wordsOf(b.text[lang] ?? b.text.nl)));
  const all = counts.reduce((a, b) => a + b, 0);
  const out = [];
  let acc = 0;
  for (const c of counts) { out.push(Math.round((acc / all) * scene.dur * 100) / 100); acc += c; }
  return out;
}

function beatIndexAt(scene, lang, local) {
  const starts = beatStarts(scene, lang);
  let i = 0;
  for (let k = 0; k < starts.length; k++) if (local >= starts[k]) i = k;
  return i;
}

// While a beat is being spoken the clock may run up to the next beat, or to the
// end of the scene for the last beat, and then holds there.
function holdLimit(tl, scenes, lang, sceneIndex, beatIndex) {
  const scene = scenes[sceneIndex];
  const starts = beatStarts(scene, lang);
  const local = beatIndex + 1 < starts.length ? starts[beatIndex + 1] : scene.dur;
  return tl.starts[sceneIndex] + local;
}

// The page's parameters: from its URL when opened on its own, else from the
// frame's name. The app hands the page over as srcdoc (a sandboxed frame's own
// navigation skips the service worker, so a src would be blank offline) and

  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;

    if (opts.nominal) out.push(`<path class="fp-mark" d="M${nominal.map(([u, v]) => f2(u) + ' ' + f2(v)).join('L')}"/>`);
    // feed marks on the new face: one per tooth bite, fz apart (spacing exaggerated)
    if (opts.marks) {
      const step = fz * scale * 1.2;
      const ticks = [];
      for (let u = 0; Math.abs(u) < 44; u -= dir * step) ticks.push(`M${f2(u)} ${f2(done)}v4`);
      out.push(`<path class="iso-line" data-tone="lo" d="${ticks.join('')}"/>`);
      const u0 = -dir * step * 3;
      const u1 = u0 - dir * step;
      out.push(mark(`M${f2(u0)} ${f2(done + 8)}v4M${f2(u1)} ${f2(done + 8)}v4M${f2(u0)} ${f2(done + 10)}H${f2(u1)}`));
      out.push(`<text class="fp-ink fp-label" x="${f2((u0 + u1) / 2)}" y="${f2(done + 24)}" font-size="11" text-anchor="middle">fz</text>`);
    }
    // the cutter and its teeth, turning clockwise seen from above (v down: angle grows)
    out.push(`<circle class="fm-tool" cx="0" cy="${f2(cy)}" r="${R}"/>`);
    const teethD = [];
    for (let i = 0; i < teeth; i++) {
      const t = phase + (i / teeth) * TAU;
      teethD.push(`M${f2(Math.cos(t) * (R - 7))} ${f2(cy + Math.sin(t) * (R - 7))}L${f2(Math.cos(t) * R)} ${f2(cy + Math.sin(t) * R)}`);
    }
    out.push(`<path class="iso-line" data-tone="hi" d="${teethD.join('')}"/>`);
    out.push(`<circle class="fm-dot" cx="0" cy="${f2(cy)}" r="2.6"/>`);
    // the rotation (a short arc with a head) and the travel (a track ending on a dot)
    const ra = [];
    for (let i = 0; i <= 10; i++) { const t = -2.2 + (i / 10) * 1.2; ra.push([Math.cos(t) * (R + 8), cy + Math.sin(t) * (R + 8)]); }
    out.push(`<path class="fp-mark" d="M${ra.map(([u, v]) => f2(u) + ' ' + f2(v)).join('L')}"/><path class="fp-mark" d="${arrowHead(ra[8], ra[10], 5, true)}"/>`);
    out.push(`<path class="fp-mark" d="M0 ${f2(cy)}h${f2(dir * 15)}"/><path class="fp-mark" d="${arrowHead([0, cy], [dir * 15, cy], 4, true)}"/>`);
    return out.join('');
  }
  function loupeIn(key, [cx, cy], inner) {
    const sc = C.LR / 46;
    set(E[key + 'In'], `<g transform="translate(${cx} ${cy}) scale(${sc.toFixed(4)})">${inner}</g>`);
  }

  // ------------------------------------------------------------ the trunnion table (scene 7)
  // A tilts the cradle about the Y axis through the pivot (0, 0, ZA), so the
  // part's +x side rises toward the cutter; C turns the platter about the
  // cradle's own z. Everything is offset by the table position (tx, ty).
  // The part: a round insert with a domed (curved) top, a sphere of radius R
  // about (0, 0, zc) in platter coordinates. A point on the dome at polar angle
  // psi and azimuth phi has its normal straight up when C = -phi and A = psi:
  // that is how the vertical cutter stays square to the curved face.
  const add3 = G.add3;
  const mul3 = G.mul3;
  const DOME = { r: 26, s0: -19, s1: -4, R: 36 };
  DOME.zc = DOME.s1 - Math.sqrt(DOME.R * DOME.R - DOME.r * DOME.r);
  DOME.rim = Math.asin(DOME.r / DOME.R);
  const domeN = (psi, phi) => [Math.sin(psi) * Math.cos(phi), Math.sin(psi) * Math.sin(phi), Math.cos(psi)];
  const domeAt = (psi, phi, lift = 0) => { const n = domeN(psi, phi); return [n[0] * (DOME.R + lift), n[1] * (DOME.R + lift), DOME.zc + n[2] * (DOME.R + lift)]; };
  const PROFILE = [[DOME.s0, DOME.r], [DOME.s1, DOME.r]];
  for (let i = 1; i <= 10; i++) { const psi = DOME.rim * (1 - i / 10); PROFILE.push([DOME.zc + DOME.R * Math.cos(psi), Math.max(0.4, DOME.R * Math.sin(psi))]); }
  function trunFrames(tx, ty, a, c) {
    const o = [tx, ty, C.ZA];
    const ex = [Math.cos(a), 0, Math.sin(a)];
    const ez = [-Math.sin(a), 0, Math.cos(a)];
    const bx = add3(mul3(ex, Math.cos(c)), mul3(Y, Math.sin(c)));
    const by = add3(mul3(ex, -Math.sin(c)), mul3(Y, Math.cos(c)));
    const vec = (p) => add3(add3(mul3(bx, p[0]), mul3(by, p[1])), mul3(ez, p[2]));
    return { o, ex, ez, bx, by, vec, pt: (p) => add3(o, vec(p)) };
  }
  // holes: { psi, phi, r } on the dome; trail: dome points [psi, phi] in order
  function trunnionSvg(tx, ty, a, c, holes, trail) {
    const T = trunFrames(tx, ty, a, c);
    const pv = T.o;
    const Fy = G.frameOf(pv, Y, [0, 0, 1], [1, 0, 0]);
    const tower = (y0, y1) => {
      const plan = { x: -18 + tx, y: y0 + ty, w: 36, d: y1 - y0, r: 1 };
      return solidSvg(slabOf(plan, 64, C.ZA - 64, P, 3, 0.5), { tone: 'mid' })
        + solidSvg(G.disc(y0, y1, 18, Fy, P), { tone: 'mid', crease: 'lo' })
        + dotsSvg([[-15, y0 + 3], [15, y0 + 3], [-15, y1 - 3], [15, y1 - 3]].map(([x, y]) => at([x + tx, y + ty, 64])), { size: 0.42 });
    };
    const boss = (s0, s1) => solidSvg(G.disc(s0, s1, 11, Fy, P), { tone: 'hi', crease: 'lo' }) + dotsSvg(G.dotsOf(Fy, s1 > 0 ? s1 : s0, 7.5, 6, P, { least: -1 }), { size: 0.42 });
    const cheekPoly = [[-30, -36], [30, -36], [30, -10], [14, 4], [-14, 4], [-30, -10]];
    const Fc = G.frameOf(pv, Y, T.ex, T.ez);
    const cheek = (y0, y1) => solidSvg(G.prismOf(Fc, cheekPoly, y0, y1, P), { tone: 'mid', crease: 'lo' });
    const Fb = G.frameOf(pv, T.ez, T.ex, Y);
    const plate = solidSvg(G.prismOf(Fb, [[-34, -40], [34, -40], [34, 40], [-34, 40]], -36, -26, P), { tone: 'mid', crease: 'lo' });
    const Fp = G.frameOf(pv, T.ez, T.bx, T.by);
    const platter = solidSvg(G.disc(-26, -19, 30, Fp, P), { tone: 'mid', crease: 'lo' })
      + (G.dot3(T.ez, V) > 0.05 ? dotsSvg(G.dotsOf(Fp, -19, 28, 8, P, { least: -1 }), { size: 0.45 }) : '');
    const part = solidSvg(G.solidOf(PROFILE, Fp, P), { tone: 'hi', crease: 'lo', lit: true });
    // holes square to the dome, drawn when they look at us
    let marks = '';
    for (const h of holes) {
      if (h.r < 0.3) continue;
      const n = T.vec(domeN(h.psi, h.phi));
      if (G.dot3(n, V) < 0.08) continue;
      let u = add3(T.ez, mul3(n, -G.dot3(T.ez, n)));
      u = mul3(u, 1 / (Math.hypot(u[0], u[1], u[2]) || 1));
      const v = [n[1] * u[2] - n[2] * u[1], n[2] * u[0] - n[0] * u[2], n[0] * u[1] - n[1] * u[0]];
      const d = G.circleOf(G.frameOf(T.pt(domeAt(h.psi, h.phi)), n, u, v), 0, h.r, P, 28);
      marks += `<path class="fm-hole" d="${d}"/><path class="iso-line" data-tone="mid" d="${d}"/>`;
    }
    const back = [tower(-66, -52) + boss(-71, -66), cheek(-52, -40), plate, platter, part, marks];
    const front = [cheek(40, 52), tower(52, 66) + boss(66, 71)];
    // the cutter's track on the dome: only the stretches that face us
    let tr = '';
    if (trail && trail.length > 1) {
      const runs = [];
      let run = [];
      for (const [psi, phi] of trail) {
        if (G.dot3(T.vec(domeN(psi, phi)), V) > 0.02) run.push(at(T.pt(domeAt(psi, phi, 0.3))));
        else if (run.length) { if (run.length > 1) runs.push(pathOf(run)); run = []; }
      }
      if (run.length > 1) runs.push(pathOf(run));
      if (runs.length) tr = `<path class="fm-path" d="${runs.join('')}"/>`;
    }
    return { back: back.join(''), front: front.join(''), T, trail: tr };
  }

  // ------------------------------------------------------------ camera
  function camera(si, u) {
    const c = CAM[si];
    const kk = span(u, c.a ?? 0, c.b ?? 1);
    const cx = lerp(c.from[0], c.to[0], kk);
    const cy = lerp(c.from[1], c.to[1], kk);
    const w = lerp(c.from[2], c.to[2], kk);
    camW = w;
    const s = W / w;
    const t = `translate(${f1(W / 2)} ${f1(H / 2)}) scale(${s.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)})`;
    if (E.world.__t !== t) { E.world.setAttribute('transform', t); E.world.__t = t; }
  }

  // ------------------------------------------------------------ the programme of scenes 1–3 (block-local tool positions)
  const PASS = [[-20, 85, -85], [20, -85, 85]]; // face mill: v, from, to
  const STRIPS = [-15, -9, -3, 3, 9, 15]; // T2 roughing rows (Ø10), x from -25 to 25
  function roughAt(t) {
    // t in 0..1 over the zigzag; returns the tool position and the cleared area
    const n = STRIPS.length;
    const k = Math.min(n - 1, Math.floor(t * n));
    const f = t * n - k;
    const x = k % 2 === 0 ? lerp(-25, 25, f) : lerp(25, -25, f);
    return { x, y: STRIPS[k], k, f };
  }
  function roughOpen(t) {
    const { x, y, k } = roughAt(t);
    const right = k % 2 === 0;
    const xa = right ? -30 : x - 5;
    const xb = right ? x + 5 : 30;
    if (k === 0) return [[xa, -20], [xb, -20], [xb, y + 5], [xa, y + 5]];
    const yd = y - 1; // rows before this one are cleared up to here
    return right
      ? [[-30, -20], [30, -20], [30, yd], [xb, yd], [xb, y + 5], [-30, y + 5]]
      : [[-30, -20], [30, -20], [30, y + 5], [xa, y + 5], [xa, yd], [-30, yd]];
  }
  const CONTOUR = (() => {
    // T3's centre path: the pocket outline offset by its radius 4, start mid front
    const r = 4;
    const pts = [[0, C.PD - r], [-(C.PW - r), C.PD - r], [-(C.PW - r), -(C.PD - r)], [C.PW - r, -(C.PD - r)], [C.PW - r, C.PD - r], [0, C.PD - r]];
    const len = [];
    let tot = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); len.push(l); tot += l; }
    return { pts, len, tot };
  })();
  function contourAt(t) {
    let d = clamp(t, 0, 1) * CONTOUR.tot;
    for (let i = 0; i < CONTOUR.len.length; i++) {
      if (d <= CONTOUR.len[i]) { const a = CONTOUR.pts[i]; const b = CONTOUR.pts[i + 1]; const f = d / CONTOUR.len[i]; return { p: [lerp(a[0], b[0], f), lerp(a[1], b[1], f)], i }; }
      d -= CONTOUR.len[i];
    }
    return { p: CONTOUR.pts[CONTOUR.pts.length - 1], i: CONTOUR.len.length - 1 };
  }
  // the wall the cutter leaves: the pocket outline, traced as far as the cutter got
  function contourTrace(t) {
    const out = [];
    const ring = roundRect(-C.PW, C.PW, -C.PD, C.PD, 4, 6);
    // start at the middle of the front wall and run the same way as the cutter
    const start = ring.findIndex(([x, y]) => y > C.PD - 0.01 && x <= 0);
    const ordered = ring.slice(start).concat(ring.slice(0, start + 1));
    const m = Math.max(2, Math.round(ordered.length * clamp(t, 0, 1)));
    for (let i = 0; i < Math.min(m, ordered.length); i++) out.push(ordered[i]);
    return out;
  }

  // ------------------------------------------------------------ render
  let shown = -1;
  const ALL = ['viceB', 'viceF', 'block', 'pocket', 'trunB', 'trunF', 'contour', 'troch', 'ae', 'q', 'vf', 'lock', 'simul', 'lp1', 'lp2', 'chips', 'tool'];
  const VIS = [
    ['viceB', 'viceF', 'block', 'tool'],
    ['viceB', 'viceF', 'block', 'tool', 'chips'],
    ['viceB', 'viceF', 'block', 'pocket', 'tool', 'chips', 'contour'],
    ['viceB', 'viceF', 'block', 'tool', 'chips', 'ae', 'q', 'vf', 'lp1'],
    ['viceB', 'viceF', 'block', 'tool', 'chips', 'lp1', 'lp2'],
    ['viceB', 'viceF', 'block', 'pocket', 'tool', 'chips', 'troch', 'lp1'],
    ['trunB', 'trunF', 'tool', 'lock', 'simul'],
  ];

  // where each loupe sits and how big it is, per scene (HUD units: centre x, y, radius)
  const LP = [null, null, null, { lp1: [536, 296, 102] }, { lp1: [522, 282, 112], lp2: [118, 282, 112] }, { lp1: [536, 296, 102] }, null];
  const EN = document.documentElement.lang === 'en';
  const LPLAB = { lp1: EN ? 'climb' : 'meelopend', lp2: EN ? 'conventional' : 'tegenlopend' };
  function placeLoupes(si) {
    for (const key of ['lp1', 'lp2']) {
      const spot = LP[si] && LP[si][key];
      if (!spot) continue;
      const [x0, y0] = key === 'lp1' ? C.L1 : C.L2;
      const sc = spot[2] / C.LR;
      E[key].setAttribute('transform', `translate(${spot[0]} ${spot[1]}) scale(${sc.toFixed(4)}) translate(${-x0} ${-y0})`);
      set(E[key + 'Lab'], si === 4 ? `<text class="fp-ink fp-label" x="${x0}" y="${y0 - C.LR - 9}" font-size="15" text-anchor="middle">${LPLAB[key]}</text>` : '');
    }
  }

  function render(si, u) {
    if (si !== shown) {
      shown = si;
      for (const k of ALL) show(E[k], VIS[si].includes(k));
      placeLoupes(si);
    }
    camera(si, u);
    const clockS = u * C.dur[si];
    let tx = 0;
    let ty = 0;
    let tool = 'end10';
    let zTip = TOP + 40;
    let toolOn = 1;
    let phase = clockS * 7;
    let clip = null;
    let chips = '';
    let magTurn = 0;
    let blk = '';
    let pocket = '';

    if (si === 0) {
      // the block comes in; the magazine indexes; T1 goes into the spindle and comes down
      magTurn = span(u, 0.2, 0.5) * (TAU / 16) * 3;
      tool = 'face';
      toolOn = span(u, 0.5, 0.6);
      zTip = lerp(TOP + 80, TOP + 18, span(u, 0.62, 0.95));
      const m = span(u, 0.08, 0.9);
      tx = lerp(0, -PASS[0][1], m);
      ty = lerp(30, -PASS[0][0], m);
      phase = clockS * 4 * span(u, 0.6, 0.8);
      blk = blockSvg(tx, ty, null);
    } else if (si === 1) {
      tool = 'face';
      const p1 = span(u, 0.1, 0.47);
      const sw = span(u, 0.47, 0.55);
      const p2 = span(u, 0.55, 0.92);
      const x = p2 > 0 ? lerp(PASS[1][1], PASS[1][2], p2) : lerp(PASS[0][1], PASS[0][2], p1);
      const v = lerp(PASS[0][0], PASS[1][0], sw);
      tx = -x;
      ty = -v;
      zTip = lerp(TOP + 18, TOP, span(u, 0, 0.08)) + 18 * span(u, 0.94, 1);
      phase = clockS * 5;
      const passes = [[PASS[0][0], PASS[0][1], lerp(PASS[0][1], PASS[0][2], p1)]];
      if (p2 > 0) passes.push([PASS[1][0], PASS[1][1], lerp(PASS[1][1], PASS[1][2], p2)]);
      blk = blockSvg(tx, ty, null) + facedSvg(tx, ty, passes);
      if ((p1 > 0 && p1 < 1) || (p2 > 0 && p2 < 1)) {
        const inBlock = Math.abs(x) < BX + C.FACE_R - 4;
        if (inBlock) chips = chipsSvg([0, 22, TOP + 1], [0.4, 1], clockS, 6, 2.2);
      }
    } else if (si === 2) {
      // T2 roughs the pocket (zigzag); T3 runs the contour
      const ch1 = span(u, 0, 0.1);
      const rough = span(u, 0.12, 0.58);
      const ch2 = span(u, 0.6, 0.68);
      const cont = span(u, 0.7, 0.97);
      let p = [-25, -15];
      let open = null;
      if (u < 0.6) {
        tool = 'end10';
        toolOn = u < 0.05 ? span(u, 0, 0.05) : 1;
        const r = roughAt(rough);
        p = [r.x, r.y];
        zTip = rough > 0 ? TOP - C.PDEPTH : lerp(TOP + 30, TOP + 2, ch1);
        if (u > 0.58) zTip = TOP - C.PDEPTH + 40 * span(u, 0.58, 0.6);
        if (rough > 0) open = roughOpen(rough);
      } else {
        tool = 'end8';
        toolOn = span(u, 0.61, 0.66);
        const c = contourAt(cont);
        p = cont > 0 ? c.p : [0, C.PD - 4];
        zTip = cont > 0 ? TOP - C.PDEPTH : lerp(TOP + 40, TOP - C.PDEPTH, span(ch2, 0.4, 1));
        if (u > 0.975) zTip = TOP - C.PDEPTH + 30 * span(u, 0.975, 1);
        open = roundRect(-C.PW, C.PW, -C.PD, C.PD, cont > 0.98 ? 4 : 5);
      }
      tx = -p[0];
      ty = -p[1];
      blk = blockSvg(tx, ty, null) + facedSvg(tx, ty, PASS.map(([v, a, b]) => [v, a, b]));
      if (open) {
        pocket = recessSvg(tx, ty, [-C.PW, C.PW, -C.PD, C.PD], C.PDEPTH, open, 'fm-pk');
        clip = { z: TOP, d: poly(open.map(([x, y]) => at([x + tx, y + ty, TOP]))) };
      }
      // the contour: the finished wall traced petrol behind T3
      if (u >= 0.6) {
        const tr = contourTrace(cont);
        set(E.contour, tr.length > 1 ? `<path class="fm-path" d="${pathOf(tr.map(([x, y]) => at([x + tx, y + ty, TOP])))}"/>` : '');
      } else set(E.contour, '');
      const cutting = (u > 0.12 && u < 0.58) || (u > 0.7 && u < 0.97);
      if (cutting) chips = chipsSvg([0, 0, TOP], [0.3, 1], clockS, 5, 1.8);
    } else if (si === 3 || si === 4) {
      // a step along the front face, ae 3, ap 10, the Ø12 cutter in climb
      tool = 'end12';
      const ap = 10;
      const ae = 3;
      const yb = BY - ae;
      const yc = BY + 6 - ae;
      const t = span(u, 0.04, 0.96);
      const x = lerp(-BX - 14, BX - 6, t);
      tx = -x;
      ty = -yc;
      zTip = lerp(TOP + 14, TOP - ap, span(u, 0, 0.04));
      phase = clockS * 6;
      blk = blockSvg(tx, ty, { rx1: x, yb, ap });
      if (x > -BX - 6) chips = chipsSvg([-4, -4, TOP - 4], [-0.2, 1], clockS, 6, 2);
      if (si === 3) {
        // ae: the band ahead of the cutter; Q: the band it has removed; vf: the table's travel
        const xa = Math.max(x, -BX) + 8;
        const a0 = at([BX + tx, yb + ty, TOP]);
        const a1 = at([Math.min(xa, BX) + tx, yb + ty, TOP]);
        const b0 = at([BX + tx, BY + ty, TOP]);
        const b1 = at([Math.min(xa, BX) + tx, BY + ty, TOP]);
        const lp = at([Math.min(xa + 18, BX - 6) + tx, BY + ty + 12, TOP + 2]);
        set(E.ae, xa < BX - 2 ? mark(pathOf([a0, a1]) + pathOf([b0, b1]) + pathOf([a0, b0])) + label(lp[0], lp[1], 'ae', 20, 'middle') : '');
        const q1 = Math.min(Math.max(x, -BX), BX);
        const Q = [[-BX, yb, TOP], [q1, yb, TOP], [q1, BY, TOP], [-BX, BY, TOP]];
        const Qb = Q.map(([qx, qy]) => [qx, qy, TOP - ap]);
        const Wq = (p) => at([p[0] + tx, p[1] + ty, p[2]]);
        const ql = Wq([(q1 - BX) / 2, BY + 4, TOP + 14]);
        set(E.q, q1 + BX > 2 ? mark(poly(Q.map(Wq)) + pathOf([Wq(Q[3]), Wq(Qb[3]), Wq(Qb[2]), Wq(Q[2])]) + pathOf([Wq(Qb[2]), Wq(Qb[1]), Wq(Q[1])])) + label(ql[0], ql[1], 'Q', 22) : '');
        // the table carries the block toward −x while the cutter climbs along +x
        const v0 = at([TABLE_X0 + 60 + tx, 62 + ty, 60]);
        const v1 = at([TABLE_X0 + tx, 62 + ty, 60]);
        const vl = at([TABLE_X0 + 30 + tx, 62 + ty, 44]);
        set(E.vf, mark(pathOf([v0, v1])) + mark(arrowHead(v0, v1, 9)) + label(vl[0], vl[1], 'vf', 20));
        loupeIn('lp1', C.L1, loupeSvg(12, ae, 3, clockS * 2.4, true, 0.05, 200, { marks: true }));
      } else {
        loupeIn('lp1', C.L1, loupeSvg(12, ae * 2, 3, clockS * 2.4, true, 0.05, 200));
        loupeIn('lp2', C.L2, loupeSvg(12, ae * 2, 3, clockS * 2.4, false, 0.05, 200));
      }
    } else if (si === 5) {
      // beats 1–2: a light side cut, ae 1 of Ø10, and its thin chip; beat 3: a trochoidal slot
      const tr = span(u, 0.7, 0.98);
      if (u < 0.68) {
        tool = 'end10';
        const yb = BY - 1;
        const x = lerp(-BX - 12, BX - 10, span(u, 0.03, 0.66));
        tx = -x;
        ty = -(BY + 5 - 1);
        zTip = TOP - 10;
        blk = blockSvg(tx, ty, { rx1: x, yb, ap: 10 });
        if (x > -BX - 5) chips = chipsSvg([-4, -4, TOP - 4], [-0.2, 1], clockS, 6, 1.6);
        set(E.troch, '');
        set(E.pocket, '');
      } else {
        tool = 'end10';
        const depth = 18;
        // the step per loop is the width of cut: 26 mm in 20 loops = 1,3 mm,
        // 13 % of the Ø10 (the lesson: 5 to 15 %)
        const xs = 31;
        const xe = 5;
        const loops = 20;
        const rr = 3.5;

  range.addEventListener('input', () => { jump(Number(range.value)); if (playing) kick(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return; // the scrubber's own keys
    if (e.key === ' ' || e.key === 'k') { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') return; toggle(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  // pause when the film leaves the screen or the tab is hidden
  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  // tell the app how tall the film is, so its frame fits without scrolling
  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    // the frame is the video: no poster, controls or speech; time from the script
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          STAGE.render(at.si, at.u);
          caption(at.si, at.bi);
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        // the cue's glow breathes with the film's own clock, not the wall clock
        main.style.setProperty('--fp-b', `${(2.5 * (0.5 - 0.5 * Math.cos((2 * Math.PI * time) / 1.8))).toFixed(2)}px`);
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
