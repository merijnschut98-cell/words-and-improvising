nl":"Past het deel, dan klopt de positie. Snel, en moeilijk fout te doen.","en":"If the part fits, the position is good. Quick, and hard to get wrong."}}],"terms":[{"lesson":"eng.machining.holequality","index":2,"nl":"Haaksheid","en":"Perpendicularity","cue":"perp"},{"lesson":"eng.machining.holequality","index":3,"nl":"Functioneel kaliber","en":"Functional gauge","cue":"gauge"}]}],"skip":[],"numbers":[{"lesson":"eng.machining.drill","value":"8","scene":"s1"},{"lesson":"eng.machining.drill","value":"25","scene":"s1"},{"lesson":"eng.machining.drill","value":"995","scene":"s1"},{"lesson":"eng.machining.drill","value":"0,15","scene":"s1"},{"lesson":"eng.machining.drill","value":"118","scene":"s2"},{"lesson":"eng.machining.drill","value":"20","scene":"s2"},{"lesson":"eng.machining.holes","value":"10","scene":"s3"},{"lesson":"eng.machining.holes","value":"9,8","scene":"s3"},{"lesson":"eng.machining.holes","value":"0,2","scene":"s3"},{"lesson":"eng.machining.holes","value":"10,000","scene":"s3"},{"lesson":"eng.machining.holes","value":"10,015","scene":"s3"},{"lesson":"eng.machining.holes","value":"6,8","scene":"s4"},{"lesson":"eng.machining.holes","value":"1,25","scene":"s4"},{"lesson":"eng.machining.holes","value":"40","scene":"s4"},{"lesson":"eng.machining.holes","value":"0","scene":"s4"},{"lesson":"eng.machining.holes","value":"0,025","scene":"s4"},{"lesson":"eng.machining.deephole","value":"6","scene":"s5"},{"lesson":"eng.machining.deephole","value":"90","scene":"s5"},{"lesson":"eng.machining.deephole","value":"15","scene":"s5"},{"lesson":"eng.machining.deephole","value":"3","scene":"s5"},{"lesson":"eng.machining.deephole","value":"5","scene":"s5"},{"lesson":"eng.machining.deephole","value":"54","scene":"s5"},{"lesson":"eng.machining.deephole","value":"30","scene":"s5"},{"lesson":"eng.machining.deephole","value":"84","scene":"s5"},{"lesson":"eng.machining.deephole","value":"13,5","scene":"s5"},{"lesson":"eng.machining.deephole","value":"10.000","scene":"s5"},{"lesson":"eng.machining.deephole","value":"196","scene":"s5"},{"lesson":"eng.machining.holequality","value":"0,1","scene":"s7"},{"lesson":"eng.machining.holequality","value":"0,024","scene":"s7"},{"lesson":"eng.machining.holequality","value":"0,032","scene":"s7"},{"lesson":"eng.machining.holequality","value":"0,04","scene":"s7"},{"lesson":"eng.machining.holequality","value":"2","scene":"s7"},{"lesson":"eng.machining.holequality","value":"0,08","scene":"s7"},{"lesson":"eng.machining.holequality","value":"0,05","scene":"s8"}],"label":{"nl":"Een horizontale booreenheid op een machinebed boort in een stalen blok in een machineklem. Het blok is doorgesneden langs de as van het gat, zodat het gat en het gereedschap te zien zijn: een spiraalboor, een centreerboor, een ruimer met een pen, een tap, een kotterkop en een kanonboor. Daarna een meetmachine (CMM) met een taster boven een deksel met vier gaten, en een functioneel kaliber met pennen.","en":"A horizontal drilling unit on a machine bed drills into a steel block held in a vice. The block is cut open along the hole’s axis, so the hole and the tool show: a twist drill, a centre drill, a reamer with a pin, a tap, a boring head and a gun drill. Then a measuring machine (CMM) with a probe above a cover with four holes, and a functional gauge with pins."}}</script><script>document.querySelector('.fp-again span').textContent=new URLSearchParams((location.search.length>1?location.search:(window.name.charAt(0)==="?"?window.name:""))).get('lang')==='en'?'Watch again':'Nog een keer';</script><script type="module">// Pure parts of the film player: caption markers, number formats, the speak
// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.
// The part between the build-only markers (caption markers, numbers, the SAY
// table and the speak variants) runs only at build time: the page's film data
// already carries the resolved captions and voice/speak strings, so the page
// inlines everything except that part (runtimeTimeline in films/_kit/player.mjs).
// Keep runtime code out of it, and build-only code in it.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;


// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each sentence is one
// Piper clip (films/_kit/narrate.mjs), commas inside: the voice makes its own
// comma pause and keeps the sentence melody. Piper's own edge silence is
// trimmed to about 40 ms (films/_kit/speak.py), so these are the pauses heard:
// sentence after a full stop, beat between two lines, hold at a scene's end.
// The listen guard (films/_kit/listen-guard.mjs) checks them on the render.
const PAUSES = { sentence: 0.6, beat: 0.9, hold: 0.8 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: PAUSES.hold, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
      return b;
    });
    t = round3(at + (si + 1 < durs.length ? g.hold : g.tail));
    scenes.push({ start: round3(start), dur: round3(t - start), beats: out });
  });
  return { scenes, total: t };
}
const round3 = (x) => Math.round(x * 1000) / 1000;

// Where time t falls on an audio timeline: the scene, the beat on screen (the
// last one started; the first while the scene opens) and the scene's progress u.
function timedAt(t, atl) {
  const sc = atl.scenes;
  let si = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) si = k;
  const s = sc[si];
  let bi = 0;
  for (let k = 0; k < s.beats.length; k++) if (t >= s.beats[k].start) bi = k;
  const u = Math.min(1, Math.max(0, (t - s.start) / s.dur));
  return { si, bi, u };
}

function timelineOf(scenes) {
  const starts = [];
  let t = 0;
  for (const s of scenes) { starts.push(t); t += s.dur; }
  return { starts, total: t };
}

function sceneIndexAt(t, tl) {
  let i = 0;
  for (let k = 0; k < tl.starts.length; k++) if (t >= tl.starts[k]) i = k;
  return i;
}

// ?scene=n is 1-based; anything odd opens the first scene.
function clampScene(param, count) {
  const n = parseInt(param, 10);
  if (!Number.isFinite(n) || n < 1) return 0;
  return Math.min(count, n) - 1;
}

// Beat starts within a scene (seconds), by each beat's share of the words.
function beatStarts(scene, lang) {
  const counts = scene.beats.map((b) => Math.max(1, wordsOf(b.text[lang] ?? b.text.nl)));
  const all = counts.reduce((a, b) => a + b, 0);
  const out = [];
  let acc = 0;
  for (const c of counts) { out.push(Math.round((acc / all) * scene.dur * 100) / 100); acc += c; }
  return out;
}

// The stage's u (0..1) in the HTML film. A stage drawn on the Dutch beats
// (nlBeats, set by beatwarp.js) runs, while caption beat k shows in `lang`,
// from Dutch beat k's fraction to k+1's, so English is never a beat off.
function stageU(scene, lang, local, nlBeats) {
  const u = Math.min(1, Math.max(0, local / scene.dur));
  if (!nlBeats || lang === 'nl' || !scene.beats || !scene.beats.length) return u;
  const own = beatStarts(scene, lang);
  const nl = beatStarts(scene, 'nl');
  let k = 0;
  for (let i = 0; i < own.length; i++) if (local >= own[i]) k = i;
  const a0 = own[k];
  const a1 = k + 1 < own.length ? own[k + 1] : scene.dur;
  const b0 = nl[k];
  const b1 = k + 1 < nl.length ? nl[k + 1] : scene.dur;
  const p = Math.min(1, Math.max(0, (local - a0) / Math.max(1e-6, a1 - a0)));

  const cuts = [];
  if (Math.abs(gr) > 1e-9) {
    const visibleCut = -(ga * view.a) / (gr * view.flat);
    if (visibleCut > -1 && visibleCut < 1) {
      const d = Math.acos(visibleCut);
      cuts.push(view.phi - d, view.phi + d);
    }
  }
  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }
    }
  }
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);
  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {

    return out;
  }

  // ------------------------------------------------------------ camera
  function camera(si, u) {
    const c = CAM[si];
    const k = span(u, c.a ?? 0, c.b ?? 1);
    const cx = lerp(c.from[0], c.to[0], k);
    const cy = lerp(c.from[1], c.to[1], k);
    const w = lerp(c.from[2], c.to[2], k);
    camW = w;
    const s = W / w;
    const t = `translate(${f1(W / 2)} ${f1(H / 2)}) scale(${s.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)})`;
    if (E.world.__t !== t) { E.world.setAttribute('transform', t); E.world.__t = t; }
  }

  // ------------------------------------------------------------ the scenes
  const DRILL = ['unit', 'viceB', 'block', 'viceF', 'secBack', 'tool', 'flutes', 'pin', 'secFront', 'rim', 'point', 'wander', 'chips', 'coolant'];
  const MEAS = ['cmmTable', 'legL', 'gauge', 'pinsLo', 'part', 'pinsHi', 'probe', 'legR', 'beam', 'carriage', 'mag', 'worldLabels'];
  const VIS = [DRILL, DRILL, DRILL, DRILL, DRILL, DRILL,
    ['cmmTable', 'legL', 'part', 'probe', 'legR', 'beam', 'carriage', 'mag', 'worldLabels'],
    ['cmmTable', 'gauge', 'pinsLo', 'part', 'pinsHi', 'mag', 'worldLabels']];
  const ALL = [...DRILL, ...MEAS];
  let shown = -1;

  // the state of the drilling scenes: tool, hole, extras
  function drillState(si, u) {
    const clockS = u * C.dur[si];
    const st = { tool: null, hole: { rOf: () => 0, end: BX0 }, chips: '', coolant: '', pin: '', point: '', wander: '', secAlpha: 1 };
    const spin = (rpmShown) => clockS * rpmShown;
    if (si === 0) {
      const r = 4;
      const tl = r * 0.6009;
      let kind = 'drill';
      let tip = BX0 - 14;
      let tilt = 0;
      let alpha = 1;
      let spotDepth = 0;
      let drillTip = BX0;
      if (u < 0.3) {
        tip = lerp(BX0 - 14, BX0 + 0.6, span(u, 0.04, 0.12));
        tilt = 0.03 * span(u, 0.12, 0.26);
      } else if (u < 0.38) {
        tip = lerp(BX0 + 0.6, BX0 - 14, span(u, 0.3, 0.34));
        tilt = 0.03 * (1 - span(u, 0.3, 0.33));
        alpha = 1 - span(u, 0.34, 0.37);
      } else if (u < 0.6) {
        kind = 'spot';
        alpha = span(u, 0.38, 0.41);
        spotDepth = 5 * span(u, 0.44, 0.52);
        tip = u < 0.53 ? lerp(BX0 - 14, BX0 + 5, span(u, 0.41, 0.52)) : lerp(BX0 + 5, BX0 - 14, span(u, 0.53, 0.57));
        if (u >= 0.57) alpha = 1 - span(u, 0.57, 0.6);
      } else {
        spotDepth = 5;
        alpha = span(u, 0.6, 0.63);
        drillTip = BX0 + (20 + tl) * span(u, 0.66, 0.95);
        tip = u < 0.66 ? lerp(BX0 - 14, BX0 + 2, span(u, 0.62, 0.66)) : Math.max(BX0 + 2, drillTip);
      }
      if (u >= 0.38) spotDepth = Math.max(spotDepth, u >= 0.52 ? 5 : spotDepth);
      const rr = kind === 'spot' ? 5 : r;
      st.tool = { kind, r: rr, tip, theta: spin(kind === 'spot' ? 9 : 7), tilt, alpha };
      st.hole = { rOf: maxOf(coned(BX0 + spotDepth), u >= 0.62 ? drilled(r, drillTip) : () => 0), end: Math.max(BX0 + spotDepth, u >= 0.62 ? drillTip : 0) };
      if (u > 0.68) st.chips = chipsSvg(clockS, 2.6, 2.6, (b) => b / C.dur[0] > 0.68 && b / C.dur[0] < 0.95);
      // drill wander: the meant centre line and how far the tip slid away from it
      const w = span(u, 0.12, 0.26) * (1 - span(u, 0.31, 0.34));
      if (w > 0.01) {
        const dy = Math.sin(0.03 * w) * STICK;
        const a0 = at([BX0 - 26, 0, ZC]);
        const a1 = at([BX0 + 14, 0, ZC]);
        const b0 = at([BX0 + 1, 0, ZC]);
        const b1 = at([BX0 + 1, dy, ZC]);
        st.wander = mark(fmt([a0, a1]), ' stroke-dasharray="3 3"') + mark(fmt([b0, b1]), ' style="stroke-width:2"') + `<circle class="fp-ink" cx="${f1(b1[0])}" cy="${f1(b1[1])}" r="${f2(1.1 * KS)}"/>`;
      }
    } else if (si === 1) {
      const r = 4;
      const tl = r * 0.6009;
      const deep = BX0 + 20 + tl;
      const tip = u < 0.6 ? lerp(deep, BX0 - 9, span(u, 0.02, 0.2)) : lerp(BX0 - 9, BX0 - 46, span(u, 0.6, 0.76));
      st.tool = { kind: 'drill', r, tip, theta: u < 0.2 ? spin(7) : spin(7 * 0) + 0.9, tilt: 0, alpha: 1 };
      st.hole = { rOf: maxOf(coned(BX0 + 5), drilled(r, deep)), end: deep };
      // the point angle: the two cone edges in the cut plane and an arc between them
      const on = span(u, 0.18, 0.24) * (1 - span(u, 0.6, 0.66));
      if (on > 0.01 && tip < BX0) {
        const t0 = at([tip, 0, ZC]);
        const e1 = at([tip - tl * 2.2, r * 2.2, ZC]);
        const e2 = at([tip - tl * 2.2, -r * 2.2, ZC]);
        const arc = [];
        for (let i = 0; i <= 16; i++) { const ang = Math.PI - (59 * Math.PI) / 180 + ((118 * Math.PI) / 180) * (i / 16); arc.push(at([tip + Math.cos(ang) * 6, Math.sin(ang) * 6, ZC])); }
        const lp = at([tip - 14, 0, ZC + 1]);
        st.point = `<g style="opacity:${on.toFixed(2)}">${mark(fmt([e1, t0, e2]))}${mark(fmt(arc))}${label(lp[0], lp[1], '118°', 15)}</g>`;
      }
    } else if (si === 2) {
      const tl = 4.9 * 0.6009;
      const deep = BX0 + 24 + tl;
      let tip;
      let alpha = 1;
      if (u < 0.45) tip = u < 0.1 ? lerp(BX0 - 30, BX0 + 1, span(u, 0, 0.1)) : lerp(BX0 + 1, BX0 + 22, span(u, 0.1, 0.4));
      else { tip = lerp(BX0 + 22, BX0 - 40, span(u, 0.45, 0.55)); alpha = 1 - span(u, 0.52, 0.57); }
      const reamed = u < 0.1 ? BX0 : u < 0.45 ? tip : BX0 + 22;
      st.tool = alpha > 0.01 ? { kind: 'reamer', r: 5, tip, theta: spin(3), tilt: 0, alpha } : null;
      st.hole = { rOf: (x) => (x <= reamed ? 5 : drilled(4.9, deep)(x)), end: deep };
      const pinX = lerp(BX0 - 50, BX0 + 18, span(u, 0.62, 0.9));
      if (u > 0.58) st.pin = `<g style="opacity:${span(u, 0.58, 0.62).toFixed(2)}">${pinSvg(pinX, 4.96)}</g>`;
    } else if (si === 3) {
      if (u < 0.6) {
        const r = 3.4;
        const tl = r * 0.6009;
        const deep = BX0 + 22 + tl;
        let kind = 'drill';
        let tip;
        let alpha = 1;
        let threadTo = 0;
        if (u < 0.3) {
          tip = u < 0.04 ? lerp(BX0 - 20, BX0, span(u, 0, 0.04)) : lerp(BX0, deep, span(u, 0.04, 0.24));
          if (u > 0.24) tip = lerp(deep, BX0 - 30, span(u, 0.24, 0.28));
          alpha = 1 - span(u, 0.27, 0.3);
        } else {
          kind = 'tap';
          alpha = span(u, 0.3, 0.33) * (1 - span(u, 0.56, 0.6));
          const into = u < 0.5 ? span(u, 0.34, 0.5) : 1 - span(u, 0.5, 0.58);
          tip = lerp(BX0 - 10, BX0 + 18, into);
          threadTo = u < 0.5 ? tip : BX0 + 18;
        }
        st.tool = { kind, r: kind === 'tap' ? 4 : r, tip, theta: kind === 'tap' ? (u < 0.5 ? 1 : -1) * spin(2.2) : spin(8), tilt: 0, alpha, pitch: 1.25 };
        st.hole = { rOf: u < 0.04 ? () => 0 : drilled(r, u < 0.24 ? tip : deep), end: u < 0.04 ? BX0 : u < 0.24 ? tip : deep, thread: { to: threadTo, pitch: 1.25, r: 4 } };
        st.secAlpha = 1 - span(u, 0.58, 0.6);
        if (u > 0.06 && u < 0.24) st.chips = chipsSvg(clockS, 2.6, 2.2);
      } else {
        // boring: a pre-drilled Ø30 hole is opened up to Ø40 by a boring head,
        // which then pulls back out so the step from Ø30 to Ø40 shows in the cut
        const pre = drilled(15, BX0 + 30 + 9);
        const tip = u < 0.66 ? lerp(BX0 - 30, BX0, span(u, 0.62, 0.66)) : u < 0.88 ? lerp(BX0, BX0 + 26, span(u, 0.66, 0.88)) : lerp(BX0 + 26, BX0 - 30, span(u, 0.88, 0.94));
        const bored = u < 0.88 ? Math.max(BX0, tip - 0.5) : BX0 + 25.5;
        st.secAlpha = span(u, 0.6, 0.62);
        st.tool = { kind: 'boring', r: 13, reach: 20, tip, theta: u < 0.88 ? spin(4.5) : 0, tilt: 0, alpha: span(u, 0.61, 0.64) * (1 - span(u, 0.92, 0.95)) };
        st.hole = { rOf: (x) => (x <= bored ? 20 : pre(x)), end: BX0 + 39 };
        if (u > 0.67 && u < 0.88) st.chips = chipsSvg(clockS, 2.2, 2.6);
      }
    } else if (si === 4) {
      const r = 3;
      const tl = r * 0.6009;
      const D45 = 45;
      let tip;
      let depth;
      let alpha = 1;
      let coolant = false;
      if (u < 0.6) {
        // pecking in steps of 6 mm: in, cut a step, rapid out to clear the chips, back in
        const p = span(u, 0.04, 0.58) * 0.999;
        const n = D45 / 6;
        const k = Math.floor(p * n);
        const ph = p * n - k;
        const from = k * 6;
        if (u < 0.04) { tip = lerp(BX0 - 20, BX0, span(u, 0, 0.04)); depth = 0; } else if (ph < 0.12) { tip = lerp(BX0, BX0 + from + tl, ph / 0.12); depth = from; } else if (ph < 0.62) { depth = from + 6 * ((ph - 0.12) / 0.5); tip = BX0 + depth + tl; } else if (ph < 0.82) { depth = from + 6; tip = lerp(BX0 + depth + tl, BX0 - 2, (ph - 0.62) / 0.2); } else { depth = from + 6; tip = BX0 - 2; }
        if (u >= 0.58) { depth = D45; tip = lerp(BX0 - 2, BX0 - 24, span(u, 0.58, 0.6)); alpha = 1 - span(u, 0.59, 0.6); }
        st.secAlpha = 1 - span(u, 0.58, 0.6);
        // chips burst out each time the drill pulls back
        st.chips = chipsSvg(clockS, 6, 2, (b) => { const q = span(b / C.dur[4], 0.04, 0.58) * n; const f = q - Math.floor(q); return b / C.dur[4] > 0.05 && b / C.dur[4] < 0.6 && f > 0.62 && f < 0.95; }, 1.2);
      } else {
        // the other option, in a fresh hole: a carbide drill with coolant through
        // the spindle goes the full 90 mm in one go, no pecking
        coolant = u > 0.62;
        alpha = span(u, 0.6, 0.63);
        st.secAlpha = span(u, 0.6, 0.62);
        depth = 90 * span(u, 0.66, 0.96);
        tip = u < 0.66 ? lerp(BX0 - 24, BX0, span(u, 0.62, 0.66)) : BX0 + depth + tl;
        if (u > 0.66) st.chips = chipsSvg(clockS, 4.5, 2, (b) => b / C.dur[4] > 0.66 && b / C.dur[4] < 0.96, 1.8);
      }
      st.tool = { kind: 'drill', r, tip, theta: spin(9), tilt: 0, alpha };
      st.hole = { rOf: drilled(r, BX0 + depth + tl), end: BX0 + depth + tl };
      if (coolant) st.coolant = coolantSvg(clockS, tip, r);
    } else if (si === 5) {
      const r = 3;
      const tip = u < 0.08 ? lerp(BX0 - 20, BX0, span(u, 0, 0.08)) : BX0 + 112 * span(u, 0.08, 0.92);
      st.tool = { kind: 'gun', r, tip, theta: spin(1.6), tilt: 0, alpha: 1 };
      st.hole = { rOf: (x) => (x <= tip ? r : 0), end: Math.max(BX0, tip) };
      if (u > 0.08) {
        st.coolant = coolantSvg(clockS, tip, r);
        st.chips = chipsSvg(clockS, 4, 2, (b) => b / C.dur[5] > 0.1 && b / C.dur[5] < 0.92, 1.6);
      }
    }
    return st;
  }

  function renderDrill(si, u) {
    const st = drillState(si, u);
    const t = st.tool;
    if (t) {
      const ts = toolSvg(t);
      const a = t.alpha === undefined ? 1 : t.alpha;
      set(E.tool, ts.body);
      set(E.flutes, ts.flutes);
      fade(E.tool, a);
      fade(E.flutes, a);
      move(E.unit, [t.tip - STICK - X_NUT, 0, 0]);
    } else {
      set(E.tool, '');
      set(E.flutes, '');
    }
    const sec = sectionSvg(st.hole);
    set(E.secBack, sec.back);
    set(E.secFront, sec.front);
    // the hole's outline shows once no tool fills the hole
    set(E.rim, !t || t.tip <= BX0 + 0.5 || (t.alpha ?? 1) < 0.05 ? sec.rim : '');
    for (const k of ['secBack', 'secFront', 'rim']) fade(E[k], st.secAlpha);
    set(E.pin, st.pin);
    set(E.point, st.point);
    set(E.wander, st.wander);
    set(E.chips, st.chips);
    set(E.coolant, st.coolant);
  }

  // ------------------------------------------------------------ the measuring scenes
  const [mx, my] = C.MAG;
  const ZR = 78; // px for 0,05 mm: the radius of the Ø0,1 zone
  const PXMM = ZR / 0.05;
  function probeSvg(px, py, pz) {
    // carriage on the beam, the ram down to the probe head, the stylus and its ruby ball
    const yb = py - 14;
    const top = C.BEAM_Z + 16;
    let car = solidSvg(extrudeBox(px - 12, yb - 11, 24, 22, C.BEAM_Z - 4, top + 6), { tone: 'mid', crease: 'lo' });
    car += dotsSvg([at([px - 8, yb + 11, top + 2]), at([px + 8, yb + 11, top + 2])], { size: 0.5 });
    const ramTop = C.BEAM_Z - 4;
    const head = pz + 26;
    let probe = solidSvg(extrudeBox(px - 5, py - 5, 10, 10, head + 10, ramTop), { tone: 'mid', crease: 'lo' });
    const Fh = G.frameOf([px, py, head + 10], [0, 0, -1], X, Y);
    probe += solidSvg(G.solidOf([[0, 6], [6, 6], [9, 3.6], [10, 3.6]], Fh, P), { tone: 'hi', crease: 'lo' });
    const Fs = G.frameOf([px, py, head], [0, 0, -1], X, Y);
    probe += solidSvg(G.solidOf([[0, 1.2], [24, 0.8]], Fs, P), { tone: 'hi', crease: 'lo' });
    probe += solidSvg(G.sphereOf([px, py, pz + 1.6], 2, P), { tone: 'hi', crease: 'lo' });
    return { car, probe };
  }
  function extrudeBox(x, y, w, d, z0, z1) {
    return G.prismOf(G.frameOf([0, 0, z0], Z, X, Y), [[x, y], [x + w, y], [x + w, y + d], [x, y + d]], 0, z1 - z0, P);
  }
  function pinSolid(x, y, z0, z1) {
    if (z1 - z0 < 0.2) return '';
    const F = G.frameOf([x, y, z0], Z, X, Y);
    return solidSvg(G.solidOf(z1 >= C.CMMZ + C.GAUGE_T + C.PIN_H - 0.01 ? [[0, C.HOLE_R - 0.5], [z1 - z0 - 1, C.HOLE_R - 0.5], [z1 - z0, C.HOLE_R - 1.4]] : [[0, C.HOLE_R - 0.5], [z1 - z0, C.HOLE_R - 0.5]], F, P), { tone: 'hi', crease: 'lo' });
  }

  function renderMeasure(si, u) {
    const lang = document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'nl';
    const h3 = C.HOLES[2];
    let partZ = C.CMMZ;
    let magOn = 1;
    let base = '';
    let ted = '';
    let zone = '';
    let perp = '';
    let hit = '';
    let labels = '';
    if (si === 6) {
      // the probe travels to hole 3, dips in and touches the wall at four points
      const go = span(u, 0.05, 0.35);
      const px = lerp(C.PART.x + C.PART.w / 2, h3[0], go);
      const py = lerp(C.PART.y + C.PART.d / 2, h3[1], go);
      const dip = span(u, 0.36, 0.46) * (1 - span(u, 0.88, 0.96));
      const pz = lerp(C.CMMZ + C.PART_T + 34, C.CMMZ + C.PART_T - 5, dip);
      const touch = clamp((u - 0.48) / 0.36, 0, 1);
      const k = Math.floor(touch * 4);
      const wob = dip > 0.99 && touch < 1 ? Math.sin((touch * 4 - k) * Math.PI) * 2.2 : 0;
      const dir = (k * Math.PI) / 2;
      const p = probeSvg(px + Math.cos(dir) * wob, py + Math.sin(dir) * wob, pz);
      set(E.carriage, p.car);
      set(E.probe, p.probe);
      for (const e of [E.legL, E.legR, E.beam]) move(e, [0, py - 14, 0]);
      const l3 = at([h3[0] + 12, h3[1] + 8, C.CMMZ + C.PART_T]);
      labels = label(l3[0], l3[1], '3', 16);
      // the magnifier: hole 3 seen from above
      base = mark(`M${mx - C.MAG_R} ${my}L${mx + C.MAG_R} ${my}M${mx} ${my - C.MAG_R}L${mx} ${my + C.MAG_R}`, ' style="stroke-width:.8;opacity:.55"');
      // theoretically exact dimensions: boxed, from the datum edges to the exact place
      const bx = mx - 84;
      const by = my + 70;
      ted = mark(`M${mx - C.MAG_R} ${my + 0.01}L${mx} ${my}`, ' style="stroke-width:1.6"') + mark(`M${mx} ${my + C.MAG_R}L${mx} ${my}`, ' style="stroke-width:1.6"')
        + `<rect class="fp-box" x="${bx - 15}" y="${my - 30}" width="30" height="22" rx="2"/>` + label(bx, my - 13, 'x', 16, 'middle', true)
        + `<rect class="fp-box" x="${mx + 8}" y="${by - 15}" width="30" height="22" rx="2"/>` + label(mx + 23, by + 2, 'y', 16, 'middle', true)
        + `<circle class="fp-ink" cx="${mx}" cy="${my}" r="3.5"/>`;
      zone = `<circle class="dr-zone" cx="${mx}" cy="${my}" r="${ZR}"/>`;
      const hitOn = span(u, 0.7, 0.78);
      if (hitOn > 0.01) {
        const hx = mx + C.DX * PXMM;
        const hy = my - C.DY * PXMM;
        hit = `<g style="opacity:${hitOn.toFixed(2)}">` + mark(`M${mx} ${my}L${f1(hx)} ${my}L${f1(hx)} ${f1(hy)}`, ' stroke-dasharray="4 3"') + mark(`M${mx} ${my}L${f1(hx)} ${f1(hy)}`, ' style="stroke-width:2"')
          + `<circle class="dr-dot" cx="${f1(hx)}" cy="${f1(hy)}" r="5"/>` + label(mx + (hx - mx) / 2, my + 22, 'dx', 15, 'middle', true) + label(hx + 8, my + (hy - my) / 2 + 5, 'dy', 15, 'start', true) + '</g>';
      }
      magOn = span(u, 0.02, 0.12);
    } else {
      // haaksheid in the magnifier, then the part goes onto the functional gauge
      magOn = 1 - span(u, 0.36, 0.42);
      const lift = span(u, 0.42, 0.52);
      const down = span(u, 0.62, 0.82);
      const top = C.CMMZ + C.GAUGE_T + C.PIN_H + 6;
      partZ = down > 0 ? lerp(top, C.CMMZ + C.GAUGE_T, down) : lerp(C.CMMZ, top, lift);
      const gOn = span(u, 0.44, 0.52);
      fade(E.gauge, gOn);
      fade(E.pinsLo, gOn);
      fade(E.pinsHi, gOn);
      move(E.gauge, [0, 0, -30 * (1 - gOn)]);
      let lo = '';
      let hi = '';
      const pTop = C.CMMZ + C.GAUGE_T + C.PIN_H;
      const z0 = C.CMMZ + C.GAUGE_T - 30 * (1 - gOn);
      for (const [x, y] of C.HOLES) {
        const zt = pTop - 30 * (1 - gOn);
        lo += pinSolid(x, y, z0, Math.min(zt, partZ));
        if (zt > partZ + C.PART_T) hi += pinSolid(x, y, partZ + C.PART_T, zt);
      }
      set(E.pinsLo, lo);
      set(E.pinsHi, hi);
      // side view: the part cut through a hole, datum face A at the bottom
      const sx = mx;
      const yA = my + 64;
      const hw = 22;
      const hTop = my - 52;
      const tiltPx = 7;
      const hatchOf = (x0, x1) => { let d = ''; for (let c = x0 - 80; c < x1; c += 9) { const a0 = Math.max(x0, c); const a1 = Math.min(x1, c + (yA - hTop)); if (a1 > a0) d += `M${a0} ${yA - (a0 - c)}L${a1} ${yA - (a1 - c)}`; } return d; };
      base = `<rect class="fp-box" x="${sx - 130}" y="${hTop}" width="${130 - hw}" height="${yA - hTop}"/><rect class="fp-box" x="${sx + hw}" y="${hTop}" width="${130 - hw}" height="${yA - hTop}"/>`
        + `<path class="iso-line" data-tone="faint" d="${hatchOf(sx - 130, sx - hw)}${hatchOf(sx + hw, sx + 130)}"/>`
        + mark(`M${sx - 130} ${yA + 1}L${sx + 130} ${yA + 1}`, ' style="stroke-width:2.4"')
        + `<path class="fp-ink" d="M${sx - 70} ${yA + 2}L${sx - 79} ${yA + 15}L${sx - 61} ${yA + 15}Z"/>` + label(sx - 50, yA + 20, 'A', 17, 'start', true);
      perp = `<rect class="dr-zone" x="${sx - 9}" y="${hTop - 12}" width="18" height="${yA - hTop + 12}"/>` + mark(`M${sx - tiltPx * 0.5} ${yA}L${sx + tiltPx * 0.5} ${hTop - 8}`, ' stroke-dasharray="6 4" style="stroke-width:1.6"')
        + label(sx + 30, hTop - 18, 'Ø', 16, 'start', true);
      const l = at([C.GAUGE.x + C.GAUGE.w - 6, C.GAUGE.y + C.GAUGE.d, C.CMMZ + 2]);
      labels = '';
      void l;
    }
    void lang;
    move(E.part, [0, 0, partZ]);
    set(E.magBase, base);
    set(E.magTed, ted);
    set(E.magZone, zone);
    set(E.magPerp, perp);
    set(E.magHit, hit);
    set(E.worldLabels, labels);
    fade(E.mag, magOn);
  }

  function render(si, u) {
    if (si !== shown) {
      shown = si;
