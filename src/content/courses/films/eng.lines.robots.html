// variant, the timeline, beats, the narration hold and the page parameters.
// No imports and no DOM: the build inlines this file into every film page (with
// its `export` words stripped), and tests/film.test.js imports it as it is.

const wordsOf = (text) => String(text || '').trim().split(/\s+/).filter(Boolean).length;

// A scene lasts at least (caption words / 2.5) + 2 s, so it can be read.
const minSceneDur = (words) => words / 2.5 + 2;

// "De {t:Snijsnelheid} is {n:220} m/min" → text, term and number pieces.
// {t:Term|shown} names lesson term Term but shows "shown" (another form).
function parseMarked(src) {
  const out = [];
  const re = /\{([a-z]):([^{}]*)\}/g;
  let last = 0;
  let m;
  const plain = (s) => {
    if (/[{}]/.test(s)) throw new Error(`bad marker in "${src}"`);
    if (s) out.push({ text: s });
  };
  while ((m = re.exec(src))) {
    plain(src.slice(last, m.index));
    if (m[1] === 't') {
      const [term, shown] = m[2].split('|');
      out.push({ term: term.trim(), shown: (shown ?? term).trim() });
    } else if (m[1] === 'n') out.push({ num: m[2].trim() });
    else throw new Error(`bad marker {${m[1]}:} in "${src}"`);
    last = re.lastIndex;
  }
  plain(src.slice(last));
  return out;
}

// "1167" → 1.167 (nl) or 1,167 (en); "0.3" → 0,3 or 0.3. Decimals as written.
function formatNumber(raw, lang) {
  const s = String(raw);
  if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error(`not a plain number: ${s}`);
  const [int, dec] = s.split('.');
  const group = lang === 'en' ? ',' : '.';
  const point = lang === 'en' ? '.' : ',';
  const body = int.replace(/^-/, '');
  const grouped = body.length >= 4 ? body.replace(/\B(?=(\d{3})+(?!\d))/g, group) : body;
  return (int.startsWith('-') ? '-' : '') + grouped + (dec !== undefined ? point + dec : '');
}

// A resolved caption is a list of strings and term pieces {t, en?, c}. In Dutch
// a term carries its English word (en) on first use only.
const plainOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t + (p.en ? ` (${p.en})` : ''))).join('');
// Units and signs a voice would spell out or skip, said as words. Longest first.
// Also for Piper (espeak-ng reads "6,0" as "zes komma nul" and "€8,67" badly).
const SAY = {
  // 1.167 is "elfhonderdzevenenzestig" (espeak-ng says "duizend honderd zevenenzestig")
  nl: [[/\b([1-9])\.([1-9])(\d\d)\b/g, (m, a, b, cd) => `${a}${b}honderd${cd === '00' ? '' : ` ${Number(cd)}`}`],
    [/omw\/min/g, 'omwentelingen per minuut'], [/\bmm\/min\b/g, 'millimeter per minuut'], [/\bm\/min\b/g, 'meter per minuut'], [/µm\b/g, 'micrometer'], [/\brpm\b/g, 'omwentelingen per minuut'],
    [/€\s?(\d[\d.]*(?:,\d+)?)/g, '$1 euro'], [/(\d),0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimeter'], [/(\d)\s?min\b/g, '$1 minuten'], [/(\d)\s?%/g, '$1 procent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' maal '], [/\s\/\s/g, ' gedeeld door '], [/\s=\s/g, ' is '], [/°/g, ' graden'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    // acronym pairs (MIG/MAG, IQ/OQ/PQ) without the slash, t8/5, and a standard's number in parts
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 deel $3'],
    // the weld standards as said on the floor (ISO 58 17, not "vijfduizend..."), the execution
    // classes as letters, and the ISO 6520-1 code 401 digit by digit; only these, so ISO 9001 stays
    [/\bISO (5817|9712)\b/g, (m, n) => `ISO ${n.slice(0, 2)} ${n.slice(2)}`], [/\bEXC([1-4])\b/g, 'E X C $1'], [/\b401\b/g, 'vier nul één'],
    // MIG, MAG and TIG on their own as letters, like MAG-lassen (espeak-ng reads MAG as the verb "mag")
    [/\b(MIG|MAG|TIG)\b(?!-)/g, (m) => m.split('').join(' ')],
    // DOE (design of experiments) as letters in both languages, not the Dutch verb "doe" or the English "doe"
    [/\bDOE\b/g, 'D O E']],
  en: [[/\brpm\b/g, 'revolutions per minute'], [/\bmm\/min\b/g, 'millimetres per minute'], [/\bm\/min\b/g, 'metres per minute'], [/µm\b/g, 'micrometres'],
    [/€\s?(\d[\d,]*(?:\.\d+)?)/g, '$1 euros'], [/(\d)\.0(?![\d])/g, '$1'], [/(\d)\s?mm\b/g, '$1 millimetres'], [/(\d)\s?min\b/g, '$1 minutes'], [/(\d)\s?%/g, '$1 percent'],
    [/Ø\s*/g, 'diameter '], [/(\d)\+(\d)/g, '$1 plus $2'], [/\s×\s/g, ' times '], [/\s\/\s/g, ' divided by '], [/\s=\s/g, ' is '], [/°/g, ' degrees'], [/\bRa\b/g, 'R a'], [/’/g, "'"],
    [/\b([A-Z]{2,})\/(?=[A-Z]{2,}\b)/g, '$1 '], [/\bt8\/5\b/g, 't 8 5'], [/\bISO (\d\d)(\d\d)-(\d)\b/g, 'ISO $1 $2 part $3'],
    [/\bISO (5817|9712)\b/g, (m, n) => `ISO ${n.slice(0, 2)} ${n.slice(2)}`], [/\bEXC([1-4])\b/g, 'E X C $1'], [/\b401\b/g, 'four oh one'],
    [/\bDOE\b/g, 'D O E']],
};
const sayable = (text, lang) => (SAY[lang] || []).reduce((s, [re, w]) => s.replace(re, w), text);
// The words the voice says: no English gloss, and with a language, units as words.
const speakOf = (seg, lang) => sayable(seg.map((p) => (typeof p === 'string' ? p : p.t)).join(''), lang).replace(/\s+/g, ' ').trim();
// What is said, as written (no gloss, units kept): the subtitles of the video.
const saidOf = (seg) => seg.map((p) => (typeof p === 'string' ? p : p.t)).join('').replace(/\s+/g, ' ').trim();

// v14b, the timeline driven by the narration audio. durs[scene][beat] is the
// length of each beat's recorded line (s). Each scene opens with a short look
// before the first line (the film itself with a longer lead), lines follow with
// a breath in between, and a scene holds a moment after its last line.
// The pauses of the narration, all in one place (seconds). Each sentence is one
// Piper clip (films/_kit/narrate.mjs), commas inside: the voice makes its own
// comma pause and keeps the sentence melody. Piper's own edge silence is
// trimmed to about 40 ms (films/_kit/speak.py), so these are the pauses heard:
// sentence after a full stop, beat between two lines, hold at a scene's end.
// The listen guard (films/_kit/listen-guard.mjs) checks them on the render.
const PAUSES = { sentence: 0.6, beat: 0.9, hold: 0.8 };
const AUDIO_GAPS = { lead: 0.8, look: 0.4, gap: PAUSES.beat, hold: PAUSES.hold, tail: 1.6 };
function audioTimeline(durs, gaps = AUDIO_GAPS) {
  const g = { ...AUDIO_GAPS, ...gaps };
  const scenes = [];
  let t = 0;
  durs.forEach((beats, si) => {
    const start = t;
    let at = start + (si === 0 ? g.lead : g.look);
    const out = beats.map((d, bi) => {
      if (!(d > 0)) throw new Error(`scene ${si + 1} beat ${bi + 1}: no audio`);
      const b = { start: round3(at), dur: round3(d) };
      at += d + (bi + 1 < beats.length ? g.gap : 0);
      return b;
    });
    t = round3(at + (si + 1 < durs.length ? g.hold : g.tail));
    scenes.push({ start: round3(start), dur: round3(t - start), beats: out });
  });
  return { scenes, total: t };
}
const round3 = (x) => Math.round(x * 1000) / 1000;

// Where time t falls on an audio timeline: the scene, the beat on screen (the
// last one started; the first while the scene opens) and the scene's progress u.
function timedAt(t, atl) {
  const sc = atl.scenes;
  let si = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) si = k;
  const s = sc[si];
  let bi = 0;
  for (let k = 0; k < s.beats.length; k++) if (t >= s.beats[k].start) bi = k;
  const u = Math.min(1, Math.max(0, (t - s.start) / s.dur));
  return { si, bi, u };
}

function timelineOf(scenes) {
  const starts = [];
  let t = 0;
  for (const s of scenes) { starts.push(t); t += s.dur; }
  return { starts, total: t };
}

function sceneIndexAt(t, tl) {
  let i = 0;
  for (let k = 0; k < tl.starts.length; k++) if (t >= tl.starts[k]) i = k;
  return i;
}

// ?scene=n is 1-based; anything odd opens the first scene.
function clampScene(param, count) {
  const n = parseInt(param, 10);
  if (!Number.isFinite(n) || n < 1) return 0;
  return Math.min(count, n) - 1;
}

// Beat starts within a scene (seconds), by each beat's share of the words.
function beatStarts(scene, lang) {
  const counts = scene.beats.map((b) => Math.max(1, wordsOf(b.text[lang] ?? b.text.nl)));
  const all = counts.reduce((a, b) => a + b, 0);
  const out = [];
  let acc = 0;
  for (const c of counts) { out.push(Math.round((acc / all) * scene.dur * 100) / 100); acc += c; }
  return out;
}

function beatIndexAt(scene, lang, local) {
  const starts = beatStarts(scene, lang);
  let i = 0;
  for (let k = 0; k < starts.length; k++) if (local >= starts[k]) i = k;
  return i;
}

// While a beat is being spoken the clock may run up to the next beat, or to the
// end of the scene for the last beat, and then holds there.
function holdLimit(tl, scenes, lang, sceneIndex, beatIndex) {
  const scene = scenes[sceneIndex];
  const starts = beatStarts(scene, lang);
  const local = beatIndex + 1 < starts.length ? starts[beatIndex + 1] : scene.dur;
  return tl.starts[sceneIndex] + local;
}

// The page's parameters: from its URL when opened on its own, else from the
// frame's name. The app hands the page over as srcdoc (a sandboxed frame's own
// navigation skips the service worker, so a src would be blank offline) and
// puts "?theme=…&lang=…" in the iframe's name attribute.
const searchOf = (search, name) => (search && search.length > 1 ? search
  : typeof name === 'string' && name.charAt(0) === '?' ? name : '');

function parseParams(search) {
  const q = new URLSearchParams(search || '');
  const theme = q.get('theme');
  const level = parseInt(q.get('level'), 10);
  return {
    theme: theme === 'light' || theme === 'dark' ? theme : null,
    lang: q.get('lang') === 'en' ? 'en' : 'nl',
    scene: q.get('scene'),
    reduce: q.get('motion') === 'reduce',
    muted: q.get('muted') === '1',
    level: [1, 2, 3, 4].includes(level) ? level : null,
    render: q.get('render') === '1',
  };
}

function fmtClock(sec) {
  const s = Math.max(0, Math.floor(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// Calm ease-in-out, and the eased progress of u through [a, b].
const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const span = (u, a, b) => ease(Math.min(1, Math.max(0, (u - a) / (b - a))));

;
const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

    const { sinA, cosA, sinE, cosE } = cameraOf(projection);

  $('[data-act="close"]').setAttribute('aria-label', STR.close);
  prevBtn.setAttribute('aria-label', STR.prev);
  nextBtn.setAttribute('aria-label', STR.next);
  scenesBtn.setAttribute('aria-label', STR.scenes);
  range.setAttribute('aria-label', STR.scrub);
  range.max = String(tl.total);
  const svgEl = stage.querySelector('svg');
  if (svgEl && DATA.label) svgEl.setAttribute('aria-label', DATA.label[LANG]);

  // scene ticks on the scrubber, and the scene list
  const ticks = $('.fp-ticks');
  tl.starts.slice(1).forEach((s) => { const i = document.createElement('i'); i.style.left = `${(s / tl.total) * 100}%`; ticks.append(i); });
  const list = $('.fp-list');
  scenes.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fp-item';
    b.innerHTML = `<span class="fp-item-n">${i + 1}</span><span class="fp-item-t"></span><span class="fp-item-d">${fmtClock(tl.starts[i])}</span>`;
    b.querySelector('.fp-item-t').textContent = s.title[LANG];
    b.addEventListener('click', () => { closeSheet(); jump(tl.starts[i]); if (!playing) play(); });
    list.append(b);
  });
  const speedBtn = $('[data-act="speed"]');
  speedBtn.querySelector('.fp-speed-l').textContent = STR.speed;

  // ---------------------------------------------------------------- narration
  const inFrame = window.parent !== window;
  let bridge = false;
  const post = (msg) => { try { window.parent.postMessage(Object.assign({ type: 'vp-film' }, msg), '*'); } catch (e) { /* no parent */ } };
  window.addEventListener('message', (e) => {
    if (!inFrame || e.source !== window.parent) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'vp-film') return;
    if (d.op === 'ready') { bridge = true; doc.dataset.narration = 'bridge'; }
    else if (d.op === 'said') lineDone(d.id, d.result);
  });
  if (inFrame) post({ op: 'hello' });
  if (inFrame) document.body.style.background = 'transparent'; // the app's card shows round the player
  doc.dataset.narration = 'local';
  doc.dataset.said = '0';

  const localSynth = (() => { try { return window.speechSynthesis && typeof SpeechSynthesisUtterance === 'function' ? window.speechSynthesis : null; } catch (e) { return null; } })();
  function localSay(id, text) {
    if (!localSynth) { setTimeout(() => lineDone(id, 'failed'), 0); return; }
    try {
      localSynth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'en' ? 'en-GB' : 'nl-NL';
      u.rate = rate;
      const code = LANG === 'en' ? 'en' : 'nl';
      const voices = localSynth.getVoices();
      const v = voices.find((x) => x.lang.toLowerCase().startsWith(code) && x.localService) || voices.find((x) => x.lang.toLowerCase().startsWith(code));
      if (v) u.voice = v;
      const t0 = Date.now();
      u.onend = () => lineDone(id, Date.now() - t0 < 300 ? 'failed' : 'spoken');
      u.onerror = () => lineDone(id, 'failed');
      localSynth.speak(u);
    } catch (e) { setTimeout(() => lineDone(id, 'failed'), 0); }
  }
  function sayBeat(si, bi) {
    const b = scenes[si].beats[bi];
    const text = (b.voice || b.speak)[LANG]; // the narration script when the film has one
    const id = nextId++;
    speaking = { id, scene: si, beat: bi };
    // never wait forever: some engines never end a line
    const limit = Math.max(6000, 2000 + text.length * 90) / rate;
    setTimeout(() => lineDone(id, 'timeout'), limit);
    if (bridge) post({ op: 'say', id, text, lang: LANG, rate });
    else localSay(id, text);
  }
  let failures = 0;
  function lineDone(id, result) {
    if (!speaking || speaking.id !== id || speaking.until) return;
    speaking.until = performance.now() + 400; // a breath before the next line
    doc.dataset.said = String(Number(doc.dataset.said) + 1);
    if (result === 'failed') { failures += 1; if (failures >= 2) note.textContent = STR.voice; }
  }
  function cancelSpeech() {
    if (speaking) { if (bridge) post({ op: 'cancel' }); else if (localSynth) { try { localSynth.cancel(); } catch (e) { /* ignore */ } } }
    speaking = null;
  }

  // ---------------------------------------------------------------- drawing
  const local = () => {
    const si = sceneIndexAt(t, tl);
    return { si, lt: t - tl.starts[si] };
  };
  let shownKey = '';
  function caption(si, bi) {
    const key = `${si}:${bi}`;
    if (key === shownKey) return;
    shownKey = key;
    const b = scenes[si].beats[bi];
    const line = b.seg[LANG].map((p) => {
      if (typeof p === 'string') return document.createTextNode(p);
      const s = document.createElement('span');
      s.className = 'fp-term';
      s.textContent = p.t;
      if (!p.en) return s;
      const f = document.createDocumentFragment();
      const en = document.createElement('span');
      en.className = 'fp-en';
      en.lang = 'en';
      en.textContent = ` (${p.en})`;
      f.append(s, en);
      return f;
    });
    // in a video frame the line sits centred in a band of fixed height (one span)
    if (PRM.render) { const one = document.createElement('span'); one.append(...line); cap.replaceChildren(one); } else cap.replaceChildren(...line);
    // the readout of this beat, or the last one before it in the scene
    let r = null;
    for (let k = bi; k >= 0 && !r; k--) r = scenes[si].beats[k].read || null;
    read.textContent = r ? r[LANG] : '';
    read.hidden = !r;
    const on = new Set(b.cues);
    cueEls.forEach((el) => el.toggleAttribute('data-on', on.has(el.getAttribute('data-cue'))));
  }
  function draw() {
    const { si, lt } = local();
    const s = scenes[si];
    const bi = beatIndexAt(s, LANG, lt);
    const u = reduce ? (s.beats[bi].still ?? s.still) : Math.min(1, Math.max(0, lt / s.dur)); // a beat may set its own still
    STAGE.render(si, u);
    caption(si, bi);
    if (!scrubbing) range.value = String(Math.round(t * 10) / 10);
    range.setAttribute('aria-valuetext', `${STR.scene(si + 1, scenes.length)}: ${s.title[LANG]}, ${fmtClock(t)}`);
    clock.textContent = `${fmtClock(t)} / ${fmtClock(tl.total)}`;
    doc.dataset.scene = String(si + 1);
  }

  // ---------------------------------------------------------------- clock
  function advance(dt) {
    let target = t + dt * rate;
    const now = performance.now();
    if (!muted && speaking) {
      if (speaking.until && now >= speaking.until) speaking = null;
      else target = Math.min(target, holdLimit(tl, scenes, LANG, speaking.scene, speaking.beat) - 0.001);
    }
    t = Math.max(t, target);
    if (t >= tl.total - 0.0005) { t = tl.total; finish(); return; }
    const { si, lt } = local();
    const bi = beatIndexAt(scenes[si], LANG, lt);
    const key = `${si}:${bi}`;
    if (key !== spokenKey) {
      spokenKey = key;
      if (!muted) sayBeat(si, bi);
    }
  }
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (playing && visible && !scrubbing) advance(dt);
    draw();
    if (playing) raf = requestAnimationFrame(frame);
  }
  const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };

  // ---------------------------------------------------------------- controls
  function setPlayBtn() {
    const label = ended ? STR.replay : playing ? STR.pause : STR.play;
    playBtn.setAttribute('aria-label', label);
    playBtn.dataset.state = ended ? 'replay' : playing ? 'pause' : 'play';
    main.dataset.playing = playing ? '1' : '0';
  }
  function play() {
    if (ended) { ended = false; t = 0; spokenKey = null; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    playing = true;
    setPlayBtn();
    kick();
  }
  function pause() {
    playing = false;
    cancelSpeech();
    spokenKey = null; // the beat speaks again from its start when play resumes
    setPlayBtn();
    draw();
  }
  function finish() {
    playing = false;
    ended = true;
    speaking = null;
    main.dataset.ended = '1';
    setPlayBtn();
  }
  function jump(to) {
    cancelSpeech();
    t = Math.max(0, Math.min(tl.total - 0.01, to));
    if (ended) { ended = false; main.dataset.ended = '0'; }
    if (!started) { started = true; poster.hidden = true; main.dataset.started = '1'; }
    spokenKey = null;
    setPlayBtn();
    draw();
  }
  const sceneStep = (dir) => {
    const { si, lt } = local();
    const to = dir < 0 ? (lt > 1.5 ? si : si - 1) : si + 1;
    if (to >= scenes.length) { jump(tl.total - 0.01); return; }
    jump(tl.starts[Math.max(0, to)]);
  };
  const toggle = () => (playing ? pause() : play());
  playBtn.addEventListener('click', toggle);
  $('.fp-poster-go').addEventListener('click', play);
  $('.fp-again').addEventListener('click', play);
  prevBtn.addEventListener('click', () => sceneStep(-1));
  nextBtn.addEventListener('click', () => sceneStep(1));
  function setMute(m) {
    muted = m;
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? STR.unmute : STR.mute);
    main.dataset.muted = muted ? '1' : '0';
    if (muted) cancelSpeech(); else spokenKey = null;
    if (inFrame) post({ op: 'mute', muted });
    else { try { localStorage.setItem('vp:filmMuted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ } }
  }
  muteBtn.addEventListener('click', () => setMute(!muted));
  speedBtn.addEventListener('click', () => {
    rate = rate === 1 ? 1.25 : 1;
    speedBtn.querySelector('.fp-speed-v').textContent = rate === 1 ? '1×' : '1,25×'.replace(',', LANG === 'en' ? '.' : ',');
    speedBtn.setAttribute('aria-pressed', rate !== 1 ? 'true' : 'false');
  });
  function openSheet() { sheet.hidden = false; scenesBtn.setAttribute('aria-expanded', 'true'); const { si } = local(); (list.children[si] || list.children[0]).focus(); }
  function closeSheet() { sheet.hidden = true; scenesBtn.setAttribute('aria-expanded', 'false'); }
  scenesBtn.addEventListener('click', () => (sheet.hidden ? openSheet() : closeSheet()));
  $('[data-act="close"]').addEventListener('click', () => { closeSheet(); scenesBtn.focus(); });

  // scrub: speech stops; the scene you land in speaks from its beat's start
  range.addEventListener('pointerdown', () => { scrubbing = true; cancelSpeech(); });
  const endScrub = () => { if (scrubbing) { scrubbing = false; spokenKey = null; kick(); } };
  range.addEventListener('pointerup', endScrub);
  range.addEventListener('pointercancel', endScrub);
  range.addEventListener('change', endScrub);
  range.addEventListener('input', () => { jump(Number(range.value)); if (playing) kick(); });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return; // the scrubber's own keys
    if (e.key === ' ' || e.key === 'k') { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') return; toggle(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { sceneStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { sceneStep(1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') setMute(!muted);
    else if (e.key === 'End') { jump(tl.starts[scenes.length - 1]); e.preventDefault(); }
    else if (e.key === 'Home') { jump(0); e.preventDefault(); }
    else if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  // pause when the film leaves the screen or the tab is hidden
  const away = () => { if (playing) pause(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) away(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (!visible) away();
    }, { threshold: 0.15 }).observe(stage);
  }
  const setMotion = () => { main.dataset.motion = reduce ? 'reduce' : 'full'; draw(); };
  reduceMq.addEventListener && reduceMq.addEventListener('change', () => { reduce = PRM.reduce || reduceMq.matches; setMotion(); });

  // tell the app how tall the film is, so its frame fits without scrolling
  if (inFrame && 'ResizeObserver' in window) {
    let lastH = 0;
    new ResizeObserver(() => {
      const hgt = Math.ceil(main.getBoundingClientRect().height + 2);
      if (Math.abs(hgt - lastH) > 1) { lastH = hgt; post({ op: 'size', h: hgt }); }
    }).observe(main);
  }

  if (PRM.render) {
    // the frame is the video: no poster, controls or speech; time from the script
    main.dataset.render = '1';
    doc.dataset.render = '1';
    poster.hidden = true;
    started = true;
    main.dataset.started = '1';
    let atl = null;
    window.__film = {
      total: tl.total,
      setTiming(next) { atl = next; return atl.total; },
      seek(time) {
        if (atl) {
          const at = timedAt(time, atl);
          STAGE.render(at.si, at.u);
          caption(at.si, at.bi);
        } else { t = Math.max(0, Math.min(tl.total, time)); draw(); }
        // the cue's glow breathes with the film's own clock, not the wall clock
        main.style.setProperty('--fp-b', `${(2.5 * (0.5 - 0.5 * Math.cos((2 * Math.PI * time) / 1.8))).toFixed(2)}px`);
        return true;
      },
    };
    window.__film.seek(0);
    return;
  }
  setMute(muted);
  setPlayBtn();
  setMotion();
})();
</script></body></html>
